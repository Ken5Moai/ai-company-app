<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>まもりの砦 — 光のクロニクル外伝</title>
<style>
/* ================================================================
   まもりの砦 / KEEP OF LIGHT
   「光のクロニクル」外伝。魔王亡きあとの残党から アルシア城を守る
   タワーディフェンス。RPG本編と同じ 専用UI・ドット絵・チップチューン。
   ================================================================ */
:root{
  --u:3px;
  --win-a:#0b1a48;
  --win-b:#04081f;
  --line:#ffffff;
  --line-in:#2b58c8;
  --ink:#ffffff;
  --dim:#93a6cc;
  --gold:#ffd75e;
  --hp:#5ee06a;
  --hp-mid:#ffd75e;
  --hp-low:#ff5a4a;
  --mp:#5ec8ff;
  --danger:#ff6a58;
  --font:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP","MS PGothic",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
body{
  font-family:var(--font);color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
#app{
  position:fixed;inset:0;display:grid;place-items:center;
  background:radial-gradient(120% 90% at 50% 0%,#151a2c 0%,#000 70%);
}
@media (orientation:portrait) and (pointer:coarse){
  #app{align-items:start;padding-top:max(env(safe-area-inset-top),4vh)}
}
#stage{
  position:relative;
  width:calc(256 * var(--u));
  height:calc(224 * var(--u));
  background:#000;overflow:hidden;
  box-shadow:0 0 0 calc(1*var(--u)) #232a44, 0 calc(6*var(--u)) calc(18*var(--u)) rgba(0,0,0,.8);
}
#screen{
  position:absolute;inset:0;width:100%;height:100%;
  image-rendering:pixelated;image-rendering:crisp-edges;display:block;
}
#stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:60;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.16) 0 1px,transparent 1px calc(2*var(--u)));
  opacity:.5;
}
#ui{position:absolute;inset:0;z-index:20;pointer-events:none}
#ui > *{pointer-events:auto}

/* ---------------- ウィンドウ ---------------- */
.win{
  position:absolute;
  background:linear-gradient(180deg,var(--win-a) 0%,var(--win-b) 100%);
  border:calc(1*var(--u)) solid var(--line);
  border-radius:calc(2.5*var(--u));
  box-shadow:
    inset 0 0 0 calc(1*var(--u)) var(--line-in),
    inset 0 calc(2*var(--u)) calc(6*var(--u)) rgba(90,140,255,.22),
    0 calc(2*var(--u)) 0 rgba(0,0,0,.65);
  padding:calc(4*var(--u)) calc(5*var(--u));
  font-size:calc(9*var(--u));line-height:1.65;letter-spacing:.04em;font-weight:700;
  text-shadow:0 calc(1*var(--u)) 0 rgba(0,0,0,.85);
  animation:winIn .12s steps(2) both;
}
@keyframes winIn{from{transform:scaleY(.55);opacity:.4}to{transform:none;opacity:1}}
.win.plain{animation:none}
.win.mid{left:0;right:0;margin-left:auto;margin-right:auto;width:max-content}
.win > .cap + .small{margin-top:calc(4*var(--u))}
.win .cap{
  position:absolute;top:calc(-4.5*var(--u));left:calc(5*var(--u));
  background:#04081f;border:calc(1*var(--u)) solid var(--line-in);
  border-radius:calc(1.5*var(--u));
  font-size:calc(6.5*var(--u));letter-spacing:.22em;color:var(--gold);
  padding:0 calc(2.5*var(--u));line-height:1.7;
}
#msgWin{left:calc(5*var(--u));right:calc(5*var(--u));bottom:calc(54*var(--u));min-height:calc(40*var(--u));display:none}
#msgWin.on{display:block}
#msgWin .txt{white-space:pre-wrap;overflow-wrap:anywhere}
#msgWin .who{color:var(--gold);font-size:calc(8*var(--u));letter-spacing:.16em;display:block;margin-bottom:calc(1*var(--u))}
.more{position:absolute;right:calc(5*var(--u));bottom:calc(2*var(--u));font-size:calc(8*var(--u));animation:blink .6s steps(1) infinite;opacity:0}
.more.on{opacity:1}
@keyframes blink{50%{opacity:.15}}

.list{list-style:none;display:grid;gap:calc(.5*var(--u))}
.list.c2{grid-template-columns:1fr 1fr;column-gap:calc(6*var(--u))}
.list li{
  position:relative;padding:calc(.5*var(--u)) 0 calc(.5*var(--u)) calc(9*var(--u));
  display:flex;justify-content:space-between;gap:calc(4*var(--u));white-space:nowrap;cursor:pointer;
}
.list li .sub{color:var(--gold);font-variant-numeric:tabular-nums}
.list li.off{color:#5d6e93}
.list li.off .sub{color:#5d6e93}
.list li.sel::before{content:"▶";position:absolute;left:calc(0.5*var(--u));top:calc(.5*var(--u));animation:cur .5s steps(1) infinite}
@keyframes cur{50%{opacity:.2}}
.kv{display:flex;justify-content:space-between;gap:calc(4*var(--u));white-space:nowrap}
.kv b{color:var(--gold);font-variant-numeric:tabular-nums}
.small{font-size:calc(7.5*var(--u));color:var(--dim);letter-spacing:.1em}
.hr{height:calc(1*var(--u));background:var(--line-in);margin:calc(2*var(--u)) 0;opacity:.7}

/* ---------------- 情報バー ---------------- */
#hud{
  position:absolute;left:0;right:0;top:0;height:calc(17*var(--u));
  display:flex;align-items:center;gap:calc(6*var(--u));
  padding:0 calc(5*var(--u));
  background:linear-gradient(180deg,rgba(4,8,31,.94),rgba(4,8,31,.72));
  border-bottom:calc(1*var(--u)) solid var(--line-in);
  font-size:calc(8*var(--u));font-variant-numeric:tabular-nums;
  text-shadow:0 calc(1*var(--u)) 0 #000;z-index:25;
}
#hud .it{display:flex;align-items:center;gap:calc(2*var(--u))}
#hud .it i{font-style:normal;font-size:calc(6.5*var(--u));color:var(--dim);letter-spacing:.14em}
#hud .g b{color:var(--gold)}
#hud .w b{color:#fff}
#hud .h b{color:var(--hp)}
#hud .h.low b{color:var(--hp-low)}
#hud .sp{margin-left:auto;display:flex;gap:calc(3*var(--u))}
#hud button{
  font-family:var(--font);font-weight:700;font-size:calc(7*var(--u));letter-spacing:.1em;
  color:var(--ink);background:rgba(20,32,72,.9);
  border:calc(1*var(--u)) solid rgba(255,255,255,.45);border-radius:calc(2*var(--u));
  padding:calc(1*var(--u)) calc(3.5*var(--u));cursor:pointer;
}
#hud button.on{background:#2b58c8}

/* ---------------- 下の砦パレット ---------------- */
#dock{
  position:absolute;left:0;right:0;bottom:0;height:calc(46*var(--u));
  display:flex;align-items:stretch;gap:calc(2*var(--u));
  padding:calc(3*var(--u)) calc(4*var(--u));
  background:linear-gradient(180deg,rgba(4,8,31,.78),rgba(4,8,31,.97));
  border-top:calc(1*var(--u)) solid var(--line-in);z-index:25;
}
.card{
  flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:calc(1*var(--u));padding:calc(2*var(--u)) 0 calc(2*var(--u));
  background:linear-gradient(180deg,#132049,#070c22);
  border:calc(1*var(--u)) solid rgba(255,255,255,.34);border-radius:calc(2.5*var(--u));
  cursor:pointer;overflow:hidden;
}
.card canvas{width:calc(20*var(--u));height:calc(20*var(--u));image-rendering:pixelated;display:block}
.card .nm{font-size:calc(6.5*var(--u));letter-spacing:.06em}
.card .cost{font-size:calc(7*var(--u));color:var(--gold);font-variant-numeric:tabular-nums}
.card.sel{border-color:var(--gold);background:linear-gradient(180deg,#1d3070,#0b1738);box-shadow:0 0 calc(4*var(--u)) rgba(255,215,94,.5)}
.card.poor{opacity:.45}
.card.poor .cost{color:var(--hp-low)}

/* ---------------- 全画面 ---------------- */
.ov{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ov.on{display:flex}
#title{background:radial-gradient(90% 70% at 50% 22%,rgba(27,43,107,.42) 0%,rgba(7,11,30,.66) 52%,rgba(0,0,0,.9) 100%)}
#title .logo{
  font-size:calc(20*var(--u));letter-spacing:.16em;line-height:1.35;
  text-shadow:0 0 calc(6*var(--u)) rgba(120,170,255,.75),0 calc(2*var(--u)) 0 #23409c,0 calc(3*var(--u)) calc(6*var(--u)) rgba(0,0,0,.9);
  animation:logoIn 1.2s cubic-bezier(.2,1,.25,1) both;pointer-events:none;
}
#title .logo b{display:block;font-size:calc(10*var(--u));color:var(--gold);letter-spacing:.4em;text-indent:.4em;margin-bottom:calc(3*var(--u));text-shadow:0 calc(1*var(--u)) 0 #000}
@keyframes logoIn{from{opacity:0;transform:translateY(calc(6*var(--u))) scale(.94)}to{opacity:1;transform:none}}
#title .sub{margin-top:calc(3*var(--u));font-size:calc(7.5*var(--u));letter-spacing:.3em;color:#93a6cc;pointer-events:none}
#title .foot{
  position:absolute;bottom:calc(3*var(--u));left:calc(5*var(--u));right:calc(5*var(--u));
  font-size:calc(5.8*var(--u));letter-spacing:.12em;color:#54608a;line-height:1.8;pointer-events:none;
}
#title .foot i{font-style:normal;display:block}
#over{background:radial-gradient(90% 70% at 50% 40%,rgba(10,16,44,.88) 0%,rgba(0,0,0,.95) 100%)}
#over .big{font-size:calc(15*var(--u));letter-spacing:.3em}
#over.win .big{color:var(--gold);text-shadow:0 0 calc(8*var(--u)) rgba(255,215,94,.55)}
#over.lose .big{color:#c8412f;text-shadow:0 0 calc(8*var(--u)) rgba(200,60,40,.6)}
#over .stat{margin-top:calc(8*var(--u));font-size:calc(8*var(--u));line-height:2;color:#dbe4ff}
#over .stat b{color:var(--gold)}

#flash{position:absolute;inset:0;z-index:45;background:#fff;opacity:0;pointer-events:none}
#fade{position:absolute;inset:0;z-index:48;background:#000;opacity:0;pointer-events:none;transition:opacity .3s linear}
#fade.on{opacity:1}
.pop{
  position:absolute;z-index:40;pointer-events:none;
  font-size:calc(9*var(--u));font-weight:700;
  text-shadow:calc(1*var(--u)) calc(1*var(--u)) 0 #000,calc(-1*var(--u)) calc(1*var(--u)) 0 #000;
  animation:pop .8s ease-out forwards;transform:translate(-50%,0);
}
.pop.gold{color:var(--gold)}
.pop.dmg{color:#fff}
.pop.leak{color:#ff6a58;font-size:calc(11*var(--u))}
@keyframes pop{
  0%{transform:translate(-50%,0) scale(.6);opacity:0}
  20%{transform:translate(-50%,calc(-7*var(--u))) scale(1.1);opacity:1}
  100%{transform:translate(-50%,calc(-18*var(--u))) scale(1);opacity:0}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="screen" width="256" height="224"></canvas>
    <div id="hud">
      <div class="it w"><i>WAVE</i><b id="hWave">0</b><i>/20</i></div>
      <div class="it g"><i>G</i><b id="hGold">0</b></div>
      <div class="it h"><i>城</i><b id="hHp">20</b></div>
      <div class="sp">
        <button id="bSpeed">×1</button>
        <button id="bWave">つぎの波</button>
      </div>
    </div>
    <div id="dock"></div>
    <div id="ui"></div>
    <div id="flash"></div>
    <div id="fade"></div>
    <div id="title" class="ov on">
      <div class="logo"><b>KEEP OF LIGHT</b>まもりの砦</div>
      <div class="sub">ひかりの クロニクル 外伝</div>
      <div id="titleMenu"></div>
      <div class="foot">
        <i>街道に なかまを 配置して 20の波から アルシア城を まもりぬけ</i>
        <i>タップ / クリックで 配置・強化　　←↑↓→ と Z / X でも あそべます</i>
      </div>
    </div>
    <div id="over" class="ov"><div class="big"></div><div class="stat"></div><div id="overMenu"></div></div>
  </div>
</div>
<script>
"use strict";

/* ================================================================
   ユーティリティ ── 本編「光のクロニクル」と共通
   ================================================================ */
function $(id){ return document.getElementById(id); }
function el(tag, cls, html){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html != null) e.innerHTML = html;
  return e;
}
function rndInt(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function rndf(a, b){ return a + Math.random() * (b - a); }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function shade(hex, d){
  var n = parseInt(hex.slice(1), 16);
  var r = clamp((n >> 16) + d, 0, 255), g = clamp(((n >> 8) & 255) + d, 0, 255), b = clamp((n & 255) + d, 0, 255);
  return "rgb(" + r + "," + g + "," + b + ")";
}
/* 決定的な擬似乱数(マップ生成用) */
function mulberry(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(x, y){
  var h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967296;
}

/* ================================================================
   サウンド(WebAudio) ── 本編「光のクロニクル」と共通
   ================================================================ */
var Snd = {
  ac:null, master:null, on:true, cur:null, timer:null, step:0, nextT:0, track:null,
  init:function(){
    if(this.ac) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) { this.on = false; return; }
    this.ac = new AC();
    this.master = this.ac.createGain();
    this.master.gain.value = 0.24;
    this.master.connect(this.ac.destination);
  },
  resume:function(){
    if(this.ac && this.ac.state === "suspended") this.ac.resume();
    if(this.on && !this.cur && typeof Game !== "undefined" && Game && Game.scene === "title") this.play("castle");
  },
  freq:function(name){
    if(!name || name === "r") return 0;
    var m = /^([A-G])(#?)(-?\d)$/.exec(name);
    if(!m) return 0;
    var base = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]] + (m[2] ? 1 : 0);
    var midi = base + (parseInt(m[3], 10) + 1) * 12;
    return 440 * Math.pow(2, (midi - 69) / 12);
  },
  /* 単発の効果音 */
  se:function(kind){
    if(!this.on) return;
    this.init(); if(!this.ac) return;
    var t = this.ac.currentTime, ac = this.ac, self = this;
    function tone(f, f2, d, type, vol, delay){
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type || "square";
      var st = t + (delay || 0);
      o.frequency.setValueAtTime(f, st);
      if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), st + d);
      g.gain.setValueAtTime(0, st);
      g.gain.linearRampToValueAtTime(vol == null ? 0.5 : vol, st + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0008, st + d);
      o.connect(g); g.connect(self.master); o.start(st); o.stop(st + d + 0.02);
    }
    function noise(d, vol, delay, hp){
      var len = Math.floor(ac.sampleRate * d), buf = ac.createBuffer(1, len, ac.sampleRate), ch = buf.getChannelData(0);
      for(var i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var s = ac.createBufferSource(); s.buffer = buf;
      var f = ac.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp || 700;
      var g = ac.createGain(); g.gain.value = vol == null ? 0.4 : vol;
      s.connect(f); f.connect(g); g.connect(self.master); s.start(t + (delay || 0));
    }
    switch(kind){
      case "cursor": tone(880, 0, 0.05, "square", 0.22); break;
      case "ok":     tone(660, 0, 0.06, "square", 0.3); tone(990, 0, 0.09, "square", 0.26, 0.05); break;
      case "cancel": tone(400, 220, 0.11, "square", 0.26); break;
      case "buy":    tone(784, 0, 0.07, "square", 0.3); tone(1046, 0, 0.12, "square", 0.28, 0.07); break;
      case "err":    tone(180, 120, 0.2, "sawtooth", 0.25); break;
      case "hit":    noise(0.16, 0.5, 0, 500); tone(180, 60, 0.13, "square", 0.3); break;
      case "crit":   noise(0.24, 0.6, 0, 300); tone(300, 50, 0.24, "sawtooth", 0.35); break;
      case "guard":  tone(500, 700, 0.1, "triangle", 0.3); noise(0.08, 0.2, 0, 2000); break;
      case "miss":   tone(300, 500, 0.09, "triangle", 0.22); break;
      case "heal":   [523,659,784,1046].forEach(function(f, i){ tone(f, 0, 0.3, "triangle", 0.28, i * 0.06); }); break;
      case "spell":  tone(220, 1400, 0.3, "sawtooth", 0.22); break;
      case "fire":   noise(0.4, 0.4, 0, 250); tone(120, 700, 0.35, "sawtooth", 0.22); break;
      case "ice":    [1400,1100,1700,1300].forEach(function(f, i){ tone(f, f * 0.6, 0.14, "triangle", 0.22, i * 0.05); }); break;
      case "thunder":noise(0.5, 0.55, 0, 900); tone(90, 40, 0.5, "sawtooth", 0.3); break;
      case "wind":   noise(0.45, 0.3, 0, 1200); break;
      case "enc":    [0,1,2,3,4,5].forEach(function(i){ tone(200 + i * 260, 200 + i * 320, 0.09, "square", 0.3, i * 0.055); }); break;
      case "run":    [0,1,2,3].forEach(function(i){ tone(900 - i * 120, 0, 0.06, "square", 0.24, i * 0.05); }); break;
      case "door":   tone(300, 160, 0.14, "square", 0.24); break;
      case "stairs": [523,659,784].forEach(function(f, i){ tone(f, 0, 0.09, "square", 0.26, i * 0.05); }); break;
      case "chest":  [659,784,988,1319].forEach(function(f, i){ tone(f, 0, 0.16, "square", 0.28, i * 0.07); }); break;
      case "dead":   tone(400, 60, 0.7, "sawtooth", 0.3); break;
      case "levelup":[523,659,784,1046,1319].forEach(function(f, i){ tone(f, 0, 0.5, "square", 0.3, i * 0.1); }); break;
      case "item":   tone(880, 0, 0.07, "triangle", 0.3); tone(1174, 0, 0.14, "triangle", 0.26, 0.07); break;
      case "swing":  noise(0.07, 0.20, 0, 1600); tone(520, 300, 0.06, "square", 0.14); break;
      case "leak":   tone(220, 90, 0.45, "sawtooth", 0.34); noise(0.3, 0.4, 0, 300); break;
      case "wave":   [392,523,659].forEach(function(f, i){ tone(f, 0, 0.18, "square", 0.28, i * 0.09); }); break;
      case "clearwave": [523,659,784,1046].forEach(function(f, i){ tone(f, 0, 0.22, "square", 0.26, i * 0.08); }); break;
    }
  },
  /* BGM */
  play:function(name){
    if(this.cur === name) return;
    this.cur = name;
    this.stop(true);
    if(!this.on) return;
    this.init(); if(!this.ac) return;
    this.track = BGM[name];
    if(!this.track) return;
    this.step = 0;
    this.nextT = this.ac.currentTime + 0.08;
    var self = this;
    this.timer = setInterval(function(){ self.tick(); }, 25);
  },
  stop:function(keepName){
    if(this.timer){ clearInterval(this.timer); this.timer = null; }
    this.track = null;
    if(!keepName) this.cur = null;
  },
  tick:function(){
    if(!this.track || !this.ac) return;
    var spb = 60 / this.track.bpm / 4;                 /* 1ステップ=16分 */
    while(this.nextT < this.ac.currentTime + 0.2){
      this.voice(this.track.lead, this.step, spb, "square", 0.16, 0);
      if(this.track.bass) this.voice(this.track.bass, this.step, spb, "triangle", 0.24, -0);
      if(this.track.drum) this.drum(this.track.drum, this.step, spb);
      this.step++;
      this.nextT += spb;
    }
  },
  voice:function(seq, step, spb, type, vol, det){
    var i = step % seq.length, tok = seq[i];
    if(!tok || tok === "-" || tok === "r") return;
    var len = 1;
    while(seq[(i + len) % seq.length] === "-" && len < 16) len++;
    var f = this.freq(tok); if(!f) return;
    var ac = this.ac, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    var t = this.nextT, d = spb * len * 0.92;
    g.gain.setValueAtTime(0, t);

    g.gain.setValueAtTime(vol, t + d * 0.6);

  drum:function(seq, step, spb){

      o.type = "square"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.26, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + nd[1] * 0.95);

};

/* ================================================================
   入力 ── 本編「光のクロニクル」と共通
   ================================================================ */
var Input = {
  held:{}, queue:[], waiters:[],
  dirOf:function(){
    if(this.held.up) return "up";
    if(this.held.down) return "down";
    if(this.held.left) return "left";
    if(this.held.right) return "right";
    return null;
  },
  press:function(k){
    this.queue.push(k);
    if(this.queue.length > 4) this.queue.shift();
    var w = this.waiters; this.waiters = [];
    w.forEach(function(fn){ fn(k); });
  },
  take:function(){ return this.queue.shift(); },
  clear:function(){ this.queue.length = 0; },
  wait:function(keys){
    var self = this;
    return new Promise(function(res){
      function on(k){
        if(!keys || keys.indexOf(k) >= 0) res(k);
        else self.waiters.push(on);
      }
      self.waiters.push(on);
    });
  }
};
(function(){
  var MAP = {
    ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right",
    KeyW:"up", KeyS:"down", KeyA:"left", KeyD:"right",
    Enter:"confirm", Space:"confirm", KeyZ:"confirm", NumpadEnter:"confirm",
    Escape:"cancel", KeyX:"cancel", Backspace:"cancel", ShiftLeft:"cancel"
  };
  function typing(e){
    var t = e.target;
    return t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT");
  }
  addEventListener("keydown", function(e){
    if(typing(e)) return;
    var k = MAP[e.code];
    if(!k) return;
    e.preventDefault();
    Snd.resume();
    if(!e.repeat) Input.press(k);
    Input.held[k] = 1;
  }, {passive:false});
  addEventListener("keyup", function(e){
    if(typing(e)) return;
    var k = MAP[e.code]; if(!k) return;
    Input.held[k] = 0;
  });
  addEventListener("pointerdown", function(){ Snd.resume(); }, {once:false});
})();

/* ================================================================
   ウィンドウUI ── 本編「光のクロニクル」と共通
   ================================================================ */
var UI = {
  layer:$("ui"),
  clearAll:function(){ this.layer.innerHTML = ""; },
  win:function(css, html, cls){
    var w = el("div", "win " + (cls || ""), html || "");
    for(var k in css) w.style[k] = css[k];
    this.layer.appendChild(w);
    return w;
  },
  /* --- メッセージ --- */
  msgWin:null,
  openMsg:function(){
    if(this.msgWin) return this.msgWin;
    var w = el("div", "win", '<div class="txt"></div><span class="more">▼</span>');
    w.id = "msgWin"; w.classList.add("on");
    this.layer.appendChild(w);
    this.msgWin = w;
    return w;
  },
  closeMsg:function(){ if(this.msgWin){ this.msgWin.remove(); this.msgWin = null; } },
  /* 1ページ表示。wait=true なら決定キー待ち */
  say:async function(text, opt){
    opt = opt || {};
    var w = this.openMsg();
    var t = w.querySelector(".txt"), more = w.querySelector(".more");
    more.classList.remove("on");
    var head = opt.who ? '<span class="who">' + esc(opt.who) + '</span>' : "";
    t.innerHTML = head;
    var body = document.createTextNode("");
    t.appendChild(body);
    var s = String(text), i = 0;
    Input.clear();
    var skipped = false;
    while(i < s.length){
      if(!skipped && Input.queue.length){ Input.clear(); skipped = true; }
      if(skipped){ body.nodeValue = s; break; }
      body.nodeValue = s.slice(0, ++i);
      if(s[i - 1] !== "\n") await sleep(opt.speed || 18);
    }
    if(opt.nowait) return;
    more.classList.add("on");
    await Input.wait(["confirm","cancel"]);
    Snd.se("cursor");
    more.classList.remove("on");
  },
  /* 複数ページ */
  sayAll:async function(lines, opt){
    lines = [].concat(lines);
    for(var i = 0; i < lines.length; i++) await this.say(lines[i], opt);
  },
  flash:function(ms, color){
    var f = $("flash");
    f.style.background = color || "#fff";
    f.style.transition = "none"; f.style.opacity = "0.85";
    setTimeout(function(){ f.style.transition = "opacity " + (ms || 220) + "ms linear"; f.style.opacity = "0"; }, 16);
  },
  fade:function(on){
    $("fade").classList.toggle("on", !!on);
    return sleep(340);
  },
  pop:function(x, y, text, cls){
    var p = el("div", "pop " + (cls || "dmg"), esc(text));
    p.style.left = (x / SCR_W * 100) + "%";
    p.style.top = (y / SCR_H * 100) + "%";
    this.layer.appendChild(p);
    setTimeout(function(){ p.remove(); }, 900);
  },
  /* --- 選択リスト --- 戻り値: 選択index / -1(キャンセル) --- */
  list:function(opt){
    var self = this;
    var items = opt.items;
    var w = el("div", "win " + (opt.cls || ""));
    if(opt.cap) w.appendChild(el("div", "cap", esc(opt.cap)));
    if(opt.head) w.appendChild(el("div", "small", opt.head));
    var ul = el("ul", "list" + (opt.cols === 2 ? " c2" : opt.cols === 3 ? " c3" : ""));
    items.forEach(function(it, i){
      var li = el("li");
      li.innerHTML = '<span>' + esc(it.l) + '</span>' + (it.s != null ? '<span class="sub">' + esc(it.s) + '</span>' : "");
      if(it.off) li.classList.add("off");
      li.dataset.i = i;
      ul.appendChild(li);
    });
    w.appendChild(ul);
    if(opt.foot) w.appendChild(el("div", "small", opt.foot));
    var css = opt.css || {};
    for(var k in css) w.style[k] = css[k];
    /* 長い一覧は ウィンドウごとではなく 中身だけをスクロールさせる。
       ウィンドウを overflow:auto にすると 見出し(.cap)が切れてしまうため。 */
    if(css.maxHeight){
      w.style.maxHeight = "";
      w.style.overflow = "";
      ul.style.maxHeight = css.maxHeight;
      ul.style.overflowY = "auto";
    }
    (opt.into || this.layer).appendChild(w);

    var idx = opt.index || 0;
    /* 初期カーソルが選べない項目なら、選べる最初の項目へ寄せる */
    if(items[idx] && (items[idx].off || items[idx].skip)){
      for(var q = 0; q < items.length; q++){
        var n2 = (idx + q) % items.length;
        if(!items[n2].off && !items[n2].skip){ idx = n2; break; }
      }
    }
    var lis = [].slice.call(ul.children);
    function draw(){
      lis.forEach(function(li, i){ li.classList.toggle("sel", i === idx); });
      if(lis[idx] && lis[idx].scrollIntoView){
        try{ lis[idx].scrollIntoView({block:"nearest"}); }catch(e){}
      }
      if(opt.onMove) opt.onMove(idx);
    }
    draw();
    return new Promise(function(res){
      function done(v){
        cleanup();
        w.remove();
        res(v);
      }
      function move(d){
        var n = items.length, cols = opt.cols || 1, step = (d === "up" || d === "down") ? cols : 1;
        var dir = (d === "up" || d === "left") ? -1 : 1;
        var next = idx;
        for(var g = 0; g < n; g++){
          next = (next + dir * step + n * 2) % n;
          if(!items[next].skip) break;
        }
        if(next !== idx){ idx = next; Snd.se("cursor"); draw(); }
      }
      function onKey(k){
        if(k === "up" || k === "down" || k === "left" || k === "right"){ move(k); return; }
        if(k === "confirm"){
          if(items[idx].off){ Snd.se("err"); return; }
          Snd.se("ok"); done(idx);
        } else if(k === "cancel"){
          if(opt.noCancel){ Snd.se("err"); return; }
          Snd.se("cancel"); done(-1);
        }
      }
      var pumping = true;
      function pump(){
        if(!pumping) return;
        var k;
        while((k = Input.take())) onKey(k);
        requestAnimationFrame(pump);
      }
      pump();
      function onClick(e){
        var li = e.target.closest ? e.target.closest("li") : null;
        if(!li || !ul.contains(li)) return;
        var i = +li.dataset.i;
        if(items[i].skip) return;
        if(i !== idx){ idx = i; draw(); Snd.se("cursor"); return; }
        if(items[i].off){ Snd.se("err"); return; }
        Snd.se("ok"); done(i);
      }
      ul.addEventListener("click", onClick);
      function cleanup(){ pumping = false; ul.removeEventListener("click", onClick); }
      w.__close = function(){ done(-1); };
    });
  },
  yesno:async function(text, opt){
    opt = opt || {};
    if(text) await this.say(text, {nowait:true});
    var i = await this.list({
      items:[{l:"はい"},{l:"いいえ"}],
      css:opt.css || {right:"calc(6*var(--u))", bottom:"calc(66*var(--u))", minWidth:"calc(48*var(--u))"},
      index:opt.def || 0
    });
    return i === 0;
  }
};

/* ================================================================
   描画ヘルパ ── 本編「光のクロニクル」と共通
   ================================================================ */
function P(g, x, y, w, h, c){ g.fillStyle = c; g.fillRect(x | 0, y | 0, w | 0, h | 0); }
function E(g, x, y, rx, ry, c){ g.fillStyle = c; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 6.2832); g.fill(); }
function TRI(g, pts, c){
  g.fillStyle = c; g.beginPath(); g.moveTo(pts[0], pts[1]);
  for(var i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
  g.closePath(); g.fill();
}

/* ================================================================
   地形の描画 ── 本編「光のクロニクル」と共通
   ================================================================ */
function tileChar(x, y){
  if(typeof Game === "undefined" || !Game.tiles) return "";
  if(x < 0 || y < 0 || y >= Game.tiles.length || x >= Game.tiles[y].length) return "";
  return Game.tiles[y][x];
}
function drawTile(g, ch, X, Y, tx, ty){
  var t = TILE[ch] ? TILE[ch].t : "grass";
  var r = hash2(tx, ty), r2 = hash2(tx + 99, ty - 7);
  switch(t){
    case "grass":
      P(g, X, Y, 16, 16, "#3c8a3f");
      P(g, X + (r * 12 | 0), Y + (r2 * 12 | 0), 3, 2, "#317233");
      P(g, X + (r2 * 13 | 0), Y + (r * 13 | 0), 2, 2, "#4da04a");
      break;
    case "flower":
      P(g, X, Y, 16, 16, "#3c8a3f");
      P(g, X + 4, Y + 5, 2, 2, "#f0e05a"); P(g, X + 10, Y + 9, 2, 2, "#f07ab0");
      break;
    case "road":
      P(g, X, Y, 16, 16, "#c0a06c");
      P(g, X + (r * 12 | 0), Y + (r2 * 12 | 0), 2, 2, "#a5854f");
      P(g, X + (r2 * 12 | 0), Y + (r * 11 | 0), 3, 1, "#d4b881");
      break;
    case "sand":
      P(g, X, Y, 16, 16, "#dcc487");
      P(g, X + (r * 12 | 0), Y + (r2 * 12 | 0), 3, 1, "#c6a866");
      break;
    case "tree":
      P(g, X, Y, 16, 16, "#3c8a3f");
      P(g, X + 7, Y + 10, 3, 5, "#6b4a2a");
      E(g, X + 8, Y + 7, 7, 6.5, "#245a28");
      E(g, X + 8, Y + 6, 5.5, 5, "#2f7a33");
      E(g, X + 6, Y + 4, 2.5, 2, "#45984a");
      break;
    case "mtn":
      P(g, X, Y, 16, 16, "#3c8a3f");
      TRI(g, [X, Y + 16, X + 8, Y + 1, X + 16, Y + 16], "#6d6250");
      TRI(g, [X + 8, Y + 1, X + 16, Y + 16, X + 11, Y + 16], "#514936");
      TRI(g, [X + 8, Y + 1, X + 4.5, Y + 8, X + 11.5, Y + 8], "#cfd4dd");
      break;
    case "water":
      P(g, X, Y, 16, 16, "#2450c4");
      P(g, X, Y, 16, 3, "#1f45ad");
      var ph = Math.sin(Game.t * 2 + tx * 0.8 + ty * 0.5);
      P(g, X + 2 + (ph > 0 ? 2 : 0), Y + 6, 5, 1, "#5b8dee");
      P(g, X + 9 - (ph > 0 ? 2 : 0), Y + 11, 4, 1, "#4d7fe0");
      break;
    case "bridge":
      P(g, X, Y, 16, 16, "#2450c4");
      P(g, X, Y + 2, 16, 12, "#9a6a3c");
      for(var i = 0; i < 4; i++) P(g, X + i * 4, Y + 2, 1, 12, "#6f4826");
      P(g, X, Y + 2, 16, 1, "#c08c52"); P(g, X, Y + 13, 16, 1, "#6f4826");
      break;
    case "floor":
      P(g, X, Y, 16, 16, "#5b6178");
      P(g, X, Y, 16, 1, "#6d748d"); P(g, X, Y + 15, 16, 1, "#474d61");
      P(g, X + 15, Y, 1, 16, "#474d61");
      if(r > 0.8) P(g, X + 4, Y + 6, 4, 2, "#535a70");
      break;
    case "wall":
      P(g, X, Y, 16, 16, "#39405a");
      P(g, X, Y, 16, 2, "#4c5478");
      for(var by = 0; by < 16; by += 8){
        var off = (by / 8 + ty) % 2 ? 4 : 0;
        for(var bx = -4; bx < 16; bx += 8) P(g, X + bx + off, Y + by + 1, 7, 6, "#454d6b");
      }
      break;
    case "door":
      P(g, X, Y, 16, 16, "#39405a");
      P(g, X + 2, Y + 2, 12, 14, "#8a5a30");
      P(g, X + 2, Y + 2, 12, 1, "#b57c46");
      P(g, X + 7, Y + 2, 2, 14, "#6b4426");
      P(g, X + 11, Y + 9, 2, 2, "#e8c65a");
      break;
    case "carpet":
      P(g, X, Y, 16, 16, "#a8303f");
      for(var cy = 0; cy < 16; cy += 4) P(g, X, Y + cy, 16, 1, "#95293a");
      /* 金の縁は じゅうたんの外周だけに引く */
      if(tileChar(tx - 1, ty) !== "k"){ P(g, X, Y, 2, 16, "#8a2230"); P(g, X + 2, Y, 1, 16, "#e8c65a"); }
      if(tileChar(tx + 1, ty) !== "k"){ P(g, X + 14, Y, 2, 16, "#8a2230"); P(g, X + 13, Y, 1, 16, "#e8c65a"); }
      break;
    case "throne":
      P(g, X, Y, 16, 16, "#9c2b3a");
      P(g, X + 2, Y + 1, 12, 13, "#c9a33c");
      P(g, X + 4, Y + 3, 8, 8, "#8f6f1e");
      P(g, X + 2, Y + 1, 12, 2, "#e8c65a");
      break;
    case "pillar":
      P(g, X, Y, 16, 16, "#5b6178");

      P(g, X + 2, Y, 12, 2, "#c3cade"); P(g, X + 2, Y + 14, 12, 2, "#c3cade");

function drawWeapon(g, X, Y, w, side){
  if(!w) return;
  var c = w.c, wood = "#6b4a2a";
  if(side){
    /* 横向き(戦闘): 体の前に構える */
    if(w.glow){ g.globalAlpha = 0.45; P(g, X - 2, Y - 1, 6, 13, w.glow); g.globalAlpha = 1; }

      P(g, X - 1, Y + 9, 6, 1, "#c9a33c"); P(g, X + 1, Y + 10, 2, 3, wood);

      P(g, X + 2, Y - 2, 2, 15, c);

    } else if(w.k === "axe"){
      P(g, X + 2, Y + 1, 2, 12, wood);
      P(g, X - 2, Y, 6, 6, c); P(g, X - 2, Y, 6, 1, "#ffffff"); P(g, X - 3, Y + 1, 1, 4, c);

    if(w.k === "sword"){

}

function drawActor(g, X, Y, key, dir, frame, pal, eq){
  var p = pal || SPR[key] || SPR.man;
  var sk = p.skin, hr = p.hair, cl = p.cloth;
  if(eq && eq.armor && ALOOK[eq.armor]) cl = ALOOK[eq.armor];

  if(wep && dir === "up") drawWeapon(g, X, Y, wep, false);

  var a = frame ? 1 : 0;
  P(g, X + 5, Y + 12 + a, 3, 4 - a, "#4a3a2a");

  P(g, X + 4, Y + top + 6, 8, 6, cl);
  P(g, X + 4, Y + top + 6, 8, 1, lt);

  /* 頭 */
  P(g, X + 4, Y + top, 8, 7, sk);
  if(dir === "up"){
    P(g, X + 4, Y + top, 8, 6, hr);
  } else {
    P(g, X + 4, Y + top, 8, 3, hr);
    P(g, X + 3, Y + top + 1, 1, 3, hr); P(g, X + 12, Y + top + 1, 1, 3, hr);

      P(g, X + 6, Y + top + 4, 1, 2, "#2a1a12"); P(g, X + 9, Y + top + 4, 1, 2, "#2a1a12");
    } else if(dir === "left"){

    if(p.beard) P(g, X + 5, Y + top + 6, 6, 2, hr);

  if(p.crown){ P(g, X + 4, Y + top - 2, 8, 2, "#e8c65a"); P(g, X + 4, Y + top - 3, 1, 1, "#e8c65a"); P(g, X + 7, Y + top - 4, 2, 2, "#e8c65a"); P(g, X + 11, Y + top - 3, 1, 1, "#e8c65a"); }

  if(wep && dir !== "up") drawWeapon(g, X, Y, wep, dir === "left");
}

/* ================================================================
   エフェクト ── 本編「光のクロニクル」と共通
   ================================================================ */
var FX = {
  list:[],
  add:function(o){ o.t = 0; this.list.push(o); return o; },
  burst:function(x, y, color, n, spd, life){
    for(var i = 0; i < (n || 12); i++){
      var a = Math.random() * 6.2832, v = rndf(0.4, 1) * (spd || 60);
      this.add({k:"p", x:x, y:y, vx:Math.cos(a) * v, vy:Math.sin(a) * v - 20, c:color, life:life || 0.55, sz:rndInt(1, 3)});
    }
  },
  rise:function(x, y, color, n){
    for(var i = 0; i < (n || 10); i++){
      this.add({k:"p", x:x + rndf(-14, 14), y:y + rndf(-4, 10), vx:rndf(-6, 6), vy:rndf(-70, -30), c:color, life:rndf(0.5, 0.9), sz:rndInt(1, 3), g:0});
    }
  },
  bolt:function(x, y){ this.add({k:"bolt", x:x, y:y, life:0.42}); },
  slash:function(x, y){ this.add({k:"slash", x:x, y:y, life:0.28}); },
  ring:function(x, y, color){ this.add({k:"ring", x:x, y:y, c:color, life:0.4}); },
  update:function(dt){
    for(var i = this.list.length - 1; i >= 0; i--){
      var p = this.list[i];
      p.t += dt;
      if(p.k === "p"){
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vy += (p.g == null ? 140 : p.g) * dt;
      }
      if(p.t >= p.life) this.list.splice(i, 1);
    }
  },
  draw:function(g){
    this.list.forEach(function(p){
      var k = 1 - p.t / p.life;
      if(p.k === "p"){
        g.globalAlpha = Math.max(0, k);
        P(g, p.x, p.y, p.sz, p.sz, p.c);
        g.globalAlpha = 1;
      } else if(p.k === "bolt"){
        g.globalAlpha = Math.max(0, k);
        var w = 4 + Math.sin(p.t * 60) * 2;
        P(g, p.x - w / 2, 0, w, p.y, "#ffffff");
        P(g, p.x - w / 4, 0, w / 2, p.y, "#a8d8ff");
        g.globalAlpha = 1;
      } else if(p.k === "slash"){
        g.globalAlpha = Math.max(0, k);
        g.strokeStyle = "#ffffff"; g.lineWidth = 2;
        g.beginPath(); g.moveTo(p.x - 18, p.y - 16); g.lineTo(p.x + 16, p.y + 14); g.stroke();
        g.beginPath(); g.moveTo(p.x - 12, p.y - 22); g.lineTo(p.x + 20, p.y + 6); g.stroke();
        g.globalAlpha = 1;
      } else if(p.k === "ring"){
        g.globalAlpha = Math.max(0, k);
        g.strokeStyle = p.c; g.lineWidth = 2;
        g.beginPath(); g.arc(p.x, p.y, 4 + (1 - k) * 30, 0, 6.2832); g.stroke();
        g.globalAlpha = 1;
      }
    });
  },
  clear:function(){ this.list.length = 0; }
};

/* 街道の折れ点(タイル座標)。最後の点が アルシア城 */
var WP = [[-1,5],[2,5],[2,2],[5,2],[5,7],[8,7],[8,2],[11,2],[11,7],[14,7],[14,4],[15,4]];
var CASTLE = {x:15, y:4};

/* 道になっているタイルの集合 */
var ROAD = (function(){
  var set = {};
  for(var i = 0; i < WP.length - 1; i++){
    var a = WP[i], b = WP[i + 1];
    var dx = Math.sign(b[0] - a[0]), dy = Math.sign(b[1] - a[1]);
    var x = a[0], y = a[1];
    set[x + "," + y] = 1;
    while(x !== b[0] || y !== b[1]){ x += dx; y += dy; set[x + "," + y] = 1; }
  }
  return set;
})();
function isRoad(x, y){ return !!ROAD[x + "," + y]; }
/* 草地の飾り(木は 建てられないマスになる) */
var DECO = (function(){
  var rnd = mulberry(20260811), m = {};
  for(var y = 0; y < ROWS; y++){
    for(var x = 0; x < COLS; x++){
      var r = rnd();
      if(isRoad(x, y) || (x === 15 && y === 4)) continue;
      m[x + "," + y] = r > 0.86 ? "T" : (r > 0.68 ? "f" : ".");
    }
  }
  return m;
})();
function buildable(x, y){
  if(x < 0 || y < 0 || x >= COLS || y >= ROWS) return false;
  if(isRoad(x, y)) return false;
  if(x === CASTLE.x && y === CASTLE.y) return false;
  if(DECO[x + "," + y] === "T") return false;      /* 木のあるマス */
  return true;
}
function tileScreen(x, y){ return {x:x * TS, y:MAP_Y + y * TS}; }

function towerStat(t){

  return {

    rng: d.rng * Math.pow(1.11, lv - 1),
    rate: (d.rate || 1) * Math.pow(0.90, lv - 1),
    splash: d.splash ? d.splash * Math.pow(1.08, lv - 1) : 0,
    steal: d.steal ? Math.round(d.steal * lv) : 0
  };
}

function foeSpec(key, hpMul, spdMul, wave){
  var m = MONS[key];
  var boss = !!m.boss;
  var scale = 1 + wave * 0.075 + wave * wave * 0.0086;
  return {
    key:key, n:m.n, art:m.art, filter:m.filter, boss:boss,
    hp: Math.round(m.hp * hpMul * scale * (boss ? 0.5 : 1.0)),
    armor: Math.round(m.def * 0.55),
    spd: (boss ? 0.62 : 1.15) * spdMul,               /* タイル/秒 */
    gold: Math.max(1, Math.round(m.g / 10)),
    leak: boss ? 5 : 1,
    sc: (m.sc || 0.9) * (boss ? 0.42 : 0.44)
  };
}

var G = {
  t:0, scene:"title", paused:false, speed:1,
  gold:280, hp:20, maxHp:20, wave:0, killed:0, leaked:0, earned:0,

/* ================================================================
   敵
   ================================================================ */
function spawnFoe(spec){
  G.foes.push({
    s:spec, hp:spec.hp, max:spec.hp,
    seg:0, t:0,                 /* 何番目の区間を どれだけ進んだか */
    x:WP[0][0], y:WP[0][1],
    hurt:0, slow:0, dead:false
  });
}
function foePos(f){ return {x:f.x * TS + TS / 2, y:MAP_Y + f.y * TS + TS / 2}; }
/* 進んだ距離(先頭判定に使う) */
function foeProgress(f){ return f.seg + f.t; }
function moveFoe(f, dt){
  var spd = f.s.spd * (f.slow > 0 ? 0.60 : 1);
  var left = spd * dt;
  while(left > 0 && f.seg < WP.length - 1){
    var a = WP[f.seg], b = WP[f.seg + 1];
    var len = Math.abs(b[0] - a[0]) + Math.abs(b[1] - a[1]);
    var need = (1 - f.t) * len;
    if(left < need){
      f.t += left / len;
      left = 0;
    } else {
      left -= need;
      f.seg++; f.t = 0;
    }
  }
  if(f.seg >= WP.length - 1){ leak(f); return; }
  var a2 = WP[f.seg], b2 = WP[f.seg + 1];
  f.x = a2[0] + (b2[0] - a2[0]) * f.t;
  f.y = a2[1] + (b2[1] - a2[1]) * f.t;
  if(f.slow > 0) f.slow -= dt;
}
function leak(f){
  f.dead = true;
  G.hp = Math.max(0, G.hp - f.s.leak);
  G.leaked++;
  Snd.se("leak");
  UI.pop(CASTLE.x * TS + 8, MAP_Y + CASTLE.y * TS, "-" + f.s.leak, "leak");
  G.shake = 3;
  refreshHud();
  if(G.hp <= 0) endGame(false);
}
function hurtFoe(f, dmg, kind, x, y){
  var d = dmg;
  if(kind === "phys") d = Math.max(1, Math.round(d - f.s.armor * 0.55));
  f.hp -= d;
  f.hurt = 0.16;
  if(f.hp <= 0 && !f.dead){
    f.dead = true;
    G.killed++;
    var g = f.s.gold;
    G.gold += g; G.earned += g;
    FX.burst(x, y, "#ffd75e", 10, 70, 0.5);
    Snd.se(f.s.boss ? "dead" : "hit");
    UI.pop(x, y - 8, "+" + g, "gold");
    refreshHud();
  }
}

/* ================================================================
   砦の攻撃
   ================================================================ */
function towerBuff(tx, ty){
  /* まわりの ミナ から 攻撃速度の 後押しを もらう */
  var mul = 1;
  for(var k in G.towers){
    var o = G.towers[k];
    if(o.k !== "mina") continue;
    var st = towerStat(o);
    var dx = (o.x - tx) * TS, dy = (o.y - ty) * TS;
    if(Math.sqrt(dx * dx + dy * dy) <= st.rng) mul *= 0.74;
  }
  return Math.max(0.45, mul);
}
function updateTowers(dt){
  for(var k in G.towers){
    var t = G.towers[k];
    var st = towerStat(t);
    var c = tileScreen(t.x, t.y);
    var cx0 = c.x + 8, cy0 = c.y + 8;
    if(t.k === "mina"){
      /* はんい内の敵を 足どめする(攻撃はしない) */
      for(var mi = 0; mi < G.foes.length; mi++){
        var mf = G.foes[mi];
        if(mf.dead || mf.s.boss) continue;
        var mp = foePos(mf);
        var mdx = mp.x - cx0, mdy = mp.y - cy0;
        if(mdx * mdx + mdy * mdy <= st.rng * st.rng) mf.slow = 0.25;
      }
      continue;
    }
    t.cd -= dt;
    if(t.cd > 0) continue;
    /* いちばん先に進んでいる敵を ねらう */
    var best = null, bestP = -1;
    for(var i = 0; i < G.foes.length; i++){
      var f = G.foes[i];
      if(f.dead) continue;
      var p = foePos(f);
      var dx = p.x - cx0, dy = p.y - cy0;
      if(dx * dx + dy * dy > st.rng * st.rng) continue;
      var pr = foeProgress(f);
      if(pr > bestP){ bestP = pr; best = f; }
    }
    if(!best) continue;
    t.cd = st.rate * towerBuff(t.x, t.y);
    var bp = foePos(best);
    t.face = Math.abs(bp.x - cx0) > Math.abs(bp.y - cy0)
      ? (bp.x < cx0 ? "left" : "right")
      : (bp.y < cy0 ? "up" : "down");
    t.anim = 0.18;
    G.shots.push({
      x:cx0, y:cy0 - 3, tgt:best, dmg:st.dmg, kind:TOWERS[t.k].kind,
      splash:st.splash, steal:st.steal, col:t.k === "lino" ? "#7fd0ff" : t.k === "gai" ? "#ffd75e" : "#ffffff",
      spd:t.k === "lino" ? 190 : 340, life:1.2
    });
    Snd.se(t.k === "lino" ? "spell" : "swing");
  }
}
function updateShots(dt){
  for(var i = G.shots.length - 1; i >= 0; i--){
    var s = G.shots[i];
    s.life -= dt;
    var f = s.tgt;
    if(!f || f.dead || s.life <= 0){ G.shots.splice(i, 1); continue; }
    var p = foePos(f);
    var dx = p.x - s.x, dy = p.y - s.y;
    var dist = Math.sqrt(dx * dx + dy * dy) || 1;
    var step = s.spd * dt;
    if(dist <= step + 3){
      /* 命中 */
      hurtFoe(f, s.dmg, s.kind, p.x, p.y);
      if(s.steal && f.dead){ G.gold += s.steal; G.earned += s.steal; refreshHud(); }
      if(s.splash){
        FX.burst(p.x, p.y, s.col, 10, 80, 0.4);
        for(var j = 0; j < G.foes.length; j++){
          var o = G.foes[j];
          if(o === f || o.dead) continue;
          var q = foePos(o);
          var ddx = q.x - p.x, ddy = q.y - p.y;
          if(ddx * ddx + ddy * ddy <= s.splash * s.splash) hurtFoe(o, Math.round(s.dmg * 0.6), s.kind, q.x, q.y);
        }
      } else {
        FX.burst(p.x, p.y, s.col, 5, 60, 0.3);
      }
      G.shots.splice(i, 1);
      continue;
    }
    s.x += dx / dist * step;
    s.y += dy / dist * step;
  }
}

/* ================================================================
   波の進行
   ================================================================ */
function startWave(){
  if(G.waveOn || G.wave >= WAVES.length) return;
  /* 早出しボーナス */
  if(G.betweenT > 0){
    var bonus = Math.round(G.betweenT * 4);
    if(bonus > 0){ G.gold += bonus; G.earned += bonus;
      UI.pop(CASTLE.x * TS - 40, MAP_Y + 30, "+" + bonus, "gold"); }
    G.betweenT = 0;
  }
  G.wave++;
  G.waveOn = true;
  G.spawnQ = [];
  var w = WAVES[G.wave - 1], at = 0;
  w.forEach(function(g){
    var key = g[0], num = g[1], gap = g[2], hpMul = g[3], spdMul = g[4];
    for(var i = 0; i < num; i++){
      G.spawnQ.push({t:at, spec:foeSpec(key, hpMul, spdMul, G.wave)});
      at += gap;
    }
    at += 0.6;
  });
  G.spawnT = 0;
  Snd.se("wave");
  Snd.play(WAVES[G.wave - 1].some(function(g){ return MONS[g[0]].boss; }) ? "boss" : "battle");
  refreshHud();
  banner("第 " + G.wave + " 波" + (G.wave === WAVES.length ? " ── さいごの波!" : ""));
}
function updateWave(dt){
  if(G.waveOn){
    G.spawnT += dt;
    while(G.spawnQ.length && G.spawnQ[0].t <= G.spawnT){
      spawnFoe(G.spawnQ.shift().spec);
    }
    if(!G.spawnQ.length && !G.foes.some(function(f){ return !f.dead; })){
      G.waveOn = false;
      var bonus = 35 + G.wave * 8;
      G.gold += bonus; G.earned += bonus;
      Snd.se("clearwave");
      refreshHud();
      if(G.wave >= WAVES.length){ endGame(true); return; }
      G.betweenT = 14;
      banner("第 " + G.wave + " 波を しのいだ!　+" + bonus + "G");
      Snd.play("field");
    }
  } else if(G.betweenT > 0){
    G.betweenT -= dt;
    if(G.betweenT <= 0) startWave();
  }
}

var cv = $("screen"), cx = cv.getContext("2d");
cx.imageSmoothingEnabled = false;
var bgCanvas = null;
function bakeBG(){
  var c = document.createElement("canvas");
  c.width = SCR_W; c.height = SCR_H;
  var g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  /* 空と 地面 */
  var sky = g.createLinearGradient(0, 0, 0, MAP_Y);
  sky.addColorStop(0, "#0b1330"); sky.addColorStop(1, "#16224a");
  g.fillStyle = sky; g.fillRect(0, 0, SCR_W, MAP_Y);
  for(var y = 0; y < ROWS; y++){
    for(var x = 0; x < COLS; x++){
      var s = tileScreen(x, y);
      if(isRoad(x, y) || (x === CASTLE.x && y === CASTLE.y)){ drawTile(g, ",", s.x, s.y, x, y); continue; }
      drawTile(g, DECO[x + "," + y] || ".", s.x, s.y, x, y);
    }
  }
  /* アルシア城(2マスぶんの 大きさで描く) */
  var cs = tileScreen(CASTLE.x, CASTLE.y);
  drawKeep(g, cs.x - 11, cs.y - 19);
  /* 魔物が わいてくる 洞穴 */
  var es = tileScreen(0, WP[0][1]);
  drawLair(g, es.x - 10, es.y);
  bgCanvas = c;
}

var LVEQ = {
  hero:[{weapon:"copper",armor:"cloth"},  {weapon:"iron",armor:"chain"},  {weapon:"light",armor:"holy"}],
  luka:[{weapon:"copper",armor:"cloth"},  {weapon:"iron",armor:"leather"},{weapon:"kaze",armor:"leather"}],
  gai: [{weapon:"club",armor:"cloth"},    {weapon:"axe",armor:"chain"},   {weapon:"axe",armor:"ironA"}],
  mina:[{weapon:"oak",armor:"cloth"},     {weapon:"mstaff",armor:"cloth"},{weapon:"sage",armor:"holy"}],
  lino:[{weapon:"stick",armor:"cloth"},   {weapon:"mstaff",armor:"robe"}, {weapon:"sage",armor:"robe"}]
};
function drawFoe(g, f){
  var p = foePos(f);
  var hurt = f.hurt > 0 && ((f.hurt * 40 | 0) & 1);
  P(g, p.x - 5, p.y + 5, 10, 2, "rgba(0,0,0,.3)");
  drawMon(g, f.s.art, p.x, p.y + 6, f.s.sc, hurt, f.s.filter);
  g.filter = "none";
  /* HPバー */
  var w = f.s.boss ? 22 : 13;
  var r = Math.max(0, f.hp / f.max);
  P(g, p.x - w / 2 - 1, p.y - 13, w + 2, 3, "#12101c");
  P(g, p.x - w / 2, p.y - 12, w * r, 1, r > 0.5 ? "#5ee06a" : r > 0.22 ? "#ffd75e" : "#ff5a4a");
  if(f.slow > 0) P(g, p.x - 1, p.y - 16, 2, 2, "#7fd0ff");
}
function render(){
  var g = cx;
  var sx = 0, sy = 0;
  if(G.shake > 0){ sx = rndf(-G.shake, G.shake); sy = rndf(-G.shake, G.shake); }
  g.save();
  g.translate(sx, sy);
  g.drawImage(bgCanvas, 0, 0);

  /* 置ける場所 / 選択中のマス */
  if(G.sel || G.pick){
    for(var y = 0; y < ROWS; y++) for(var x = 0; x < COLS; x++){
      if(!buildable(x, y) || towerAt(x, y)) continue;
      var s = tileScreen(x, y);
      g.globalAlpha = 0.28 + Math.sin(G.t * 4) * 0.08;
      P(g, s.x + 1, s.y + 1, 14, 14, "#8effc0");
      g.globalAlpha = 1;
    }
  }
  var hi = G.pick || (G.cur.on ? G.cur : null);
  if(hi){
    var hs = tileScreen(hi.x, hi.y);
    var tw = towerAt(hi.x, hi.y);
    g.strokeStyle = tw ? "#ffd75e" : (buildable(hi.x, hi.y) ? "#ffffff" : "#ff6a58");
    g.lineWidth = 1;
    g.strokeRect(hs.x + 0.5, hs.y + 0.5, 15, 15);
    /* とどく はんい */
    var rng = tw ? towerStat(tw).rng : (G.sel ? TOWERS[G.sel].rng : 0);
    if(rng){
      g.globalAlpha = 0.75;
      g.strokeStyle = "rgba(140,220,255,.85)";
      g.beginPath(); g.arc(hs.x + 8, hs.y + 8, rng, 0, 6.2832); g.stroke();
      g.globalAlpha = 0.1;
      g.fillStyle = "#7fd0ff";
      g.beginPath(); g.arc(hs.x + 8, hs.y + 8, rng, 0, 6.2832); g.fill();
      g.globalAlpha = 1;
    }
  }
  /* 砦(上の行から順に重ねる) */
  var list = [];
  for(var k in G.towers) list.push(G.towers[k]);
  list.sort(function(a, b){ return a.y - b.y; });
  list.forEach(function(t){ drawTower(g, t); });
  /* 敵 */
  G.foes.forEach(function(f){ if(!f.dead) drawFoe(g, f); });
  /* 弾 */
  G.shots.forEach(function(s){
    P(g, s.x - 1, s.y - 1, 3, 3, s.col);
    P(g, s.x, s.y, 1, 1, "#fff");
  });
  FX.draw(g);
  g.restore();
}

/* ================================================================
   画面まわり
   ================================================================ */
function refreshHud(){
  $("hWave").textContent = G.wave;
  $("hGold").textContent = G.gold;
  $("hHp").textContent = G.hp;
  $("hud").querySelector(".h").classList.toggle("low", G.hp <= 6);
  [].forEach.call(document.querySelectorAll("#dock .card"), function(c){
    c.classList.toggle("poor", G.gold < TOWERS[c.dataset.k].cost);
    c.classList.toggle("sel", G.sel === c.dataset.k);
  });
  $("bWave").textContent = G.waveOn ? "戦闘中" : (G.betweenT > 0 ? "つぎの波 " + Math.ceil(G.betweenT) : "つぎの波");
  $("bWave").disabled = G.waveOn;
}
function banner(text){
  var b = el("div", "win mid plain", esc(text));
  b.style.top = "calc(26*var(--u))";
  b.style.padding = "calc(3*var(--u)) calc(8*var(--u))";
  b.style.fontSize = "calc(9*var(--u))";
  UI.layer.appendChild(b);
  setTimeout(function(){
    b.style.transition = "opacity .4s linear";
    b.style.opacity = "0";
    setTimeout(function(){ b.remove(); }, 420);
  }, 1300);
}
function buildDock(){
  var d = $("dock");
  d.innerHTML = "";
  TORDER.forEach(function(k){
    var T = TOWERS[k];
    var c = el("div", "card");
    c.dataset.k = k;
    var cc = document.createElement("canvas");
    cc.width = 20; cc.height = 18;
    var g = cc.getContext("2d");
    g.imageSmoothingEnabled = false;
    drawActor(g, 2, 1, k, "down", 0, SPR[k], LVEQ[k][0]);
    c.appendChild(cc);
    c.appendChild(el("div", "nm", esc(T.n)));
    c.appendChild(el("div", "cost", T.cost + "G"));
    c.addEventListener("click", function(){
      Snd.resume();
      G.sel = (G.sel === k) ? null : k;
      G.pick = null;
      Snd.se(G.sel ? "ok" : "cancel");
      refreshHud();
    });
    d.appendChild(c);
  });
}
/* マスをさわったとき */
function tapTile(x, y){
  if(G.over) return;
  var t = towerAt(x, y);
  if(t){ G.sel = null; openTowerMenu(t); return; }
  if(!buildable(x, y)){ Snd.se("err"); return; }
  if(!G.sel){ openBuildMenu(x, y); return; }
  placeTower(x, y, G.sel);
}
function placeTower(x, y, k){
  var T = TOWERS[k];
  if(G.gold < T.cost){ Snd.se("err"); banner("ゴールドが たりない!"); return; }
  G.gold -= T.cost;
  G.towers[x + "," + y] = {k:k, x:x, y:y, lv:1, cd:0, anim:0, face:"right", paid:T.cost};
  Snd.se("buy");
  FX.burst(x * TS + 8, MAP_Y + y * TS + 8, "#8effc0", 12, 70, 0.5);
  refreshHud();
}
async function openBuildMenu(x, y){
  G.pick = {x:x, y:y};
  G.menu++;
  try{ await buildMenuInner(x, y); } finally { G.menu--; G.pick = null; }
}
async function buildMenuInner(x, y){
  var items = TORDER.map(function(k){
    var T = TOWERS[k];
    return {l:T.n + "　" + T.cls, s:T.cost + "G", off:G.gold < T.cost};
  });
  var info = UI.win({left:"calc(5*var(--u))", top:"calc(22*var(--u))", right:"calc(5*var(--u))"}, "", "plain");
  var i = await UI.list({
    cap:"だれを 配置する?",
    items:items,
    css:{left:"calc(5*var(--u))", bottom:"calc(52*var(--u))", right:"calc(5*var(--u))"},
    onMove:function(n){
      var T = TOWERS[TORDER[n]];
      info.innerHTML = '<div class="small">' + esc(T.d) + '</div>' +
        '<div class="kv"><span class="small">こうげき</span><b>' + (T.dmg || "―") + '</b>' +
        '<span class="small">はんい</span><b>' + Math.round(T.rng) + '</b>' +
        '<span class="small">はやさ</span><b>' + (T.rate ? T.rate.toFixed(2) + "s" : "―") + '</b></div>';
    }
  });
  info.remove();
  if(i >= 0) placeTower(x, y, TORDER[i]);
}
async function openTowerMenu(t){
  G.pick = {x:t.x, y:t.y};
  G.menu++;
  try{ await towerMenuInner(t); } finally { G.menu--; G.pick = null; }
}
async function towerMenuInner(t){
  while(true){
    var st = towerStat(t);
    var T = TOWERS[t.k];
    var max = t.lv >= 3;
    var info = UI.win({left:"calc(5*var(--u))", top:"calc(22*var(--u))", right:"calc(5*var(--u))"},
      '<div class="cap">' + esc(T.n) + '　Lv' + t.lv + '</div>' +
      '<div class="kv"><span class="small">こうげき</span><b>' + (st.dmg || "―") + '</b>' +
      '<span class="small">はんい</span><b>' + Math.round(st.rng) + '</b>' +
      '<span class="small">はやさ</span><b>' + (T.rate ? (st.rate).toFixed(2) + "s" : "―") + '</b></div>' +
      '<div class="small">' + esc(T.d) + '</div>', "plain");
    var i = await UI.list({
      items:[
        {l:max ? "これいじょう 強化できない" : "強化する　Lv" + (t.lv + 1), s:max ? "" : upCost(t) + "G",
         off:max || G.gold < upCost(t)},
        {l:"うる", s:"+" + sellValue(t) + "G"},
        {l:"やめる"}
      ],
      css:{left:"calc(5*var(--u))", bottom:"calc(52*var(--u))", right:"calc(5*var(--u))"}
    });
    info.remove();
    if(i < 0 || i === 2) break;
    if(i === 0){
      var c = upCost(t);
      G.gold -= c; t.paid += c; t.lv++;
      Snd.se("levelup");
      FX.rise(t.x * TS + 8, MAP_Y + t.y * TS + 8, "#ffd75e", 12);
      refreshHud();
    } else {
      G.gold += sellValue(t);
      delete G.towers[t.x + "," + t.y];
      Snd.se("cancel");
      refreshHud();
      break;
    }
  }
}

/* ================================================================
   入力
   ================================================================ */
function stageToTile(ev){
  var r = cv.getBoundingClientRect();
  var px = (ev.clientX - r.left) / r.width * SCR_W;
  var py = (ev.clientY - r.top) / r.height * SCR_H;
  if(py < MAP_Y || py >= MAP_Y + ROWS * TS) return null;
  return {x:Math.floor(px / TS), y:Math.floor((py - MAP_Y) / TS)};
}
cv.addEventListener("pointerdown", function(ev){
  Snd.resume();
  if(G.scene !== "play" || G.busy || G.menu) return;
  var t = stageToTile(ev);
  if(!t) return;
  G.cur = {x:t.x, y:t.y, on:false};
  tapTile(t.x, t.y);
});
function keyTick(){
  if(G.scene !== "play" || G.busy || G.menu) return;
  var k;
  while((k = Input.take())){
    if(k === "up" || k === "down" || k === "left" || k === "right"){
      var d = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]}[k];
      G.cur = {x:clamp(G.cur.x + d[0], 0, COLS - 1), y:clamp(G.cur.y + d[1], 0, ROWS - 1), on:true};
      Snd.se("cursor");
    } else if(k === "confirm"){
      G.cur.on = true;
      tapTile(G.cur.x, G.cur.y);
    } else if(k === "cancel"){
      if(G.sel){ G.sel = null; Snd.se("cancel"); refreshHud(); }
      else G.cur.on = !G.cur.on;
    }
  }
}

/* ================================================================
   結果
   ================================================================ */
async function endGame(win){
  if(G.over) return;
  G.over = true;
  G.scene = "over";
  Snd.stop();
  await sleep(500);
  if(win) Snd.jingle([["C5",.14],["C5",.14],["C5",.14],["C5",.34],["G#4",.3],["A#4",.3],["C5",.2],["A#4",.14],["C5",.7]]);
  else Snd.jingle([["A3",.4],["G#3",.4],["G3",.4],["F#3",1.1]]);
  var o = $("over");
  o.className = "ov on " + (win ? "win" : "lose");
  o.querySelector(".big").textContent = win ? "まもりぬいた!" : "城が おちた……";
  o.querySelector(".stat").innerHTML =
    '第 <b>' + G.wave + '</b> 波まで　　たおした数 <b>' + G.killed + '</b><br>' +
    'とおした数 <b>' + G.leaked + '</b>　　かせいだ額 <b>' + G.earned + '</b>G<br>' +
    '城ののこり <b>' + G.hp + '</b> / ' + G.maxHp;
  try{
    var best = +(localStorage.getItem(SAVE_KEY) || 0);
    if(G.wave > best){ localStorage.setItem(SAVE_KEY, String(G.wave)); best = G.wave; }
    o.querySelector(".stat").innerHTML += '<br><span class="small">これまでの さいこう記録 ' + best + ' 波</span>';
  }catch(e){}
  var i = await UI.list({
    items:[{l:"もういちど まもる"},{l:"タイトルへ"}],
    css:{bottom:"calc(24*var(--u))", minWidth:"calc(80*var(--u))"},
    cls:"mid", into:$("overMenu"), noCancel:true
  });
  o.className = "ov";
  $("overMenu").innerHTML = "";
  if(i === 0) newGame();
  else location.reload();
}

/* ================================================================
   起動
   ================================================================ */
function resetState(){
  G.gold = 280; G.hp = 20; G.maxHp = 20; G.wave = 0;
  G.killed = 0; G.leaked = 0; G.earned = 0;
  G.towers = {}; G.foes = []; G.shots = []; G.spawnQ = [];
  G.waveOn = false; G.betweenT = 0; G.sel = null; G.pick = null;
  G.over = false; G.shake = 0; G.speed = 1;
  G.cur = {x:1, y:1, on:false};
  FX.clear();
  $("bSpeed").textContent = "×1";
  refreshHud();
}
async function newGame(){
  resetState();
  G.scene = "play";
  Snd.play("field");
  await UI.fade(false);
  banner("街道に なかまを 配置しよう");
  G.betweenT = 18;
}
async function boot(){
  bakeBG();
  buildDock();
  refreshHud();
  G.scene = "title";
  var best = 0;
  try{ best = +(localStorage.getItem(SAVE_KEY) || 0); }catch(e){}
  var items = [{l:"まもりを はじめる"},{l:"あそびかた"}];
  while(true){
    var i = await UI.list({
      head:best ? "さいこう記録 " + best + " 波" : "",
      items:items,
      css:{top:"calc(140*var(--u))", minWidth:"calc(104*var(--u))"},
      cls:"mid", into:$("titleMenu"), noCancel:true
    });
    Snd.init(); Snd.resume();
    if(i === 1){ await howTo(); continue; }
    break;
  }
  await UI.fade(true);
  $("title").classList.remove("on");
  await newGame();
}
async function howTo(){
  G.busy = true;
  await UI.sayAll([
    "魔王は たおれた。だが 残党は\nアルシア城を ねらって おしよせる。",
    "街道ぞいの マスに なかまを 配置して\n城まで たどりつかせるな。",
    "敵を たおすと ゴールドが 手に入る。\n砦は 3段階まで 強化できる。",
    "ミナは 攻撃しない。かわりに まわりの砦を\nはやめ、はんいの敵を おそくする。",
    "リノの まほうは かたい敵にも 効く。\nガイは まとめて なぎ払う。",
    "20の波を しのげば あなたの 勝ちだ!"
  ]);
  UI.closeMsg();
  G.busy = false;
}

/* 画面サイズ */
function resize(){
  var s = Math.min(innerWidth / SCR_W, innerHeight / SCR_H);
  if(s >= 2) s = Math.floor(s * 2) / 2;
  s = Math.min(s, 4.6);
  document.documentElement.style.setProperty("--u", s + "px");
}
addEventListener("resize", resize);
addEventListener("orientationchange", function(){ setTimeout(resize, 120); });
resize();

/* タイトルでは 最初のひと押しで BGMを鳴らす(自動再生できないため) */
["pointerdown","keydown"].forEach(function(ev){
  addEventListener(ev, function once(){
    if(G.scene === "title" && Snd.on){ Snd.play("castle"); }
    removeEventListener(ev, once);
  });
});
$("bSpeed").addEventListener("click", function(){
  Snd.resume();
  G.speed = G.speed === 1 ? 2 : 1;
  this.textContent = "×" + G.speed;
  this.classList.toggle("on", G.speed === 2);
  Snd.se("cursor");
});
$("bWave").addEventListener("click", function(){
  Snd.resume();
  if(!G.waveOn && !G.over) startWave();
});

/* メインループ */
var last = 0;
function frame(ts){
  var dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;
  G.t += dt;
  if(G.shake > 0) G.shake = Math.max(0, G.shake - dt * 16);
  if(G.scene === "play" && !G.busy){
    var steps = G.speed;
    for(var s = 0; s < steps; s++){
      updateWave(dt);
      for(var i = 0; i < G.foes.length; i++) if(!G.foes[i].dead) moveFoe(G.foes[i], dt);
      updateTowers(dt);
      updateShots(dt);
    }
    for(var j = G.foes.length - 1; j >= 0; j--) if(G.foes[j].dead) G.foes.splice(j, 1);
    for(var k in G.towers){ var t = G.towers[k]; if(t.anim > 0) t.anim -= dt; }
    G.foes.forEach(function(f){ if(f.hurt > 0) f.hurt -= dt; });
    keyTick();
    if(!G.waveOn && G.betweenT > 0 && ((G.t * 2) | 0) % 2 === 0) refreshHud();
  }
  FX.update(dt);
  if(G.scene === "title") drawTitleBg();
  else render();
  requestAnimationFrame(frame);
}
function drawTitleBg(){
  var g = cx;
  g.drawImage(bgCanvas, 0, 0);
  g.fillStyle = "rgba(4,8,31,.55)";
  g.fillRect(0, 0, SCR_W, SCR_H);
  /* 街道を歩く 敵の影 */
  var demo = ["slime","gob","skel","bat"];
  demo.forEach(function(k, i){
    var p = (G.t * 0.08 + i * 0.22) % 1;
    var seg = Math.floor(p * (WP.length - 1));
    var t = p * (WP.length - 1) - seg;
    var a = WP[seg], b = WP[seg + 1];
    var x = (a[0] + (b[0] - a[0]) * t) * TS + 8;
    var y = MAP_Y + (a[1] + (b[1] - a[1]) * t) * TS + 14;
    g.globalAlpha = 0.5;
    drawMon(g, MONS[k].art, x, y, 0.4, false, MONS[k].filter);
    g.filter = "none";
    g.globalAlpha = 1;
  });
}
requestAnimationFrame(frame);
boot();

</script>
