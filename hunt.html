  rocky: {n:"岩塊の丘",   ground:"#7a6a4a", ground2:"#6a5c40", rock:"#585048", deco:"rock", sky:"#c8a86a"},
  ember: {n:"焔の断崖",   ground:"#5a3a2a", ground2:"#4a2e20", rock:"#6a3a28", deco:"ember",sky:"#c85a3a"},
  deep:  {n:"ヌシの谷底", ground:"#2e3448", ground2:"#262a3a", rock:"#3a3a52", deco:"crys", sky:"#3a2a5a"}
};

/* ================================================================
   狩場の 地形
   ================================================================ */
var FW = 384, FH = 300;                          /* 狩場の 広さ(px) */

function buildField(kind){
  var F = FIELDS[kind], rnd = mulberry(kind.length * 7919 + 20260811);
  var obs = [];                                   /* 通れない 岩・木 */
  var deco = [];                                  /* 通れる 草・小石 */
  var i, x, y, r;
  /* 外周ぞいと 中ほどに 障害物を まく。中央は 広く あけて 戦えるように */
  for(i = 0; i < 26; i++){
    x = 18 + rnd() * (FW - 36);
    y = 26 + rnd() * (FH - 52);
    var dc = Math.hypot(x - FW / 2, y - FH / 2);
    if(dc < 92) continue;                         /* 中央の 闘技場は あけておく */
    r = 7 + rnd() * 7;
    obs.push({x:x, y:y, r:r, kind:F.deco, s:rnd()});
  }
  for(i = 0; i < 90; i++){
    deco.push({x:rnd() * FW, y:20 + rnd() * (FH - 20), s:rnd(), t:(rnd() * 3) | 0});
  }
  /* キャンプ(復帰地点)は 左下、巣は 右上 */
  return {kind:kind, F:F, obs:obs, deco:deco,
          camp:{x:44, y:FH - 46}, nest:{x:FW - 62, y:56}};
}

/* 地形を 一枚絵に 焼いておく(毎フレーム 描くと 重い) */
function bakeField(fd){
  var c = document.createElement("canvas");
  c.width = FW; c.height = FH;
  var g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  var F = fd.F, rnd = mulberry(4211);
  g.fillStyle = F.ground; g.fillRect(0, 0, FW, FH);
  /* 地面の むら */
  var i;
  for(i = 0; i < 420; i++){
    var x = (rnd() * FW) | 0, y = (rnd() * FH) | 0, w = 2 + ((rnd() * 5) | 0);
    g.fillStyle = rnd() < 0.5 ? F.ground2 : F.ground;
    g.fillRect(x, y, w, 1 + ((rnd() * 2) | 0));
  }
  /* 草・小石 */
  fd.deco.forEach(function(d){
    var x = d.x | 0, y = d.y | 0;
    if(d.t === 0){ P(g, x, y, 1, 2, tint(F.ground2, -14)); P(g, x + 1, y + 1, 1, 1, tint(F.ground2, -14)); }
    else if(d.t === 1){ P(g, x, y, 2, 1, tint(F.ground, 18)); }
    else { P(g, x, y, 1, 1, tint(F.rock, 10)); P(g, x + 1, y, 1, 1, tint(F.rock, -10)); }
  });
  /* 外周を 少し 暗く(谷の 壁) */
  var grd = g.createLinearGradient(0, 0, 0, 26);
  grd.addColorStop(0, "rgba(0,0,0,.55)"); grd.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = grd; g.fillRect(0, 0, FW, 26);
  g.fillStyle = "rgba(0,0,0,.30)";
  g.fillRect(0, 0, 6, FH); g.fillRect(FW - 6, 0, 6, FH); g.fillRect(0, FH - 6, FW, 6);
  /* 障害物 */
  fd.obs.forEach(function(o){ drawObstacle(g, o, F); });
  /* キャンプの たき火跡 */
  var cx = fd.camp.x | 0, cy = fd.camp.y | 0;
  ellipseFill(g, cx, cy, 13, 7, "rgba(0,0,0,.28)");
  P(g, cx - 6, cy - 1, 12, 3, "#4a3a28"); P(g, cx - 4, cy - 3, 8, 2, "#6a5238");
  P(g, cx - 2, cy - 5, 4, 3, "#c8541e"); P(g, cx - 1, cy - 7, 2, 2, "#ffb03a");
  /* 巣(眠り場) */
  var nx = fd.nest.x | 0, ny = fd.nest.y | 0;
  ellipseFill(g, nx, ny, 26, 15, tint(F.ground2, -22));
  ellipseFill(g, nx, ny, 20, 11, tint(F.ground2, -8));
  for(i = 0; i < 14; i++){
    var a = i / 14 * 6.283;
    P(g, (nx + Math.cos(a) * 23) | 0, (ny + Math.sin(a) * 13) | 0, 3, 2, tint(F.rock, -6));
  }
  return c;
}

function drawObstacle(g, o, F){
  var x = o.x | 0, y = o.y | 0, r = o.r | 0;
  ellipseFill(g, x, y + 2, r + 2, (r * 0.5) | 0, "rgba(0,0,0,.3)");
  if(o.kind === "tree"){
    P(g, x - 2, y - r, 4, r + 2, "#4a3520");
    ellipseFill(g, x, y - r - 4, r + 3, r + 1, "#2e5a24");
    ellipseFill(g, x - 2, y - r - 6, r, r - 1, "#3f7a30");
    P(g, x - 1, y - r - 9, 2, 2, "#54a03a");
  } else if(o.kind === "ember"){
    ellipseFill(g, x, y, r, r * 0.72, "#4a2a1e");
    ellipseFill(g, x - 1, y - 2, r - 2, r * 0.5, "#6a3a26");
    P(g, x - 1, y - r + 1, 2, 3, "#ff8a3a");
    P(g, x + 2, y - r + 3, 1, 2, "#ffc86a");
  } else if(o.kind === "crys"){
    TRI(g, [x, y - r - 5, x - r + 1, y + 3, x + r - 1, y + 3], "#5a4a8a");
    TRI(g, [x - 1, y - r - 3, x - r + 3, y + 2, x + 1, y + 2], "#8a7ac8");
    P(g, x - 1, y - r + 1, 1, 4, "#d0c0ff");
  } else {
    ellipseFill(g, x, y, r, r * 0.78, F.rock);
    ellipseFill(g, x - 1, y - 2, r - 2, r * 0.5, tint(F.rock, 16));
    P(g, x + 1, y + 1, 2, 1, tint(F.rock, -18));
  }
}

/* 楕円ぬり(ドット感を 保つため 走査線で 描く) */
function ellipseFill(g, cx, cy, rx, ry, col){
  g.fillStyle = col;
  for(var dy = -ry; dy <= ry; dy++){
    var w = Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry))) * rx;
    if(w < 0.5) continue;
    g.fillRect(Math.round(cx - w), Math.round(cy + dy), Math.max(1, Math.round(w * 2)), 1);
  }
}
function tint(hex, d){
  var n = parseInt(hex.slice(1), 16);
  var r = clamp(((n >> 16) & 255) + d, 0, 255);
  var gg = clamp(((n >> 8) & 255) + d, 0, 255);
  var b = clamp((n & 255) + d, 0, 255);
  return "#" + (((1 << 24) + (r << 16) + (gg << 8) + b).toString(16).slice(1));
}

/* ================================================================
   巨獣の 絵 ── 横向きで 描き、向きで 左右反転する
   ================================================================ */
function drawBeast(g, B, m){
  var L = B.look, sc = B.size;
  var fx = m.fx;                                   /* 1 = 右向き, -1 = 左向き */
  var w = L.w, h = L.h;
  g.save();
  g.translate(Math.round(m.x), Math.round(m.y));
  /* 影 */
  ellipseFill(g, 0, 6 * sc, (w * 0.6 * sc) | 0, (h * 0.34 * sc) | 0, "rgba(0,0,0,.34)");
  if(m.air > 0) g.translate(0, -m.air);
  g.scale(fx * sc, sc);
  if(m.hurt > 0) g.filter = "brightness(2.1) saturate(0.4)";
  else if(m.rage) g.filter = "saturate(1.35) brightness(1.08)";
  else if(m.tired) g.filter = "saturate(0.62) brightness(0.9)";

  var body = L.body, belly = L.belly, dark = tint(body, -34), lite = tint(body, 22);
  var lean = m.lean || 0;                          /* 予備動作の かがみ */

  /* 尻尾 */
  if(!m.tailCut){
    var tl = L.tl, ty = 2 + lean * 0.3;
    var sway = Math.sin(m.anim * 0.09) * 3 + (m.tailSw || 0);
    var k;
    for(k = 0; k < 6; k++){
      var t = k / 5;
      var tx = -w * 0.42 - tl * t;
      var tyy = ty + Math.sin(t * 2.2 + m.anim * 0.09) * 2.6 + sway * t;
      var tr = Math.max(1, (h * 0.30) * (1 - t * 0.72));
      ellipseFill(g, tx, tyy, tr + 1, tr, k % 2 ? tint(body, -8) : body);
    }
    if(L.tail === "club"){
      var cxx = -w * 0.42 - tl, cyy = ty + Math.sin(2.2 + m.anim * 0.09) * 2.6 + sway;
      ellipseFill(g, cxx - 3, cyy, 6, 5, tint(body, -18));
      P(g, cxx - 8, cyy - 4, 3, 2, "#d8d0c0"); P(g, cxx - 6, cyy + 3, 3, 2, "#d8d0c0");
    } else if(L.tail === "blade"){
      var bx = -w * 0.42 - tl, by2 = ty + Math.sin(2.2 + m.anim * 0.09) * 2.6 + sway;
      TRI(g, [bx + 2, by2 - 5, bx - 8, by2, bx + 2, by2 + 5], tint(body, 34));
      TRI(g, [bx + 1, by2 - 3, bx - 5, by2, bx + 1, by2 + 3], "#f0e0c0");
    }
  }
  /* 後ろあし */
  var gait = Math.sin(m.anim * 0.22) * (m.mov ? 3.4 : 0.7);
  legAt(g, -w * 0.24, h * 0.42, gait, dark, L.legs);
  if(L.legs >= 4) legAt(g, w * 0.24, h * 0.42, -gait, dark, L.legs);
  /* 翼(奥) */
  if(L.wing) drawWing(g, L, m, -1, tint(body, -26), belly);
  /* 胴 */
  ellipseFill(g, 0, 0 + lean * 0.4, w * 0.5, h * 0.5, body);
  ellipseFill(g, -1, h * 0.16 + lean * 0.4, w * 0.42, h * 0.30, belly);
  ellipseFill(g, -2, -h * 0.22 + lean * 0.3, w * 0.40, h * 0.24, lite);
  /* 背の こぶ・岩殻 */
  if(L.shell){
    var brk = m.broken && m.broken.back;
    ellipseFill(g, -2, -h * 0.44 + lean * 0.3, w * 0.36, h * 0.34, brk ? tint(body, -6) : tint(L.mane || dark, 10));
    if(!brk){
      var s;
      for(s = 0; s < 4; s++){
        var sx = -w * 0.26 + s * (w * 0.17);
        TRI(g, [sx, -h * 0.62 - 4 + lean * 0.3, sx - 4, -h * 0.36 + lean * 0.3, sx + 4, -h * 0.36 + lean * 0.3], "#9a9288");
        TRI(g, [sx, -h * 0.62 - 2 + lean * 0.3, sx - 2, -h * 0.40 + lean * 0.3, sx + 2, -h * 0.40 + lean * 0.3], "#c0b8aa");
      }
    } else {
      P(g, -w * 0.24, -h * 0.56 + lean * 0.3, w * 0.5, 2, "#3a2a1a");
    }
  } else if(L.spike){
    var q;
    for(q = 0; q < L.spike + 2; q++){
      var qx = -w * 0.3 + q * (w * 0.6 / (L.spike + 2));
      TRI(g, [qx, -h * 0.5 - 3 - lean * 0.2, qx - 2, -h * 0.34, qx + 2, -h * 0.34], L.mane || dark);
    }
  }
  /* たてがみ */
  if(L.mane && !L.shell){
    ellipseFill(g, w * 0.20, -h * 0.30 + lean * 0.5, w * 0.20, h * 0.42, L.mane);
  }
  /* 翼(手前) */
  if(L.wing) drawWing(g, L, m, 1, body, belly);
  /* 前あし */
  legAt(g, w * 0.30, h * 0.40, -gait * 0.8, tint(body, -18), L.legs);
  if(L.legs >= 4) legAt(g, w * 0.12, h * 0.44, gait * 0.8, tint(body, -18), L.legs);
  /* 首と 頭 */
  var hx = w * 0.44 + (m.headEx || 0), hy = -h * 0.42 + lean * 1.6;
  var nk;
  for(nk = 0; nk < 3; nk++){
    var t2 = nk / 2;
    ellipseFill(g, w * 0.30 + (hx - w * 0.30) * t2, (hy) * t2 * 0.9, h * 0.26 - t2 * 2, h * 0.24 - t2 * 1.6, tint(body, -6));
  }
  var HW = L.hw, HH = L.hh;
  ellipseFill(g, hx, hy, HW * 0.5, HH * 0.5, body);
  ellipseFill(g, hx + HW * 0.16, hy + HH * 0.16, HW * 0.34, HH * 0.28, belly);
  /* あご / くちばし */
  var open = m.jaw || 0;
  if(L.beak){
    TRI(g, [hx + HW * 0.42, hy - 3, hx + HW * 0.42 + 9, hy + 1 - open, hx + HW * 0.42, hy + 2], "#e8d24a");
    TRI(g, [hx + HW * 0.42, hy + 2 + open, hx + HW * 0.42 + 7, hy + 3 + open, hx + HW * 0.42, hy + 4 + open], "#c8a83a");
  } else {
    ellipseFill(g, hx + HW * 0.38, hy + 2 + open * 0.6, HW * 0.30, HH * 0.22, tint(body, -14));
    var tk;
    for(tk = 0; tk < 3; tk++) P(g, hx + HW * 0.30 + tk * 3, hy + 3 + open * 0.4, 2, 3, "#f0e8d8");
    if(open > 0.4) ellipseFill(g, hx + HW * 0.30, hy + 5 + open * 1.4, HW * 0.22, 2, "#4a1810");
  }
  /* 角 */
  if(L.horn){
    var hn;
    for(hn = 0; hn < L.horn; hn++){
      var ox2 = hx - hn * 4, hgt = 7 + hn * 2;
      if(m.broken && m.broken.head) hgt = Math.max(3, hgt - 5);
      TRI(g, [ox2, hy - HH * 0.5, ox2 - 3, hy - HH * 0.5 - hgt, ox2 + 3, hy - HH * 0.42], m.broken && m.broken.head ? "#8a7a68" : "#e8dcc0");
    }
  }
  /* 目 */
  var ec = m.rage ? "#ff4a3a" : (m.sleep ? null : L.eye);
  if(m.sleep){ P(g, hx + HW * 0.16, hy - 1, 4, 1, "#2a1a10"); }
  else {
    P(g, hx + HW * 0.14, hy - 2, 3, 3, "#1a1008");
    P(g, hx + HW * 0.18, hy - 2, 2, 2, ec);
  }
  if(L.glow && m.rage){
    var gl;
    for(gl = 0; gl < 5; gl++){
      var ga = m.anim * 0.05 + gl * 1.26;
      P(g, Math.cos(ga) * w * 0.34, -h * 0.5 + Math.sin(ga) * 4, 2, 2, L.glow);
    }
  }
  /* よだれ(疲労) */
  if(m.tired && (m.anim % 90) < 40){
    P(g, hx + HW * 0.34, hy + 6 + ((m.anim % 90) * 0.12), 1, 3, "#a8d8f0");
  }
  g.restore();
  g.filter = "none";
}
function legAt(g, x, y, off, col, n){
  ellipseFill(g, x, y + 2, 3, 5 + Math.abs(off) * 0.2, col);
  P(g, Math.round(x - 2 + off * 0.4), Math.round(y + 5), 5, 3, tint(col, -12));
}
function drawWing(g, L, m, side, col, belly){
  var flap = m.air > 0 ? Math.sin(m.anim * 0.36) * 9 : Math.sin(m.anim * 0.06) * 2;
  var bx = -L.w * 0.06, by = -L.h * 0.34 + side * 1.5;
  var sp = side > 0 ? 1 : 0.82;
  TRI(g, [bx, by, bx - 20 * sp, by - 14 - flap, bx + 6 * sp, by - 4 - flap * 0.4], col);
  TRI(g, [bx, by, bx - 16 * sp, by - 6 - flap * 0.7, bx - 20 * sp, by - 14 - flap], tint(col, 16));
  if(m.broken && m.broken.wingL && side > 0){
    P(g, bx - 14, by - 10 - flap * 0.8, 8, 2, "#3a1a12");
  } else {
    P(g, bx - 12 * sp, by - 9 - flap * 0.7, 2, 2, belly);
  }
}

/* ================================================================
   狩り中の 入力 ── スティックと ボタン
   ================================================================ */
var Act = {held:{}, buf:null, bufT:0, vx:0, vy:0, mag:0};
/* 硬直中に 押した ぶんを 少しだけ 覚えておく。
   これが 無いと、連続で 斬ろうとしたとき 入力が こぼれて 手が 止まる */
Act.press = function(k){ this.buf = k; this.bufT = 12; };
Act.take = function(){
  if(!this.buf || this.bufT <= 0) return null;
  var k = this.buf; this.buf = null; return k;
};
Act.clear = function(){ this.buf = null; this.bufT = 0; };

(function(){
  var AK = {
    KeyZ:"atk", KeyX:"heavy", KeyC:"roll", Space:"roll", KeyV:"sheath",
    KeyQ:"item", KeyE:"swap", ShiftLeft:"dash", ShiftRight:"dash"
  };
  function typing(e){ var t = e.target; return t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT"); }
  addEventListener("keydown", function(e){
    if(typing(e)) return;
    var k = AK[e.code]; if(!k) return;
    if(!e.repeat) Act.press(k);
    Act.held[k] = 1;
  });
  addEventListener("keyup", function(e){
    if(typing(e)) return;
    var k = AK[e.code]; if(!k) return;
    Act.held[k] = 0;
  });

  /* --- スティック --- */
  var st = $("stick"), knob = $("knob"), pid = null, cx = 0, cy = 0, R = 1;
  function setKnob(dx, dy){
    knob.style.transform = "translate(" + dx + "px," + dy + "px)";
  }
  function grab(e){
    if(pid !== null) return;
    pid = e.pointerId;
    var r = st.getBoundingClientRect();
    cx = r.left + r.width / 2; cy = r.top + r.height / 2; R = r.width * 0.36;
    st.setPointerCapture(pid);
    Snd.resume();
    move(e);
  }
  function move(e){
    if(e.pointerId !== pid) return;
    e.preventDefault();
    var dx = e.clientX - cx, dy = e.clientY - cy;
    var d = Math.hypot(dx, dy);
    var m = Math.min(1, d / R);
    if(d > 0.001){ Act.vx = dx / d * m; Act.vy = dy / d * m; } else { Act.vx = Act.vy = 0; }
    Act.mag = m;
    var kd = Math.min(d, R);
    setKnob(d > 0.001 ? dx / d * kd : 0, d > 0.001 ? dy / d * kd : 0);
  }
  function drop(e){
    if(e.pointerId !== pid) return;
    pid = null; Act.vx = Act.vy = 0; Act.mag = 0; setKnob(0, 0);
  }
  st.addEventListener("pointerdown", grab);
  st.addEventListener("pointermove", move, {passive:false});
  st.addEventListener("pointerup", drop);
  st.addEventListener("pointercancel", drop);

  /* --- ボタン --- */
  [].slice.call(document.querySelectorAll("#btns button")).forEach(function(b){
    var k = b.dataset.k;
    b.addEventListener("pointerdown", function(e){
      e.preventDefault(); Snd.resume();
      Act.held[k] = 1; Act.press(k); b.classList.add("on");
    });
    function up(e){ e.preventDefault(); Act.held[k] = 0; b.classList.remove("on"); }
    b.addEventListener("pointerup", up);
    b.addEventListener("pointercancel", up);
    b.addEventListener("pointerleave", up);
  });
})();
function padVisible(on){ $("pad").classList.toggle("hide", !on); }

/* ================================================================
   狩人
   ================================================================ */
var H = {};
function resetHunter(){
  var S = G.save;
  H.x = 0; H.y = 0; H.vx = 0; H.vy = 0;
  H.ang = -Math.PI / 2; H.fx = 1;
  H.hpMax = 120; H.hp = 120;
  H.stMax = 100; H.st = 100;
  H.state = "idle"; H.t = 0; H.dur = 0;
  H.drawn = false; H.move = null; H.hitSet = null;
  H.chargeT = 0; H.combo = -1; H.comboWin = 0;
  H.iframe = 0; H.anim = 0; H.swing = 0; H.swingArc = 0;
  H.sharp = 100;
  H.item = 0;
  H.lives = 3;
  H.wt = S.wep; H.tier = S.tier[S.wep];
  H.W = WTREE[S.wep][H.tier];
  H.T = WTYPE[S.wep];
  H.def = ATREE[S.armor].def;
  H.pouch = {};
  POUCH_ORDER.forEach(function(k){ H.pouch[k] = S.bag[k] || 0; });
}
function curBand(){
  var top = H.W.top;
  var i = Math.floor(H.sharp / 100 * (top + 1));
  return BANDS[clamp(i, 0, top)];
}
function hunterSpeed(){
  var s = H.drawn ? 58 : 70;
  s *= H.T.spd;
  return s;
}
function canAct(){
  return H.state === "idle" || H.state === "run";
}

/* --- 攻撃を 始める --- */
function startMove(key){
  var mv = MOVES[key];
  if(!mv) return;
  H.move = mv; H.state = "atk"; H.t = 0;
  H.dur = mv.wind + mv.act + mv.rec;
  H.hitSet = {};
  H.st = Math.max(0, H.st - mv.stam);
  H.shotDone = false;
  H.swing = 0;
  H.drawn = true;
  Snd.se(mv.kind === "shot" ? "cursor" : "swing");
}
function faceInput(){
  var ix = Act.vx, iy = Act.vy;
  if(Math.abs(ix) < 0.2 && Math.abs(iy) < 0.2){
    ix = (Input.held.right ? 1 : 0) - (Input.held.left ? 1 : 0);
    iy = (Input.held.down ? 1 : 0) - (Input.held.up ? 1 : 0);
  }
  if(ix || iy){ H.ang = Math.atan2(iy, ix); H.fx = Math.cos(H.ang) >= 0 ? 1 : -1; }
}
function moveVector(){
  var ix = Act.vx, iy = Act.vy, m = Act.mag;
  if(m < 0.15){
    ix = (Input.held.right ? 1 : 0) - (Input.held.left ? 1 : 0);
    iy = (Input.held.down ? 1 : 0) - (Input.held.up ? 1 : 0);
    var d = Math.hypot(ix, iy);
    if(d > 0){ ix /= d; iy /= d; m = 1; } else m = 0;
  }
  return {x:ix, y:iy, m:m};
}

function updateHunter(dt){
  H.anim++;
  if(H.iframe > 0) H.iframe--;
  if(H.comboWin > 0) H.comboWin--;
  if(H.swing > 0) H.swing--;

  if(Act.bufT > 0) Act.bufT--;
  var k;
  /* --- 行動できる 状態 --- */
  if(canAct()){
    while((k = Act.take())){
      if(k === "atk"){
        var seq = H.T.combo;
        var next = (H.comboWin > 0) ? (H.combo + 1) % seq.length : 0;
        H.combo = next;
        startMove(seq[next]);
        break;
      } else if(k === "heavy"){
        if(H.T.hold){ H.state = "charge"; H.chargeT = 0; H.drawn = true; H.t = 0; }
        else { H.combo = -1; startMove(H.T.charge[0]); }
        break;
      } else if(k === "roll"){
        if(H.st >= 22){ startRoll(); } else Snd.se("err");
        break;
      } else if(k === "sheath"){
        H.drawn = !H.drawn; Snd.se("cursor");
      } else if(k === "item"){
        useItem(); break;
      } else if(k === "swap"){
        swapItem();
      }
    }
  }

  switch(H.state){
    case "idle": case "run": {
      var v = moveVector();
      var dash = Act.held.dash && H.st > 2 && v.m > 0.2;
      var sp = hunterSpeed() * (dash ? 1.62 : 1) * v.m;
      if(dash){ H.st = Math.max(0, H.st - 22 * dt); if(H.st <= 0) dash = false; }
      H.vx = v.x * sp; H.vy = v.y * sp;
      if(v.m > 0.2){
        H.state = "run"; H.ang = Math.atan2(v.y, v.x); H.fx = Math.cos(H.ang) >= 0 ? 1 : -1;
      } else H.state = "idle";
      H.st = Math.min(H.stMax, H.st + (dash ? 0 : (H.state === "idle" ? 30 : 17)) * dt);
      break;
    }
    case "charge": {
      H.chargeT += dt * 60;
      var v2 = moveVector();
      var sp2 = hunterSpeed() * 0.42 * v2.m;
      H.vx = v2.x * sp2; H.vy = v2.y * sp2;
      if(v2.m > 0.2){ H.ang = Math.atan2(v2.y, v2.x); H.fx = Math.cos(H.ang) >= 0 ? 1 : -1; }
      var lv = chargeLevel();
      if(lv !== H.lastLv){ H.lastLv = lv; if(lv > 0) Snd.se("cursor"); }
      if(!Act.held.heavy){
        H.lastLv = -1;
        H.combo = -1;
        startMove(H.T.charge[lv]);
      }
      break;
    }
    case "atk": {
      var mv = H.move;
      H.t += dt * 60;
      /* 踏みこみ ── lunge は「何ピクセル 前に出るか」。
         速度に そのまま 入れると 獣を 突きぬけてしまうので、
         踏みこむ フレーム数で わって 積分が lunge に なるようにする */
      var win = mv.wind + mv.act;
      if(mv.lunge && H.t < win){
        /* (1-p)*2 の 三角形で 押すと、積分が ちょうど lunge ピクセルに なる */
        var p = H.t / win;
        var push = mv.lunge * 60 / win * (1 - p) * 2;
        H.vx = Math.cos(H.ang) * push; H.vy = Math.sin(H.ang) * push;
      } else { H.vx *= 0.72; H.vy *= 0.72; }
      if(H.t >= mv.wind && H.t < mv.wind + mv.act){
        if(mv.kind === "shot"){ if(!H.shotDone){ H.shotDone = true; fireShot(mv); } }
        else { H.swing = 8; H.swingArc = mv.arc; meleeCheck(mv); }
      }
      if(H.t >= H.dur){
        H.state = "idle";
        H.comboWin = 24;
        H.move = null;
      }
      break;
    }
    case "roll": {
      H.t += dt * 60;
      var pr = H.t / H.dur;
      var rs = 190 * (1 - pr * pr * 0.9);
      H.vx = Math.cos(H.rollA) * rs; H.vy = Math.sin(H.rollA) * rs;
      if(H.t >= H.dur){ H.state = "idle"; }
      break;
    }
    case "item": {
      H.t += dt * 60;
      H.vx *= 0.6; H.vy *= 0.6;
      if(!H.itemDone && H.t >= H.dur * 0.62){ H.itemDone = true; applyItem(H.itemKey); }
      if(H.t >= H.dur){ H.state = "idle"; }
      break;
    }
    case "hurt": {
      H.t += dt * 60;
      H.vx *= 0.88; H.vy *= 0.88;
      if(H.t >= H.dur){ H.state = "idle"; }
      break;
    }
    case "faint": {
      H.t += dt * 60;
      H.vx *= 0.8; H.vy *= 0.8;
      if(H.t >= H.dur) reviveAtCamp();
      break;
    }
    case "carve": {
      H.t += dt * 60;
      H.vx = H.vy = 0;
      if(H.t >= H.dur){ H.state = "idle"; }
      break;
    }
  }

  /* 移動と 当たり */
  moveWithCollision(H, H.vx * dt, H.vy * dt, 6);
  pushOutOfBeast();
}

function startRoll(){
  var v = moveVector();
  if(v.m > 0.2) H.ang = Math.atan2(v.y, v.x);
  H.rollA = H.ang;
  H.fx = Math.cos(H.ang) >= 0 ? 1 : -1;
  H.state = "roll"; H.t = 0; H.dur = 30;
  H.iframe = 17;
  H.st = Math.max(0, H.st - 22);
  H.combo = -1;
  Snd.se("step");
  FX.burst(H.x, H.y + 2, "#cbbb96", 5, 34, 0.26);
}
function chargeLevel(){
  var ct = H.T.ct, lv = 0, i;
  for(i = 0; i < ct.length; i++) if(H.chargeT >= ct[i]) lv = i;
  /* スタミナが 足りない 段階までしか 溜まらない */
  while(lv > 0 && H.st < MOVES[H.T.charge[lv]].stam) lv--;
  return lv;
}

/* --- 障害物と 外周に ぶつかりながら 動く --- */
function moveWithCollision(o, dx, dy, rad){
  var i, ob = G.fd.obs;
  o.x += dx;
  for(i = 0; i < ob.length; i++){
    var b = ob[i], d = Math.hypot(o.x - b.x, o.y - b.y), mr = rad + b.r * 0.7;
    if(d < mr && d > 0.001) o.x = b.x + (o.x - b.x) / d * mr;
  }
  o.y += dy;
  for(i = 0; i < ob.length; i++){
    var b2 = ob[i], d2 = Math.hypot(o.x - b2.x, o.y - b2.y), mr2 = rad + b2.r * 0.7;
    if(d2 < mr2 && d2 > 0.001) o.y = b2.y + (o.y - b2.y) / d2 * mr2;
  }
  o.x = clamp(o.x, 10, FW - 10);
  o.y = clamp(o.y, 24, FH - 10);
}
/* 狩人は 巨獣の 体に めりこめない(飛んでいる あいだは 下を くぐれる) */
function pushOutOfBeast(){
  var m = G.m;
  if(!m || m.dead || m.air > 10) return;
  var br = 12 * m.B.size;
  var dx = H.x - m.x, dy = H.y - m.y, d = Math.hypot(dx, dy);
  if(d < br && d > 0.001){
    H.x = m.x + dx / d * br;
    H.y = m.y + dy / d * br;
  }
}

/* ================================================================
   斬りの あたり判定
   ================================================================ */
function angDiff(a, b){
  var d = (a - b) % 6.283185;
  if(d > 3.14159) d -= 6.283185;
  if(d < -3.14159) d += 6.283185;
  return d;
}
function meleeCheck(mv){
  var m = G.m;
  if(!m || m.dead) return;
  var i, ps = m.parts;
  for(i = 0; i < ps.length; i++){
    var pt = ps[i];
    if(pt.gone) continue;
    if(H.hitSet[pt.k]) continue;
    var w = partPos(m, pt);
    var dx = w.x - H.x, dy = w.y - H.y, d = Math.hypot(dx, dy);
    if(d > mv.reach + w.r) continue;
    if(d > 2){
      var half = mv.arc / 2 + Math.atan2(w.r, Math.max(8, d));
      if(Math.abs(angDiff(Math.atan2(dy, dx), H.ang)) > half) continue;
    }
    H.hitSet[pt.k] = 1;
    dealDamage(pt, mv, w);
  }
}
function partPos(m, pt){
  var B = m.B, sc = B.size;
  return {x:m.x + pt.ox * m.fx * sc, y:m.y + pt.oy * sc - (m.air || 0), r:pt.r * sc};
}
function dealDamage(pt, mv, w){
  var m = G.m, band = curBand();
  var soft = pt.soft && m.broken[pt.k];
  var hard = soft ? pt.softHard : pt.hard;
  var hz = (soft ? pt.soft : pt.hz)[mv.kind] || 1;

  /* 空を 飛んでいる 相手には 近接が 届かない */
  if(m.air > 12 && mv.kind !== "shot"){
    UI.pop(sx(w.x), sy(w.y - 12), "とどかない", "bounce");
    return;
  }
  /* 弾かれ */
  if(mv.kind !== "shot" && band.hard < hard){
    Snd.se("err");
    H.sharp = Math.max(0, H.sharp - mv.sharp * 1.5);
    H.state = "hurt"; H.t = 0; H.dur = 26; H.iframe = 20;
    H.vx = -Math.cos(H.ang) * 90; H.vy = -Math.sin(H.ang) * 90;
    UI.pop(sx(w.x), sy(w.y - 10), "はじかれた", "bounce");
    FX.burst(w.x, w.y, "#c8d8f0", 8, 60, 0.35);
    G.freeze = 5;
    return;
  }
  var crit = Math.random() < 0.08 ? 1.35 : 1;
  var dmg = mv.mv * (H.W.atk / 100) * band.mul * hz * crit;
  if(m.sleep){ dmg *= 3; wakeUp(m); }
  if(m.trap || m.stun) dmg *= 1.12;
  dmg = Math.max(1, Math.round(dmg));

  m.hp -= dmg;
  m.rageGauge += dmg;
  if(pt.hp != null && !pt.gone){
    pt.dmg = (pt.dmg || 0) + dmg;
    if(pt.dmg >= pt.hp && !m.broken[pt.k]) breakPart(m, pt);
  }
  /* 打撃で 頭を 殴ると 気絶が たまる */
  if(mv.kind === "blunt" && pt.k === "head" && !m.stun){
    m.ko += mv.ko;
    if(m.ko >= m.koMax) stunBeast(m);
  }
  H.sharp = Math.max(0, H.sharp - mv.sharp * 0.5);
  m.hurt = 6;
  G.freeze = Math.min(9, mv.hs);
  G.hits++;
  G.dmgDealt += dmg;
  G.sinceHit = 0;
  Snd.se(crit > 1 ? "crit" : (hz >= 0.95 ? "hit" : "hitw"));
  UI.pop(sx(w.x) + rndInt(-4, 4), sy(w.y - 8), String(dmg), crit > 1 ? "crit" : "dmg");
  FX.burst(w.x, w.y, crit > 1 ? "#ffd75e" : (hz >= 0.95 ? "#ff8a5a" : "#c8c0b0"), crit > 1 ? 12 : 8, 66, 0.34);
  if(m.hp <= 0) killBeast(m);
  else reactBeast(m, dmg);
}
function breakPart(m, pt){
  m.broken[pt.k] = 1;
  if(pt.sever){ pt.gone = true; if(pt.k === "tail") m.tailCut = true; }
  if(pt.k === "wingL"){ m.canFly = false; m.air = 0; }
  Snd.se("break");
  G.broke.push(pt.n);
  UI.pop(sx(m.x), sy(m.y - 22), pt.sever ? (pt.n + "を 切断!") : (pt.n + "を 破壊!"), "crit");
  FX.burst(m.x, m.y - 6, "#ffd75e", 22, 92, 0.6);
  UI.flash(160, "#ffe8a0");
}
function stunBeast(m){
  m.stun = 340; m.state = "stun"; m.t = 0; m.ko = 0; m.koMax = Math.round(m.koMax * 1.5);
  Snd.se("break");
  UI.pop(sx(m.x), sy(m.y - 26), "気絶!", "crit");
}
function reactBeast(m, dmg){
  if(m.rageGauge >= m.rageNeed && !m.rage && !m.stun){ enterRage(m); }
}

/* ================================================================
   矢
   ================================================================ */
function fireShot(mv){
  var s = mv.shot, n = s.n || 1, i;
  for(i = 0; i < n; i++){
    var a = H.ang + (n > 1 ? (i - (n - 1) / 2) * s.spread : 0);
    G.shots.push({x:H.x + Math.cos(a) * 8, y:H.y - 6 + Math.sin(a) * 8,
                  vx:Math.cos(a) * s.spd, vy:Math.sin(a) * s.spd,
                  r:s.r, life:s.life, mv:mv, a:a});
  }
  Snd.se("shot");
}
function updateShots(dt){
  var m = G.m, i, j;
  for(i = G.shots.length - 1; i >= 0; i--){
    var s = G.shots[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    var gone = s.life <= 0 || s.x < 4 || s.x > FW - 4 || s.y < 20 || s.y > FH - 4;
    if(!gone && m && !m.dead){
      for(j = 0; j < m.parts.length; j++){
        var pt = m.parts[j];
        if(pt.gone) continue;
        var w = partPos(m, pt);
        if(Math.hypot(s.x - w.x, s.y - w.y) < w.r + s.r){
          H.hitSet = {};
          dealDamage(pt, s.mv, w);
          gone = true; break;
        }
      }
    }
    if(gone) G.shots.splice(i, 1);
  }
}

/* ================================================================
   道具
   ================================================================ */
function swapItem(){
  var n = POUCH_ORDER.length, i;
  for(i = 1; i <= n; i++){
    var idx = (H.item + i) % n;
    if(H.pouch[POUCH_ORDER[idx]] > 0){ H.item = idx; Snd.se("cursor"); return; }
  }
  Snd.se("err");
}
function useItem(){
  var key = POUCH_ORDER[H.item];
  if(!H.pouch[key]){ Snd.se("err"); return; }
  if(key === "tranq" && !(G.m && G.m.trap)){ Snd.se("err"); banner("わなに かかっていない"); return; }
  var it = ITEMS[key];
  H.state = "item"; H.t = 0; H.dur = it.lock * (H.wt === "sw" ? 0.7 : 1);
  H.itemDone = false; H.itemKey = key;
  /* 減らすのは 使いきってから。殴られて 中断したときに 損しないように */
  if(H.wt !== "sw") H.drawn = false;
  Snd.se("cursor");
}
function applyItem(key){
  var it = ITEMS[key];
  if(!H.pouch[key]) return;
  H.pouch[key]--;
  if(key === "potion" || key === "mega"){
    H.hp = Math.min(H.hpMax, H.hp + it.v);
    Snd.se("heal"); UI.pop(sx(H.x), sy(H.y - 18), "+" + it.v, "gold");
    FX.burst(H.x, H.y - 6, "#8effc0", 10, 44, 0.5);
  } else if(key === "whet"){
    H.sharp = Math.min(100, H.sharp + 72);
    Snd.se("levelup"); banner("切れ味が もどった");
  } else if(key === "meat"){
    H.st = H.stMax; Snd.se("heal"); banner("スタミナ 回復");
  } else if(key === "trap"){
    G.trap = {x:H.x, y:H.y, t:0, arm:52, used:false};
    Snd.se("buy"); banner("落とし穴を しかけた");
  } else if(key === "tranq"){
    var m = G.m;
    Snd.se("shot");
    if(m && m.trap){
      m.tranq++;
      FX.burst(m.x, m.y - 8, "#a8e0ff", 14, 60, 0.5);
      if(m.tranq >= 2 && m.hp / m.hpMax <= 0.20){ captureBeast(m); }
      else if(m.tranq >= 2){ banner("まだ 元気だ。弱らせろ"); m.tranq = 0; }
      else banner("麻酔玉 1つめ");
    }
  }
}

/* ================================================================
   狩人が 受ける ダメージ
   ================================================================ */
function hunterHurt(dmg, fx0, fy0, big){
  if(H.iframe > 0 || H.state === "faint" || G.over) return;
  var m = G.m;
  var d = dmg * (m.B.atk / 100) * (m.rage ? 1.25 : 1);
  d *= 1 - H.def / (H.def + 78);
  d = Math.max(1, Math.round(d));
  H.hp -= d;
  G.dmgTaken += d;
  var a = Math.atan2(H.y - fy0, H.x - fx0);
  H.vx = Math.cos(a) * (big ? 190 : 130);
  H.vy = Math.sin(a) * (big ? 190 : 130);
  H.iframe = 46;
  H.combo = -1;
  UI.flash(120, "#ff4a3a");
  UI.pop(sx(H.x), sy(H.y - 18), String(d), "hurt");
  Snd.se(big ? "hitb" : "hurt");
  G.freeze = 6;
  G.shake = big ? 7 : 4;
  if(H.hp <= 0){
    H.hp = 0;
    H.state = "faint"; H.t = 0; H.dur = 110; H.drawn = false;
    H.lives--;
    Snd.se("down");
  } else {
    H.state = "hurt"; H.t = 0; H.dur = big ? 40 : 26;
  }
}
function reviveAtCamp(){
  if(H.lives <= 0){ questEnd(false, "力尽きた"); return; }
  H.x = G.fd.camp.x; H.y = G.fd.camp.y;
  H.hp = H.hpMax; H.st = H.stMax;
  H.state = "idle"; H.vx = H.vy = 0; H.iframe = 60;
  banner("キャンプに 運ばれた　のこり " + H.lives);
}

/* ================================================================
   狩人の 絵
   ================================================================ */
var HWEP = {gs:"gsword", sw:"iron", hm:"club", bw:"bow"};
WLOOK.gsword = {k:"sword", c:"#dfe6f4"};
WLOOK.bow    = {k:"staff", c:"#a5744a"};
ALOOK.hunt0 = "#6a8a4a"; ALOOK.hunt1 = "#8a5a30"; ALOOK.hunt2 = "#7a7268"; ALOOK.hunt3 = "#a8422e";

function drawHunter(g){
  var X = Math.round(H.x - 8), Y = Math.round(H.y - 15);
  var dir = H.fx > 0 ? "right" : "left";
  var frame = (H.state === "run" && ((H.anim >> 3) & 1)) ? 1 : 0;
  var eq = {weapon:H.drawn ? HWEP[H.wt] : null, armor:"hunt" + G.save.armor};

  g.save();
  if(H.iframe > 0 && (H.anim >> 1) % 2) g.globalAlpha = 0.45;

  if(H.state === "roll"){
    /* 前転: つぶして 回す */
    g.translate(H.x, H.y - 6);
    g.rotate(H.fx * (H.t / H.dur) * 6.283);
    g.translate(-8, -8);
    P(g, 2, 4, 12, 9, ALOOK["hunt" + G.save.armor]);
    P(g, 4, 2, 8, 6, "#f0c39a");
    P(g, 4, 2, 8, 3, "#4a3a2a");
    g.restore();
    return;
  }
  if(H.state === "faint"){
    g.translate(H.x, H.y);
    g.rotate(1.4);
    g.translate(-8, -15);
    drawActor(g, 0, 0, "hero", "down", 0, SPR.hero, {armor:eq.armor});
    g.restore();
    return;
  }
  /* しゃがみ(道具・研ぎ) */
  if(H.state === "item"){
    drawActor(g, X, Y + 2, "hero", "down", 0, SPR.hero, {armor:eq.armor});
    var key = H.itemKey;
    var ic = key === "whet" ? "#9a9288" : (key === "trap" ? "#6a5238" : (key === "tranq" ? "#a8e0ff" : "#8effc0"));
    P(g, X + (H.fx > 0 ? 12 : 2), Y + 8, 3, 4, ic);
    if((H.anim >> 2) & 1) P(g, X + 5, Y - 4, 6, 1, "#ffffff");
    g.restore();
    return;
  }
  drawActor(g, X, Y, "hero", dir, frame, SPR.hero, eq);
  g.restore();

  /* 斬りの 軌跡 */
  if(H.swing > 0 && H.move){
    var p = 1 - H.swing / 8;
    var a0 = H.ang - H.swingArc / 2, a1 = H.ang + H.swingArc / 2;
    var a = a0 + (a1 - a0) * p;
    var R = H.move.reach;
    g.save();
    g.globalAlpha = 0.75 - p * 0.5;
    g.strokeStyle = H.move.kind === "blunt" ? "#ffd08a" : "#ffffff";
    g.lineWidth = 2.5;
    g.beginPath();
    g.arc(H.x, H.y - 6, R * 0.9, a - 0.5, a + 0.2);
    g.stroke();
    g.globalAlpha = 0.35;
    g.lineWidth = 5;
    g.beginPath();
    g.arc(H.x, H.y - 6, R * 0.86, a - 0.8, a + 0.1);
    g.stroke();
    g.restore();
  }
  /* 溜め */
  if(H.state === "charge"){
    var lv = chargeLevel();
    var cc = ["#e8e8f0", "#ffd75e", "#ff8a3a", "#ff4a3a"][lv];
    var i;
    for(i = 0; i < 4 + lv * 3; i++){
      var ca = H.anim * 0.12 + i * 1.0;
      var cr = 12 - (H.anim % 20) * 0.3;
      P(g, Math.round(H.x + Math.cos(ca) * cr), Math.round(H.y - 6 + Math.sin(ca) * cr * 0.6), 2, 2, cc);
    }
    if(lv > 0){
      g.save(); g.globalAlpha = 0.5;
      g.fillStyle = cc;
      g.fillRect(Math.round(H.x - 9), Math.round(H.y - 22), Math.round(18 * Math.min(1, H.chargeT / H.T.ct[H.T.ct.length - 1])), 2);
      g.restore();
    }
  }
}

/* ================================================================
   巨獣 ── 状態と ふるまい
   ================================================================ */
function spawnBeast(id){
  var B = BEASTS[id];
  var m = {
    id:id, B:B, x:FW * 0.66, y:FH * 0.40, fx:-1, vx:0, vy:0,
    hp:B.hp, hpMax:B.hp, anim:0, mov:false, hurt:0,
    state:"idle", t:0, dur:0, move:null, hitDone:null, cool:60,
    rage:false, rageT:0, rageGauge:0, rageNeed:B.hp * 0.22,
    tired:false, tiredT:0,
    stun:0, ko:0, koMax:110,
    sleep:false, air:0, canFly:!!B.look.wing,
    lean:0, jaw:0, headEx:0, tailSw:0,
    broken:{}, tailCut:false, trap:0, tranq:0, dead:false,
    goal:null, rageCount:0,
    parts:B.parts.map(function(p){ return JSON.parse(JSON.stringify(p)); })
  };
  return m;
}
function beastWeak(m){ return m.hp / m.hpMax <= 0.20; }
function enterRage(m){
  m.rage = true; m.rageT = 28 * 60; m.rageGauge = 0;
  m.rageNeed = Math.round(m.rageNeed * 1.35);
  m.rageCount++;
  m.tired = false;
  Snd.se("enc");
  banner(m.B.n + "が 怒っている!");
  FX.rise(m.x, m.y, "#ff6a3a", 18);
  G.shake = 6;
}
function endRage(m){
  m.rage = false;
  m.tired = true; m.tiredT = 14 * 60;
  banner(m.B.n + "は つかれている");
}
function wakeUp(m){
  m.sleep = false; m.state = "idle"; m.t = 0;
  banner(m.B.n + "が 目をさました!");
}
function killBeast(m){
  m.dead = true; m.hp = 0; m.state = "dead"; m.t = 0;
  Snd.se("dead");
  G.shake = 10;
  UI.flash(300, "#ffffff");
  FX.burst(m.x, m.y - 6, "#ffd75e", 30, 110, 0.9);
  questEnd(true, "討伐");
}
function captureBeast(m){
  m.dead = true; m.state = "captured"; m.t = 0;
  G.captured = true;
  Snd.se("levelup");
  UI.flash(280, "#a8e0ff");
  questEnd(true, "捕獲");
}

/* --- 巨獣を どう動かすか --- */
function updateBeast(m, dt){
  m.anim++;
  if(m.hurt > 0) m.hurt--;
  if(m.dead){ m.vx = m.vy = 0; m.lean = Math.min(6, m.lean + dt * 12); return; }

  if(m.rage){
    m.rageT -= dt * 60;
    if((m.anim % 8) === 0) FX.add({k:"p", x:m.x + rndf(-14, 14), y:m.y - 10, vx:rndf(-8, 8), vy:-26, c:"#ff7a4a", life:0.5, sz:2, g:-10});
    if(m.rageT <= 0) endRage(m);
  } else if(m.tired){
    m.tiredT -= dt * 60;
    if(m.tiredT <= 0) m.tired = false;
  }
  if(m.stun > 0){
    m.stun -= dt * 60;
    m.state = "stun"; m.vx = m.vy = 0;
    m.lean = 3 + Math.sin(m.anim * 0.3) * 1.5;
    if((m.anim % 6) === 0) FX.add({k:"p", x:m.x + rndf(-10, 10), y:m.y - 24, vx:rndf(-14, 14), vy:-18, c:"#ffe08a", life:0.5, sz:2, g:0});
    if(m.stun <= 0){ m.state = "idle"; m.t = 0; m.lean = 0; }
    return;
  }
  if(m.trap > 0){
    m.trap -= dt * 60;
    m.state = "trapped"; m.vx = m.vy = 0;
    m.lean = 2 + Math.sin(m.anim * 0.22) * 2;
    if(m.trap <= 0){ m.state = "idle"; m.t = 0; m.lean = 0; m.tranq = 0; banner(m.B.n + "が わなから 出た"); }
    return;
  }

  var dx = H.x - m.x, dy = H.y - m.y, dist = Math.hypot(dx, dy);
  var sc = m.B.size, spd = m.B.spd * (m.rage ? 1.32 : 1) * (m.tired ? 0.7 : 1);

  switch(m.state){
    case "sleep": {
      m.vx = m.vy = 0; m.lean = 4;
      m.hp = Math.min(m.hpMax, m.hp + m.hpMax * 0.004 * dt);
      if((m.anim % 70) < 3) FX.add({k:"p", x:m.x + 16 * m.fx, y:m.y - 14, vx:2 * m.fx, vy:-14, c:"#a8c8f0", life:1.1, sz:2, g:-4});
      if(dist < 26 && m.anim % 30 === 0 && Math.random() < 0.04) wakeUp(m);
      break;
    }
    case "flee": {
      var nx = G.fd.nest.x - m.x, ny = G.fd.nest.y - m.y, nd = Math.hypot(nx, ny);
      if(nd < 14){ m.sleep = true; m.state = "sleep"; m.t = 0; banner(m.B.n + "は 巣で ねむった"); break; }
      m.fx = nx >= 0 ? 1 : -1;
      m.vx = nx / nd * spd * 1.15; m.vy = ny / nd * spd * 1.15;
      m.mov = true; m.lean = 2;
      break;
    }
    case "idle": {
      m.lean *= 0.85; m.jaw *= 0.8; m.headEx *= 0.8;
      if(m.cool > 0) m.cool -= dt * 60;
      /* 瀕死で しばらく 殴られていなければ 巣へ */
      if(beastWeak(m) && m.rageT <= 0 && G.sinceHit > 5 * 60 && Math.random() < 0.02){
        m.state = "flee"; banner(m.B.n + "は 逃げ出した"); break;
      }
      if(dist < 190 && m.cool <= 0){
        var mv = chooseMove(m, dist);
        if(mv){ beginBeastMove(m, mv); break; }
      }
      /* 追う / うろつく */
      if(dist < 210){
        m.goal = null;
        if(dist > 40){
          m.fx = dx >= 0 ? 1 : -1;
          m.vx = dx / dist * spd; m.vy = dy / dist * spd; m.mov = true;
        } else { m.vx *= 0.8; m.vy *= 0.8; m.mov = false; m.fx = dx >= 0 ? 1 : -1; }
      } else {
        if(!m.goal || Math.hypot(m.goal.x - m.x, m.goal.y - m.y) < 12){
          m.goal = {x:rndf(40, FW - 40), y:rndf(46, FH - 40)};
        }
        var gx = m.goal.x - m.x, gy = m.goal.y - m.y, gd = Math.hypot(gx, gy);
        m.fx = gx >= 0 ? 1 : -1;
        m.vx = gx / gd * spd * 0.55; m.vy = gy / gd * spd * 0.55; m.mov = true;
      }
      break;
    }
    case "atk": {
      var mvv = m.move;
      m.t += dt * 60;
      var ph = m.t < mvv.wind ? "wind" : (m.t < mvv.wind + mvv.act ? "act" : "rec");
      beastMovePhase(m, mvv, ph, dt, dist, dx, dy);
      if(m.t >= mvv.wind + mvv.act + mvv.rec){
        m.state = "idle"; m.t = 0; m.move = null; m.lean = 0; m.jaw = 0; m.headEx = 0; m.tailSw = 0;
        m.cool = (m.rage ? 16 : 34) + rndInt(0, 26);
        if(!m.canFly || !mvv.air) m.air = 0;
      }
      break;
    }
  }
  moveWithCollision(m, m.vx * dt, m.vy * dt, 13 * sc);
  /* 空中は だんだん 降りる */
  if(m.air > 0 && !(m.state === "atk" && m.move && m.move.air)) m.air = Math.max(0, m.air - 60 * dt);
}

function chooseMove(m, dist){
  var list = m.B.moves.filter(function(mv){
    if(mv.air && !m.canFly) return false;
    return dist >= mv.rng[0] && dist <= mv.rng[1];
  });
  if(!list.length) return null;
  var tot = 0, i;
  for(i = 0; i < list.length; i++) tot += list[i].w;
  var r = Math.random() * tot;
  for(i = 0; i < list.length; i++){ r -= list[i].w; if(r <= 0) return list[i]; }
  return list[0];
}
function beginBeastMove(m, mv){
  m.state = "atk"; m.t = 0; m.move = mv; m.hitDone = {};
  m.dashDone = false;
  var dx = H.x - m.x;
  if(mv.tell !== "turn") m.fx = dx >= 0 ? 1 : -1;
  else m.fx = dx >= 0 ? -1 : 1;              /* 尻尾攻撃は 背を 向ける */
  m.aim = Math.atan2(H.y - m.y, H.x - m.x);
  Snd.se("cursor");
}
function beastMovePhase(m, mv, ph, dt, dist, dx, dy){
  var sc = m.B.size;
  if(ph === "wind"){
    var p = m.t / mv.wind;
    m.vx *= 0.82; m.vy *= 0.82; m.mov = false;
    /* 予備動作 */
    if(mv.tell === "crouch"){ m.lean = 3 * p; m.jaw = p; }
    else if(mv.tell === "back"){ m.lean = -2 * p; m.vx -= Math.cos(m.aim) * 34 * (1 - p); m.vy -= Math.sin(m.aim) * 34 * (1 - p); }
    else if(mv.tell === "rear"){ m.lean = -5 * p; m.headEx = -3 * p; }
    else if(mv.tell === "turn"){ m.tailSw = -6 * p; }
    else if(mv.tell === "curl"){ m.lean = 4 * p; }
    else if(mv.tell === "fly"){ m.air = Math.min(20, m.air + 44 * dt); m.lean = -2 * p; }
    else if(mv.tell === "roar"){ m.lean = -4 * p; m.jaw = p; }
    /* 溜め終わりに 光る */
    if(m.t >= mv.wind - 6) FX.add({k:"p", x:m.x + rndf(-16, 16), y:m.y - 14, vx:0, vy:-20, c:m.rage ? "#ff6a3a" : "#ffd75e", life:0.3, sz:2, g:0});
    /* 狙いを 少しだけ 追従 */
    if(p < 0.6 && mv.tell !== "turn"){
      m.aim = Math.atan2(H.y - m.y, H.x - m.x);
      m.fx = (H.x - m.x) >= 0 ? 1 : -1;
    }
    return;
  }
  if(ph === "rec"){
    m.vx *= 0.86; m.vy *= 0.86; m.mov = false;
    m.lean *= 0.88; m.jaw *= 0.86; m.tailSw *= 0.86;
    return;
  }
  /* --- act --- */
  var at = m.t - mv.wind;
  m.jaw = 1;
  if(mv.dash){
    var f = clamp(1 - at / mv.act, 0.25, 1);
    m.vx = Math.cos(m.aim) * mv.dash * f; m.vy = Math.sin(m.aim) * mv.dash * f;
    m.mov = true;
    if(mv.spin) m.lean = Math.sin(at * 0.6) * 4;
    if(mv.air) m.air = 18;
    if((at | 0) % 4 === 0) FX.burst(m.x, m.y + 4, "#c8b48a", 3, 30, 0.3);
  } else if(mv.step){
    var sf = clamp(1 - at / mv.act, 0, 1);
    m.vx = Math.cos(m.aim) * mv.step * 6 * sf; m.vy = Math.sin(m.aim) * mv.step * 6 * sf;
  } else { m.vx *= 0.8; m.vy *= 0.8; }
  if(mv.tell === "turn") m.tailSw = 10 * Math.sin(at / mv.act * 3.14);

  /* 判定の 円 */
  if(mv.hit){
    var i;
    for(i = 0; i < mv.hit.length; i++){
      var hc = mv.hit[i];
      var key = "h" + i + (mv.multi ? Math.floor(at / (mv.act / mv.multi)) : 0);
      if(m.hitDone[key]) continue;
      var wx = m.x + hc.ox * m.fx * sc, wy = m.y + hc.oy * sc - m.air;
      if(Math.hypot(H.x - wx, H.y - wy) < hc.r * sc + 6){
        m.hitDone[key] = 1;
        hunterHurt(hc.dmg, wx, wy, hc.r * sc > 15);
      }
    }
  }
  /* 一度だけの 大技 */
  if(!m.dashDone){
    if(mv.breath && (at | 0) % mv.breath.tick === 0){
      var b = mv.breath;
      var t2 = at / mv.act;
      var bx = m.x + (m.B.parts[0].ox + 6) * m.fx * sc, by = m.y + (m.B.parts[0].oy) * sc - m.air;
      G.haz.push({kind:"fire", x:bx, y:by,
                  vx:Math.cos(m.aim) * 150, vy:Math.sin(m.aim) * 150,
                  r:b.r, dmg:b.dmg, life:b.len / 150, t:0, hit:{}});
      Snd.se("fire");
    }
    if(mv.proj && at >= 2){
      m.dashDone = true;
      var px = m.x + 16 * m.fx * sc, py = m.y - 10 * sc;
      G.haz.push({kind:"rock", x:px, y:py, vx:Math.cos(m.aim) * mv.proj.spd, vy:Math.sin(m.aim) * mv.proj.spd,
                  r:mv.proj.r, dmg:mv.proj.dmg, life:mv.proj.life, t:0, hit:{}});
      Snd.se("swing");
    }
    if(mv.quake && at >= 2){
      m.dashDone = true;
      var q, n = 7;
      for(q = 1; q <= n; q++){
        var qd = q / n * mv.quake.len;
        G.haz.push({kind:"crack", x:m.x + Math.cos(m.aim) * qd, y:m.y + Math.sin(m.aim) * qd,
                    r:mv.quake.r, dmg:mv.quake.dmg, life:0.34, t:-q * 0.055, hit:{}});
      }
      Snd.se("thunder"); G.shake = 8;
    }
    if(mv.roar && at >= 2){
      m.dashDone = true;
      Snd.se("wind"); G.shake = 9;
      FX.ring(m.x, m.y - 10, "#ffe08a");
      if(Math.hypot(H.x - m.x, H.y - m.y) < 110 && H.state !== "roll" && H.iframe <= 0){
        H.state = "hurt"; H.t = 0; H.dur = 64; H.vx = H.vy = 0;
        banner("咆哮で ひるんだ!");
      }
    }
    if(mv.gust && at >= 2){
      m.dashDone = true;
      FX.ring(m.x, m.y, "#d8e8ff");
      var gd2 = Math.hypot(H.x - m.x, H.y - m.y);
      if(gd2 < 40){
        var ga = Math.atan2(H.y - m.y, H.x - m.x);
        H.vx += Math.cos(ga) * 150; H.vy += Math.sin(ga) * 150;
      }
    }
  }
}

/* ================================================================
   地面の 危険(ブレス・岩・地割れ)
   ================================================================ */
function updateHaz(dt){
  var i;
  for(i = G.haz.length - 1; i >= 0; i--){
    var z = G.haz[i];
    z.t += dt;
    if(z.t < 0) continue;
    if(z.vx != null){ z.x += z.vx * dt; z.y += z.vy * dt; }
    if(z.kind === "fire" && (z.t * 60 | 0) % 2 === 0){
      FX.add({k:"p", x:z.x + rndf(-3, 3), y:z.y + rndf(-3, 3), vx:rndf(-10, 10), vy:rndf(-30, -8),
              c:pick(["#ffd75e", "#ff8a3a", "#ff4a2a"]), life:0.34, sz:2, g:-20});
    }
    if(!z.hitOnce && Math.hypot(H.x - z.x, H.y - (z.y)) < z.r + 5){
      z.hitOnce = 1;
      hunterHurt(z.dmg, z.x, z.y, z.kind !== "fire");
      if(z.kind === "rock"){ z.life = 0; FX.burst(z.x, z.y, "#8a8278", 10, 60, 0.4); }
    }
    if(z.t >= z.life) G.haz.splice(i, 1);
  }
}
function drawHaz(g){
  G.haz.forEach(function(z){
    if(z.t < 0) return;
    if(z.kind === "crack"){
      var k = 1 - z.t / z.life;
      g.globalAlpha = Math.max(0, Math.min(1, k * 1.6));
      ellipseFill(g, z.x, z.y, z.r, z.r * 0.45, "#c8541e");
      ellipseFill(g, z.x, z.y, z.r * 0.6, z.r * 0.28, "#ffb03a");
      g.globalAlpha = 1;
    } else if(z.kind === "rock"){
      ellipseFill(g, z.x, z.y, z.r, z.r * 0.9, "#6a6258");
      ellipseFill(g, z.x - 1, z.y - 1, z.r * 0.6, z.r * 0.5, "#8a8278");
    } else if(z.kind === "fire"){
      ellipseFill(g, z.x, z.y, z.r, z.r * 0.8, "rgba(255,120,40,.5)");
    }
  });
}

/* ================================================================
   狩りの 進行
   ================================================================ */
function banner(txt){
  G.banner = txt; G.bannerT = 130;
}
function sx(wx){ return wx - G.cam.x; }
function sy(wy){ return wy - G.cam.y + HUD_H; }

function startHunt(q){
  G.q = q;
  G.fd = buildField(q.field);
  G.baked = bakeField(G.fd);
  G.m = spawnBeast(q.beast);
  G.shots = []; G.haz = []; G.trap = null;
  G.time = q.time * 60;
  G.hits = 0; G.dmgDealt = 0; G.dmgTaken = 0; G.broke = [];
  G.captured = false; G.over = false; G.freeze = 0; G.shake = 0;
  G.sinceHit = 0; G.banner = ""; G.bannerT = 0;
  G.cam = {x:0, y:0};
  FX.clear();
  resetHunter();
  H.x = G.fd.camp.x; H.y = G.fd.camp.y - 10;
  G.scene = "hunt";
  padVisible(matchMedia("(pointer: coarse)").matches);
  Snd.play(q.beast === "nushi" ? "boss" : "battle");
}

function updateTrap(dt){
  var t = G.trap, m = G.m;
  if(!t) return;
  t.t += dt * 60;
  if(t.used) return;
  if(t.t < t.arm) return;
  if(m && !m.dead && !m.trap && m.air <= 4 && Math.hypot(m.x - t.x, m.y - t.y) < 22){
    t.used = true;
    m.trap = 10 * 60; m.state = "trapped"; m.move = null; m.tranq = 0;
    Snd.se("break"); G.shake = 6;
    banner(m.B.n + "が わなに かかった!");
  }
}

function huntStep(dt){
  if(G.over) return;
  if(G.freeze > 0){ G.freeze--; return; }
  G.time -= dt * 60;
  G.sinceHit += dt * 60;
  /* 狩り中は 窓UIの キュー(Z=決定 など)を ためこまない。
     残すと 狩りのあと 出る 結果画面が 勝手に 決定されてしまう */
  Input.clear();
  if(G.time <= 0){ questEnd(false, "時間切れ"); return; }
  updateHunter(dt);
  if(G.m) updateBeast(G.m, dt);
  updateShots(dt);
  updateHaz(dt);
  updateTrap(dt);
  FX.update(dt);
  if(G.shake > 0) G.shake -= dt * 22;
  if(G.bannerT > 0) G.bannerT--;
  /* カメラ */
  var tw = SCR_W, th = SCR_H - HUD_H;
  G.cam.x = clamp(H.x - tw / 2, 0, Math.max(0, FW - tw));
  G.cam.y = clamp(H.y - th / 2, 0, Math.max(0, FH - th));
}

/* ================================================================
   描画
   ================================================================ */
function renderHunt(){
  var g = ctx;
  g.fillStyle = "#000"; g.fillRect(0, 0, SCR_W, SCR_H);
  var shk = G.shake > 0 ? G.shake : 0;
  var ox = shk ? rndInt(-shk, shk) * 0.5 : 0, oy = shk ? rndInt(-shk, shk) * 0.5 : 0;
  g.save();
  g.beginPath(); g.rect(0, HUD_H, SCR_W, SCR_H - HUD_H); g.clip();
  g.translate(Math.round(-G.cam.x + ox), Math.round(-G.cam.y + HUD_H + oy));
  g.drawImage(G.baked, 0, 0);

  /* わな */
  if(G.trap){
    var t = G.trap;
    if(t.used){
      ellipseFill(g, t.x, t.y, 16, 9, "#120c06");
      ellipseFill(g, t.x, t.y - 1, 13, 7, "#000000");
    } else {
      var arm = t.t >= t.arm;
      ellipseFill(g, t.x, t.y, 14, 8, arm ? "#4a3a24" : "#5a4a30");
      var q;
      for(q = 0; q < 6; q++) P(g, t.x - 12 + q * 4, t.y - 1 + Math.sin(q) * 2, 3, 1, "#7a6a48");
      if(!arm && (G.m ? 1 : 1)) P(g, t.x - 1, t.y - 8, 2, 2, "#ffd75e");
    }
  }
  drawHaz(g);

  /* 前後関係で ならべる */
  var ents = [];
  if(G.m) ents.push({y:G.m.y, f:function(){ drawBeast(g, G.m.B, G.m); drawBeastMarks(g, G.m); }});
  ents.push({y:H.y, f:function(){ drawHunter(g); }});
  ents.sort(function(a, b){ return a.y - b.y; });
  ents.forEach(function(e){ e.f(); });

  /* 矢 */
  G.shots.forEach(function(s){
    g.save(); g.translate(s.x, s.y); g.rotate(s.a);
    P(g, -6, -1, 10, 1, "#d8c8a0"); P(g, 4, -1, 3, 1, "#e8e8f0");
    P(g, -7, -2, 2, 3, "#c8a04a");
    g.restore();
  });
  FX.draw(g);
  g.restore();
  drawHUD(g);
}

/* 部位破壊の しるし */
function drawBeastMarks(g, m){
  if(m.dead) return;
  var i;
  for(i = 0; i < m.parts.length; i++){
    var pt = m.parts[i];
    if(!m.broken[pt.k] || pt.gone) continue;
    var w = partPos(m, pt);
    if((m.anim >> 3) % 6 === 0) P(g, w.x - 1, w.y - 1, 2, 2, "#ffd75e");
  }
  /* わなに かかっているときの しるし */
  if(m.trap > 0 && (m.anim >> 3) % 2){
    P(g, m.x - 2, m.y - 34, 4, 4, "#a8e0ff");
  }
}

/* ================================================================
   情報帯
   ================================================================ */
function bar(g, x, y, w, h, v, max, col, bg){
  P(g, x - 1, y - 1, w + 2, h + 2, "#12100c");
  P(g, x, y, w, h, bg || "#2a241c");
  var ww = Math.max(0, Math.round(w * clamp(v / max, 0, 1)));
  if(ww > 0) P(g, x, y, ww, h, col);
  P(g, x, y, ww, 1, "rgba(255,255,255,.35)");
}
function beastMood(m){
  if(!m) return "";
  if(m.dead) return "たおれた";
  if(m.sleep) return "ねむっている";
  if(m.trap > 0) return "わなに かかっている";
  if(m.stun > 0) return "気絶している";
  if(beastWeak(m)) return "瀕死";
  if(m.rage) return "怒っている";
  if(m.tired) return "つかれている";

function newSave(){

function saveGame(){
  if(!STORAGE_OK) return false;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(G.save)); return true; }
  catch(e){ return false; }
}
function loadGame(){
  try{
    var d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(d && d.tier && d.bag){ G.save = d; return true; }
  }catch(e){}
  return false;
}
function hasSave(){
  try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; }
}
function encodeSave(){
  return btoa(unescape(encodeURIComponent(JSON.stringify(G.save)))).replace(/=+$/, "");
}
function decodeSave(code){
  try{
    var s = String(code).replace(/\s+/g, "");
    while(s.length % 4) s += "=";
    var d = JSON.parse(decodeURIComponent(escape(atob(s))));
    return (d && d.tier && d.bag) ? d : null;
  }catch(e){ return null; }
}
function matCount(k){ return G.save.mats[k] || 0; }
function addMat(k, n){ G.save.mats[k] = (G.save.mats[k] || 0) + n; }
function canAfford(rec, g){
  if(G.save.g < g) return false;
  if(!rec) return true;
  for(var k in rec) if(matCount(k) < rec[k]) return false;
  return true;
}
function payFor(rec, g){
  G.save.g -= g;
  if(rec) for(var k in rec) G.save.mats[k] -= rec[k];
}
function recipeText(rec, g){
  var a = [];
  if(g) a.push(g + "G");
  if(rec) for(var k in rec) a.push(MAT[k].n + " " + matCount(k) + "/" + rec[k]);

}

/* テキスト入出力の 窓 */
function codeWindow(cap, value, editable){
  return new Promise(function(res){
    var host = (G.scene === "title") ? $("title") : UI.layer;
    var w = el("div", "win", "");
    w.style.left = "calc(6*var(--u))"; w.style.right = "calc(6*var(--u))"; w.style.top = "calc(30*var(--u))";
    w.appendChild(el("div", "cap", esc(cap)));
    var ta = document.createElement("textarea");
    ta.value = value;
    ta.readOnly = !editable;
    ta.style.cssText = "width:100%;height:calc(90*var(--u));margin-top:calc(4*var(--u));" +
      "background:#0d0906;color:#f4e9d2;border:calc(1*var(--u)) solid #8a6a3a;border-radius:calc(2*var(--u));" +
      "font:inherit;font-size:calc(6.5*var(--u));line-height:1.5;padding:calc(2*var(--u));resize:none;word-break:break-all;";
    w.appendChild(ta);
    var row = el("div", "small", "");
    row.style.cssText = "margin-top:calc(3*var(--u));display:flex;gap:calc(4*var(--u));justify-content:flex-end";
    var b1 = el("button", "", editable ? "読みこむ" : "コピー");
    var b2 = el("button", "", "とじる");
    [b1, b2].forEach(function(b){
      b.style.cssText = "font:inherit;font-size:calc(7*var(--u));font-weight:700;color:#f4e9d2;" +
        "background:#3a2a18;border:calc(1*var(--u)) solid #e8d6a8;border-radius:calc(2*var(--u));" +
        "padding:calc(1*var(--u)) calc(4*var(--u));cursor:pointer";
      row.appendChild(b);
    });
    w.appendChild(row);
    host.appendChild(w);
    if(editable) setTimeout(function(){ ta.focus(); }, 60);
    function done(v){ w.remove(); res(v); }
    b1.addEventListener("click", function(){
      if(editable){ done(ta.value.trim()); }
      else {
        ta.select();
        try{ document.execCommand("copy"); b1.textContent = "コピーした"; }catch(e){ b1.textContent = "選んで コピー"; }
      }
    });
    b2.addEventListener("click", function(){ done(null); });
  });
}

function rollMats(m, n){
  var got = {}, tbl = m.B.mats, keys = Object.keys(tbl), i;
  for(i = 0; i < n; i++){
    var k = pick(keys), r = tbl[k];
    var q = rndInt(r[0], r[1]);
    if(q > 0) got[k] = (got[k] || 0) + q;
  }
  return got;
}

  if(G.over) return;
  G.over = true;
  var q = G.q, m = G.m;
  padVisible(false);
  Input.clear(); Act.clear();
  Snd.play(win ? "town" : "dark");
  await sleep(900);
  await UI.fade(true);

  var got = {}, gold = 0, lines = [];
  if(win){
    /* 剥ぎ取り / 捕獲 */
    got = rollMats(m, G.captured ? 5 : 4);
    /* 部位破壊の ぶん */
    m.parts.forEach(function(pt){
      if(m.broken[pt.k] && pt.brk) got[pt.brk] = (got[pt.brk] || 0) + 1;
    });
    gold = q.g + (G.captured ? Math.round(q.g * 0.25) : 0);
    G.save.g += gold;
    for(var k in got) addMat(k, got[k]);
    G.save.hunted[q.beast] = (G.save.hunted[q.beast] || 0) + 1;
    if(!G.save.cleared[q.id]){
      G.save.cleared[q.id] = 1;
      if(G.save.quests < QUESTS.length) G.save.quests++;
    }
    var used = Math.round(q.time - G.time / 60);
    var bt = G.save.best[q.id];
    if(bt == null || used < bt) G.save.best[q.id] = used;
  }
  /* 使った 道具を 反映 */
  POUCH_ORDER.forEach(function(k){ G.save.bag[k] = H.pouch[k]; });
  saveGame();

  var el2 = $("result");
  el2.className = "ov on " + (win ? "win" : "lose");
  el2.querySelector(".big").textContent = win ? (G.captured ? "捕獲 成功" : "狩猟 成功") : "狩猟 失敗";
  var used2 = Math.max(0, Math.round(q.time - G.time / 60));
  var mm = (used2 / 60) | 0, ss = used2 % 60;
  lines.push(BEASTS[q.beast].n + "　" + how);
  lines.push("時間 " + mm + "分" + (ss < 10 ? "0" : "") + ss + "秒　あたえた ダメージ <b>" + Math.round(G.dmgDealt) + "</b>");
  if(G.broke.length) lines.push("破壊: " + G.broke.join("・"));
  if(win){
    var gl = [];
    for(var k2 in got) gl.push(MAT[k2].n + "×" + got[k2]);
    lines.push("報酬 <b>" + gold + "G</b>");
    lines.push(gl.length ? gl.join("　") : "素材は 手に入らなかった");
  }
  el2.querySelector(".stat").innerHTML = lines.join("<br>");
  await UI.fade(false);
  Snd.se(win ? "levelup" : "dead");

  await UI.list({
    items:[{l:"野営地へ もどる"}],
    into:$("resultMenu"), noCancel:true,
    css:{position:"relative", left:"0", top:"0", display:"inline-block"}
  });
  await UI.fade(true);
  el2.className = "ov";
  $("resultMenu").innerHTML = "";
  UI.clearAll();
  G.scene = "village";
  await UI.fade(false);
  village();
}

/* ================================================================
   本編ループ
   ================================================================ */
var lastT = 0, acc = 0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!lastT) lastT = ts;
  /* 遅い端末でも 実時間に 追いつけるだけの 余裕を もつ。
     きざみ幅は 1/60 秒 固定なので、まとめて 進めても すり抜けは 起きない */
  var dt = Math.min(0.12, (ts - lastT) / 1000);
  lastT = ts;
  if(G.scene === "hunt"){
    acc += dt;
    var n = 0;
    while(acc >= 1 / 60 && n < 9){ huntStep(1 / 60); acc -= 1 / 60; n++; }
    if(acc > 0.3) acc = 0;
    renderHunt();
  } else if(G.scene === "village"){
    renderVillage();
  } else if(G.scene === "title"){
    renderTitleBg();
  }
}
function renderTitleBg(){
  vTick++;
  var g = ctx;
  var sky = g.createLinearGradient(0, 0, 0, SCR_H);
  sky.addColorStop(0, "#14101c"); sky.addColorStop(0.55, "#3a2030"); sky.addColorStop(1, "#7a3a20");
  g.fillStyle = sky; g.fillRect(0, 0, SCR_W, SCR_H);
  var i;
  for(i = 0; i < 30; i++){
    var xx = (i * 89) % SCR_W, yy = (i * 51) % 110;
    if(((vTick >> 4) + i) % 9 !== 0) P(g, xx, yy, 1, 1, "#e8e0ff");
  }
  for(i = 0; i < 6; i++){
    var mx = i * 54 - 24, mh = 60 + (i % 3) * 22;
    TRI(g, [mx, SCR_H, mx + 40, SCR_H - mh, mx + 80, SCR_H], i % 2 ? "#1d1826" : "#171320");
  }
  /* 巨獣の 影 */
  var m = {x:170, y:196, fx:-1, anim:vTick, mov:false, air:0, hurt:0, rage:false, tired:false,
           lean:0, jaw:0, headEx:0, tailSw:0, broken:{}, tailCut:false, sleep:false};
  g.save();
  g.globalAlpha = 0.9;
  g.filter = "brightness(0.22)";
  drawBeast(g, BEASTS.nushi, m);
  g.restore();
  g.filter = "none";
}

/* ================================================================
   はじまり
   ================================================================ */
async function boot(){
  G.save = newSave();
  Snd.play("dark");
  while(true){
    var has = hasSave();
    var i = await UI.list({
      head:STORAGE_OK ? "" : "※この環境では 記録を のこせません。\n　あいことばを おつかいください。",
      items:[{l:"新しく はじめる"}, {l:"つづきから", off:!has}, {l:"あいことばで はじめる"}, {l:"あそびかた"}],
      css:{top:"calc(132*var(--u))", minWidth:"calc(112*var(--u))"},
      cls:"mid", into:$("titleMenu"), index:has ? 1 : 0, noCancel:true
    });
    Snd.init(); Snd.resume();
    if(i === 3){ await howTo(); continue; }
    if(i === 1){ if(!loadGame()){ Snd.se("err"); continue; } }
    if(i === 2){
      $("title").classList.add("choosing");
      var v = await codeWindow("あいことばを 貼りつけて ください", "", true);
      $("title").classList.remove("choosing");
      if(!v) continue;
      var d = decodeSave(v);
      if(!d){ Snd.se("err"); await UI.say("あいことばが ちがうようだ。"); UI.closeMsg(); continue; }
      G.save = d; saveGame();
    }
    if(i === 0) G.save = newSave();
    break;
  }
  await UI.fade(true);
  $("title").classList.remove("on");
  UI.clearAll();
  await UI.fade(false);
  village();
}
async function howTo(){
  await UI.sayAll([
    "巨獣は 強い。まともに 殴り合っては 勝てない。\nよけて、隙に 斬りこむ。それだけだ。",
    "移動は 左スティック(WASD)。C か「避」で 前転。\n転がっている あいだは 攻撃が すり抜ける。",
    "「斬」で 攻撃、「溜」を 長おしで 溜め攻撃。\n溜めるほど 重いが、そのぶん 動けない。",
    "武器には 切れ味が ある。斬るほど 落ちて、\nかたい部位では はじかれる。砥石で もどせ。",
    "頭・尻尾・背などは 部位ごとに 効きが ちがう。\nこわすと 素材が 多く 手に入る。",
    "弱った獣は 巣へ 帰って 眠る。\n落とし穴と 麻酔玉×2 で 生け捕りに できる。",
    "力尽きるのは 3回まで。素材を 集めて 装備を きたえろ。"
  ]);
  UI.closeMsg();
}

/* ================================================================
   画面サイズ ── 1ドットを 何 CSSピクセルで 描くか
   ================================================================ */
function resize(){
  /* さわる端末では 下の そうさボタンぶんを 空けておく */
  var coarse = matchMedia("(pointer: coarse)").matches;
  var availH = innerHeight * (coarse ? 0.58 : 0.96);
  var s = Math.min(innerWidth / SCR_W, availH / SCR_H);
  if(s >= 2) s = Math.floor(s * 2) / 2;
  s = Math.max(1, Math.min(s, 4.6));
  document.documentElement.style.setProperty("--u", s + "px");
  /* そうさボタンは 画面の あまり全体を つかう。
     下に はりつけると 親指から 遠くなり、中央が ぽっかり あいてしまう */
  var pad = $("pad"), st = $("stage");
  if(pad && st){
    var r = st.getBoundingClientRect();
    var topY = Math.min(innerHeight - 90, r.bottom + 4);
    pad.style.top = coarse ? topY + "px" : "";
    pad.style.height = coarse ? "auto" : "";
  }
}
addEventListener("resize", resize);
addEventListener("orientationchange", function(){ setTimeout(resize, 120); });
resize();

/* タイトルでは 最初のひと押しで BGMを鳴らす(自動再生できないため) */
["pointerdown", "keydown"].forEach(function(ev){
  addEventListener(ev, function once(){
    if(G.scene === "title" && Snd.on) Snd.play("dark");
    removeEventListener(ev, once);
  });
});

/* 起動 */
padVisible(false);
requestAnimationFrame(frame);
boot();
</script>
