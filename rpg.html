/* --- 敵の行動 --- */
async function enemyAct(e){
  if(e.sleep){
    e.sleep--;
    await bMsg(e.n + "は ねむっている。");
    return;
  }
  if(e.stun){
    e.stun = 0;
    await bMsg(e.n + "は ひるんで うごけない!");
    return;
  }
  var living = livingParty();
  if(!living.length) return;
  var act = e.ai[e.aiI % e.ai.length];
  e.aiI++;
  if(Math.random() < 0.25) act = pick(e.ai);
  /* マホトーンで じゅもんは 封じられる(ブレスや物理は封じられない) */
  if(e.silence && ["mera","gira","dark","heal2","sleepA"].indexOf(act) >= 0){
    await bMsg(e.n + "は じゅもんを となえようとした!\nしかし ふうじられている!");
    return;
  }
  var tgt = pick(living);
  /* かばう: 単体攻撃は かばっている仲間が うけとめる */
  var covers = living.filter(function(x){ return x.cover != null && Game.party[x.cover] === tgt && x !== tgt; });
  if(covers.length) tgt = covers[0];
  var ti = memberIndex(tgt);
  switch(act){
    case "guard":
      e.guard = 1;
      Snd.se("guard");
      await bMsg(e.n + "は みを かためた!");
      return;
    case "heal2":
      if(e.hp > e.max * 0.55){ act = "atk"; break; }
      var hv = Math.floor(e.max * 0.12);
      e.hp = Math.min(e.max, e.hp + hv);
      Snd.se("heal");
      FX.rise(e.x, e.y - 20, "#8effa0", 14);
      UI.pop(e.x, e.y - 34, "+" + hv, "heal");
      await bMsg(e.n + "は きずを いやした!");
      return;
    case "mera": case "dark": case "breath": case "gira": case "quake": {
      var all = act === "mera" ? 0 : 1;
      var label = {mera:"メラ", gira:"ギラ", breath:"はげしい ほのおを はいた!", dark:"やみの はどう!", quake:"だいちを ゆらした!"}[act];
      if(act === "mera" || act === "gira") await bMsg(e.n + "は " + label + "を となえた!");
      else await bMsg(e.n + "の " + label);
      var elk = act === "dark" ? "dark" : act === "quake" ? "blast" : "fire";
      var tl = all ? living : [tgt];
      tl.forEach(function(t){ elFx(elk, PPOS[memberIndex(t)][0] + 8, PPOS[memberIndex(t)][1] + 14); });
      Game.shake = 3;
      await sleep(240);
      var base = {mera:20, gira:16, breath:28, dark:34, quake:0}[act];
      var B2 = Game.battle;
      var txt = "";
      for(var i = 0; i < tl.length; i++){
        var t = tl[i];
        var dmg = act === "quake"
          ? Math.max(1, Math.floor((eatk(e) * 0.55 - ST(t, "def") * 0.25) * rndf(0.85, 1.15)))
          : Math.max(1, Math.floor((base + e.d.mag * 0.6) * rndf(0.88, 1.12) - ST(t, "def") * 0.12));
        /* フバーハはブレス系を、マジックバリアはじゅもん系を弱める */
        if(B2.breathGuard && (act === "breath" || act === "dark")) dmg = Math.floor(dmg * 0.55);
        if(B2.spellGuard && (act === "mera" || act === "gira")) dmg = Math.floor(dmg * 0.6);
        if(t.guard) dmg = Math.floor(dmg * 0.5);
        if(t.reckless) dmg = Math.floor(dmg * 1.5);
        t.hp = Math.max(0, t.hp - dmg);
        t.hurt = 0.3;
        UI.pop(PPOS[memberIndex(t)][0] + 8, PPOS[memberIndex(t)][1], String(dmg), "dmg");
        txt += t.n + "は " + dmg + " のダメージを うけた!\n";
      }
      refreshPanel();
      await bMsg(txt.trim());
      for(var j = 0; j < tl.length; j++) if(tl[j].hp <= 0) await downMember(tl[j]);
      return;
    }
    case "sleepA":
      await bMsg(e.n + "は ラリホーを となえた!");
      Snd.se("spell");
      FX.rise(PPOS[ti][0] + 8, PPOS[ti][1] + 8, "#c8b0ff", 12);
      await sleep(220);
      if(Math.random() < 0.45){ tgt.status = "sleep"; await bMsg(tgt.n + "は ねむってしまった!"); }
      else await bMsg(tgt.n + "には きかなかった!");
      return;
  }
  /* 通常こうげき */
  await bMsg(e.n + "の こうげき!");
  e.ox = -6;
  setTimeout(function(){ e.ox = 0; }, 140);
  await sleep(130);
  if(Math.random() < (e.blind ? 0.45 : 0.04)){
    Snd.se("miss");
    UI.pop(PPOS[ti][0] + 8, PPOS[ti][1], "MISS", "miss");
    await bMsg(e.blind ? "こうげきは 空を きった!" : "しかし ミス!");
    return;
  }
  var crit = Math.random() < 0.04;
  var dmg2 = crit ? Math.floor(eatk(e) * 1.4 * rndf(0.95, 1.1))
                  : Math.max(1, Math.floor((eatk(e) * 0.95 - ST(tgt, "def") * 0.35) * rndf(0.85, 1.15)));
  if(tgt.guard) dmg2 = Math.floor(dmg2 * 0.45);
  if(tgt.reckless) dmg2 = Math.floor(dmg2 * 1.5);
  Snd.se(crit ? "crit" : "hit");
  Game.shake = crit ? 3.5 : 2;
  tgt.hp = Math.max(0, tgt.hp - dmg2);
  tgt.hurt = 0.3;
  UI.pop(PPOS[ti][0] + 8, PPOS[ti][1], String(dmg2), crit ? "crit" : "dmg");
  refreshPanel();
  await bMsg((crit ? "かいしんの いちげき!\n" : "") + tgt.n + "は " + dmg2 + " のダメージを うけた!");
  if(act === "poison" && alive(tgt) && !tgt.status && Math.random() < 0.4){
    tgt.status = "poison";
    await bMsg(tgt.n + "は どくに おかされた!");
  }
  if(tgt.hp <= 0) await downMember(tgt);
}

/* --- 戦闘終了 --- */
async function endBattle(result, enemies, opt){
  var B = Game.battle;
  if(result === "win"){
    Snd.stop();
    Snd.jingle([["C5",.14],["C5",.14],["C5",.14],["C5",.34],["G#4",.3],["A#4",.3],["C5",.2],["A#4",.14],["C5",.6]]);
    var exp = enemies.reduce(function(s, e){ return s + e.d.exp; }, 0);
    var gold = enemies.reduce(function(s, e){ return s + e.d.g; }, 0);
    Game.gold += gold;
    await bMsg("たたかいに かった!", true);
    if(exp || gold) await bMsg("けいけんちを " + exp + " かくとく!\n" + gold + " ゴールドを 手に入れた!", true);
    for(var i = 0; i < Game.party.length; i++){
      var m = Game.party[i];
      if(!alive(m)) continue;
      m.exp += exp;
      while(m.lv < 60 && m.exp >= expFor(m.lv + 1)){
        var before = {hp:maxHP(m), mp:maxMP(m), atk:ST(m, "atk"), def:ST(m, "def"), mag:ST(m, "mag"), spd:ST(m, "spd")};
        m.lv++;
        var got = learnUpTo(m, m.lv);
        m.hp += maxHP(m) - before.hp;
        m.mp += maxMP(m) - before.mp;
        Snd.se("levelup");
        refreshPanel();
        await bMsg(m.n + "は レベル " + m.lv + " に あがった!", true);
        await bMsg("HP +" + (maxHP(m) - before.hp) + "  MP +" + (maxMP(m) - before.mp) + "\n" +
                   "ちから +" + (ST(m, "atk") - before.atk) + "  みのまもり +" + (ST(m, "def") - before.def) + "\n" +
                   "かしこさ +" + (ST(m, "mag") - before.mag) + "  すばやさ +" + (ST(m, "spd") - before.spd), true);
        for(var k = 0; k < got.length; k++) await bMsg(m.n + "は " + SPELL[got[k]].n + "を おぼえた!", true);
      }
    }
  } else if(result === "flee"){
    await bMsg("うまく にげきれた!");
  }
  Game.party.forEach(function(m){
    m.buffAtk = 0; m.buffDef = 0; m.buffSpd = 0; m.guard = 0; m.charge = 0;
    m.cover = null; m.reckless = 0; m.hurt = 0; m.ox = 0; m.__act = 0;
  });
  await UI.fade(true);
  UI.clearAll();
  UI.msgWin = null;
  Game.battle = null;
  FX.clear();
  Game.shake = 0;
  Game.sinceBattle = 0;
  if(result === "lose"){
    Game.scene = "field";
    await gameOver();
    return;
  }
  Game.scene = "field";
  Snd.play(Game.map.bgm || "field");
  await UI.fade(false);
  Game.lock = false;
}
async function gameOver(){
  Snd.stop();
  Snd.jingle([["A3",.4],["G#3",.4],["G3",.4],["F#3",1.1]]);
  $("gameover").classList.add("on");
  await UI.fade(false);
  var i = await UI.list({
    items:[{l:"つづきから", off:!hasSave()},{l:"やりなおす"}],
    css:{bottom:"calc(50*var(--u))", minWidth:"calc(70*var(--u))"},
    cls:"mid", into:$("gameover"), noCancel:true
  });
  await UI.fade(true);
  $("gameover").classList.remove("on");
  if(i === 0 && hasSave() && loadData()){
    Game.gold = Math.floor(Game.gold / 2);
    Game.party.forEach(function(m){ m.hp = maxHP(m); m.mp = maxMP(m); m.status = null; });
  } else {
    /* 記録がなければ 城で復活・所持金半分 */
    Game.gold = Math.floor(Game.gold / 2);
    Game.party.forEach(function(m){ m.hp = maxHP(m); m.mp = maxMP(m); m.status = null; });
    loadMap("castle", 11, 15, "up");
  }
  Game.scene = "field";
  Game.lock = true;
  await UI.fade(false);
  await UI.say("……気がつくと 神殿の ベッドの 上だった。\n「よく もどってきた。ゴールドは\n はんぶん きえてしまったが……」");
  UI.closeMsg();
  Game.lock = false;
}

          return {l:it.n, s:it.price + "G", off:Game.gold < it.price};
        });
        var bi = await UI.list({cap:"しなもの", items:items,
          css:{left:"calc(5*var(--u))", bottom:"calc(66*var(--u))", minWidth:"calc(104*var(--u))", maxHeight:"calc(120*var(--u))", overflow:"auto"},
          onMove:function(k){ showInfo(n.shop[k]); }});
        info.style.display = "none";
        if(bi < 0) break;
        var key = n.shop[bi], it2 = ITEMS[key];
        if(Game.gold < it2.price){ await UI.say("おかねが たりないよ。", {who:n.n}); continue; }
        var yes = await UI.yesno(it2.n + "は " + it2.price + "ゴールド。\nおかいあげ かい?", {css:{right:"calc(5*var(--u))", bottom:"calc(66*var(--u))", minWidth:"calc(48*var(--u))"}});
        info.style.display = "none";
        if(!yes) continue;
        if(!addItem(key)){ await UI.say("もちものが いっぱいだよ!", {who:n.n}); continue; }
        Game.gold -= it2.price;
        Snd.se("buy");
        gw.remove(); gw = goldWin();
        var eqp = Game.party.filter(function(m){ return canEquip(m, key); });
        await UI.say("まいど ありがとう!", {who:n.n});
        if(eqp.length){
          var q = await UI.yesno("いま そうびしますか?", {css:{right:"calc(5*var(--u))", bottom:"calc(66*var(--u))", minWidth:"calc(48*var(--u))"}});
          if(q){
            var mi = await UI.list({cap:"だれが", items:eqp.map(function(m){ return {l:m.n}; }),
              css:{left:"calc(5*var(--u))", bottom:"calc(66*var(--u))", minWidth:"calc(96*var(--u))"}});
            if(mi >= 0) await doEquip(eqp[mi], key);
          }
        }
      }
    } else {
      while(true){
        var sell = Game.bag.filter(function(b){ return ITEMS[b.k].k !== "key"; });
        if(!sell.length){ await UI.say("うる ものが ないようだね。", {who:n.n}); break; }
        var si = await UI.list({cap:"なにを うる?",
          items:sell.map(function(b){ return {l:ITEMS[b.k].n + " ×" + b.n, s:Math.floor(ITEMS[b.k].price / 2) + "G"}; }),
          css:{left:"calc(5*var(--u))", bottom:"calc(66*var(--u))", minWidth:"calc(104*var(--u))", maxHeight:"calc(120*var(--u))", overflow:"auto"}});
        if(si < 0) break;
        var sk = sell[si].k, pr = Math.floor(ITEMS[sk].price / 2);
        var ok = await UI.yesno(ITEMS[sk].n + "を " + pr + "ゴールドで\nひきとろう。いいかい?", {css:{right:"calc(5*var(--u))", bottom:"calc(66*var(--u))", minWidth:"calc(48*var(--u))"}});
        if(!ok) continue;
        delItem(sk); Game.gold += pr;
        Snd.se("buy");
        gw.remove(); gw = goldWin();
        await UI.say("まいど!", {who:n.n});
      }
    }
  }
  info.remove();
  gw.remove();
  await UI.say("また きておくれ!", {who:n.n});
};

EVENTS.inn = async function(n){
  var cost = (n.cost || 10) * Game.party.length;
  var yes = await UI.yesno("やどやへ ようこそ。\nおひとり " + n.cost + "ゴールド、" + Game.party.length + "名さまで " + cost + "ゴールドです。\nおとまりに なりますか?",
    {css:{right:"calc(5*var(--u))", bottom:"calc(66*var(--u))", minWidth:"calc(48*var(--u))"}});
  if(!yes){ await UI.say("またの お越しを。", {who:n.n}); return; }
  if(Game.gold < cost){ await UI.say("おかねが たりないようです……。", {who:n.n}); return; }
  Game.gold -= cost;
  await UI.say("では ごゆっくり おやすみください。", {who:n.n});
  UI.closeMsg();

  await UI.fade(true);

  Game.party.forEach(function(m){ m.hp = maxHP(m); m.mp = maxMP(m); m.status = null; });

  await UI.fade(false);
  await UI.say("おはようございます。\nみなさま すっかり 元気に なりました!", {who:n.n});
};

EVENTS.church = async function(n){
  await UI.say("神の おめぐみが ありますように。\nどう なさいますか?", {who:n.n, nowait:true});
  while(true){
    var a = await UI.list({items:[{l:"きろくする"},{l:"どくを けす"},{l:"いきかえらせる"},{l:"やめる"}],
      css:{right:"calc(5*var(--u))", bottom:"calc(66*var(--u))", minWidth:"calc(62*var(--u))"}});
    if(a < 0 || a === 3) break;
    if(a === 0){
      if(saveData()){ Snd.se("levelup"); await UI.say("ぼうけんの しょに\nきろくを のこしました。", {who:n.n}); }
      else await UI.say("きろくに しっぱいしました……。", {who:n.n});
    } else if(a === 1){
      var poisoned = Game.party.filter(function(m){ return m.status === "poison"; });
      if(!poisoned.length){ await UI.say("どくに おかされた者は\nおられませんな。", {who:n.n}); continue; }
      poisoned.forEach(function(m){ m.status = null; });
      Snd.se("heal");
      await UI.say("どくは きえました。", {who:n.n});
    } else {
      var dead = Game.party.filter(function(m){ return !alive(m); });
      if(!dead.length){ await UI.say("みなさま ごぶじで なにより。", {who:n.n}); continue; }
      var di = await UI.list({cap:"だれを", items:dead.map(function(m){ return {l:m.n, s:(m.lv * 40) + "G", off:Game.gold < m.lv * 40}; }),
        css:{left:"calc(5*var(--u))", bottom:"calc(66*var(--u))", minWidth:"calc(96*var(--u))"}});
      if(di < 0) continue;
      var m2 = dead[di], fee = m2.lv * 40;
      if(Game.gold < fee){ await UI.say("おかねが たりませぬ。", {who:n.n}); continue; }
      Game.gold -= fee;
      m2.hp = maxHP(m2); m2.mp = maxMP(m2);
      Snd.se("levelup");
      UI.flash(400, "#fff");
      await UI.say(m2.n + "は いきかえりました!", {who:n.n});
    }
  }
  await UI.say("よき たびを。", {who:n.n});
};

  e.classList.add("on");

/* ================================================================
   17. タイトル画面の背景
   ================================================================ */
function drawTitleBg(){
  var g = cx, t = Game.t;
  var sky = g.createLinearGradient(0, 0, 0, SCR_H);
  sky.addColorStop(0, "#050818");
  sky.addColorStop(0.45, "#101d48");
  sky.addColorStop(1, "#2a3f74");
  g.fillStyle = sky; g.fillRect(0, 0, SCR_W, SCR_H);
  for(var i = 0; i < 70; i++){
    var sx = hash2(i, 11) * SCR_W, sy = hash2(i, 23) * 130;
    var tw = 0.5 + 0.5 * Math.sin(t * 2 + i);
    g.globalAlpha = 0.25 + tw * 0.75;
    P(g, sx, sy, 1, 1, "#ffffff");
    g.globalAlpha = 1;
  }
  E(g, 208, 34, 13, 13, "#f2ecd0");
  E(g, 203, 30, 4, 4, "#e2dcc0");
  E(g, 212, 38, 2.5, 2.5, "#e2dcc0");
  /* 遠景の山 */
  for(var m = 0; m < 7; m++){
    var bx = m * 42 - 12, bh = 44 + hash2(m, 3) * 34;
    TRI(g, [bx, 168, bx + 30, 168 - bh, bx + 62, 168], "#131c38");
    TRI(g, [bx + 30, 168 - bh, bx + 22, 168 - bh + 16, bx + 38, 168 - bh + 16], "#26325c");
  }
  /* 城のシルエット */
  P(g, 108, 132, 44, 36, "#0b1024");
  P(g, 100, 122, 12, 46, "#0b1024"); P(g, 148, 122, 12, 46, "#0b1024");
  TRI(g, [98, 122, 106, 104, 114, 122], "#0b1024");
  TRI(g, [146, 122, 154, 104, 162, 122], "#0b1024");
  TRI(g, [106, 132, 130, 108, 154, 132], "#0b1024");
  var blink = (Math.sin(t * 1.4) > -0.4);
  if(blink){ P(g, 118, 142, 4, 6, "#e8c65a"); P(g, 136, 142, 4, 6, "#e8c65a"); }
  /* 草原 */
  P(g, 0, 168, SCR_W, SCR_H - 168, "#16351f");
  P(g, 0, 168, SCR_W, 2, "#1e4a2a");
  for(var k = 0; k < 46; k++){
    var gx = hash2(k, 71) * SCR_W, gy = 172 + hash2(k, 91) * 46;
    P(g, gx, gy, 2, 1, "#1e4a2a");
  }
  /* たたずむ勇者 */
  var bob = Math.sin(t * 1.6) > 0 ? 0 : 1;
  drawActor(g, 24, 176, "hero", "down", bob, SPR.hero);
  drawActor(g, 42, 180, "gai", "down", 1 - bob, SPR.gai);
  drawActor(g, 8, 182, "mina", "down", bob, SPR.mina);
  drawActor(g, 56, 174, "lino", "down", 1 - bob, SPR.lino);
}

/* ================================================================
   18. 起動
   ================================================================ */
function newGame(){
  Game.party = CHARS.map(function(d){ return makeMember(d); });
  Game.gold = 0;
  Game.bag = [];
  addItem("herb", 3);
  Game.flags = {};
  Game.opened = {};
  Game.steps = 0;
  Game.lastTown = {map:"mira", x:11, y:16};
}
async function opening(){
  Game.lock = true;
  loadMap("castle", 11, 5, "up");
  await UI.fade(false);
  await UI.say("── アルシア城 玉座の間 ──", {speed:34});
  await EVENTS.king(Game.npcs[0]);
  await UI.say("アレン、ガイ、ミナ、リノ。\n四人の たびが いま はじまる!", {speed:22});
  UI.closeMsg();
  Game.lock = false;
}
async function boot(){
  buildCaves();
  Game.scene = "title";
  var hasS = hasSave();
  var i = await UI.list({
    items:[{l:"ぼうけんを はじめる"},{l:"つづきから", off:!hasS}],
    css:{top:"calc(150*var(--u))", minWidth:"calc(104*var(--u))"},
    cls:"mid", into:$("titleMenu"), index:hasS ? 1 : 0, noCancel:true
  });
  Snd.init(); Snd.resume();
  await UI.fade(true);
  $("title").classList.remove("on");
  Game.scene = "field";
  if(i === 1 && loadData()){
    await UI.fade(false);
    Game.lock = false;
    await msgIn("ぼうけんの しょから\nさいかいします。");
  } else {
    newGame();
    await opening();
  }
}

/* --- 画面サイズ --- */
function resize(){
  var vw = innerWidth, vh = innerHeight;
  var s = Math.min(vw / SCR_W, vh / SCR_H);
  if(s >= 2) s = Math.floor(s * 2) / 2;
  s = Math.min(s, 4.6);
  document.documentElement.style.setProperty("--u", s + "px");
}
addEventListener("resize", resize);
addEventListener("orientationchange", function(){ setTimeout(resize, 120); });
resize();
if(!matchMedia("(pointer: coarse)").matches) padVisible(false);

/* --- メインループ --- */
var last = 0;
function frame(ts){
  var dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;
  Game.t += dt;
  FX.update(dt);
  if(Game.shake > 0) Game.shake = Math.max(0, Game.shake - dt * 16);
  Game.party.forEach(function(m){ if(m.hurt > 0) m.hurt -= dt; });
  if(Game.battle) Game.battle.enemies.forEach(function(e){ if(e.hurt > 0) e.hurt -= dt; });
  if(Game.scene === "field"){
    updateField(dt);
    drawField();
  } else if(Game.scene === "battle" || Game.scene === "battleIn"){
    if(Game.battle) drawBattle();
  } else if(Game.scene === "title"){
    drawTitleBg();
  } else if(Game.scene === "ending"){
    cx.fillStyle = "#000"; cx.fillRect(0, 0, SCR_W, SCR_H);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
boot();
