<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>光のクロニクル — RPG</title>
<style>
/* ================================================================
   光のクロニクル / CHRONICLE OF LIGHT
   ドラクエ(コマンド式・青枠ウィンドウ)× FF(サイドビュー隊列)
   専用UI・単一HTML・外部依存ゼロ。
   ================================================================ */
:root{
  --u:3px;                       /* ゲーム1ドット = 何CSS px か(JSが更新) */
  --win-a:#0b1a48;
  --win-b:#04081f;
  --line:#ffffff;
  --line-in:#2b58c8;
  --ink:#ffffff;
  --dim:#93a6cc;
  --gold:#ffd75e;
  --hp:#5ee06a;
  --hp-mid:#ffd75e;
  --hp-low:#ff5a4a;
  --mp:#5ec8ff;
  --danger:#ff6a58;
  --font:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP","MS PGothic",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
body{
  font-family:var(--font);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
#app{
  position:fixed;inset:0;
  display:grid;place-items:center;
  background:radial-gradient(120% 90% at 50% 0%,#151a2c 0%,#000 70%);
}
/* スマホ縦持ちでは画面を上寄せして、下に操作パッドの帯をつくる */
@media (orientation:portrait) and (pointer:coarse){
  #app{align-items:start;padding-top:max(env(safe-area-inset-top),5vh)}
}
#stage{
  position:relative;
  width:calc(256 * var(--u));
  height:calc(224 * var(--u));
  background:#000;
  overflow:hidden;
  box-shadow:0 0 0 calc(1*var(--u)) #232a44, 0 calc(6*var(--u)) calc(18*var(--u)) rgba(0,0,0,.8);
}
#screen{
  position:absolute;inset:0;width:100%;height:100%;
  image-rendering:pixelated;image-rendering:crisp-edges;
  display:block;
}
/* 走査線(ほんのり) */
#stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:60;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.16) 0 1px,transparent 1px calc(2*var(--u)));
  opacity:.5;
}
#ui{position:absolute;inset:0;z-index:20;pointer-events:none}
#ui > *{pointer-events:auto}

/* ---------------- ウィンドウ(専用UI) ---------------- */
.win{
  position:absolute;
  background:linear-gradient(180deg,var(--win-a) 0%,var(--win-b) 100%);
  border:calc(1*var(--u)) solid var(--line);
  border-radius:calc(2.5*var(--u));
  box-shadow:
    inset 0 0 0 calc(1*var(--u)) var(--line-in),
    inset 0 calc(2*var(--u)) calc(6*var(--u)) rgba(90,140,255,.22),
    0 calc(2*var(--u)) 0 rgba(0,0,0,.65);
  padding:calc(4*var(--u)) calc(5*var(--u));
  font-size:calc(9*var(--u));
  line-height:1.65;
  letter-spacing:.04em;
  font-weight:700;
  text-shadow:0 calc(1*var(--u)) 0 rgba(0,0,0,.85);
  animation:winIn .12s steps(2) both;
}
@keyframes winIn{from{transform:scaleY(.55);opacity:.4}to{transform:none;opacity:1}}
.win.plain{animation:none}
/* 中央寄せ(transformはアニメで上書きされるため margin で寄せる) */
.win.mid{left:0;right:0;margin-left:auto;margin-right:auto;width:max-content}
.win .cap{
  position:absolute;top:calc(-4.5*var(--u));left:calc(5*var(--u));
  background:#04081f;border:calc(1*var(--u)) solid var(--line-in);
  border-radius:calc(1.5*var(--u));
  font-size:calc(6.5*var(--u));letter-spacing:.22em;color:var(--gold);
  padding:0 calc(2.5*var(--u));line-height:1.7;
}

/* メッセージ窓 */
#msgWin{
  left:calc(5*var(--u));right:calc(5*var(--u));bottom:calc(5*var(--u));
  min-height:calc(56*var(--u));
  display:none;
}
#msgWin.on{display:block}
#msgWin .txt{white-space:pre-wrap;word-break:normal;overflow-wrap:anywhere}
#msgWin .who{color:var(--gold);font-size:calc(8*var(--u));letter-spacing:.16em;display:block;margin-bottom:calc(1*var(--u))}
.more{
  position:absolute;right:calc(5*var(--u));bottom:calc(2*var(--u));
  color:var(--ink);font-size:calc(8*var(--u));
  animation:blink .6s steps(1) infinite;opacity:0;
}
.more.on{opacity:1}
@keyframes blink{50%{opacity:.15}}

/* リスト(コマンド)窓 */
.list{list-style:none;display:grid;gap:calc(.5*var(--u))}
.list.c2{grid-template-columns:1fr 1fr;column-gap:calc(6*var(--u))}
.list.c3{grid-template-columns:repeat(3,1fr);column-gap:calc(4*var(--u))}
.list li{
  position:relative;
  padding:calc(.5*var(--u)) 0 calc(.5*var(--u)) calc(9*var(--u));
  display:flex;justify-content:space-between;gap:calc(4*var(--u));
  white-space:nowrap;cursor:pointer;
}
.list li .sub{color:var(--gold);font-variant-numeric:tabular-nums}
.list li.off{color:#5d6e93}
.list li.off .sub{color:#5d6e93}
.list li.sel::before{
  content:"▶";position:absolute;left:calc(0.5*var(--u));top:calc(.5*var(--u));
  color:var(--ink);animation:cur .5s steps(1) infinite;
}
@keyframes cur{50%{opacity:.2}}
.list li.sel{color:#fff}

/* 汎用の小窓 */
.kv{display:flex;justify-content:space-between;gap:calc(4*var(--u));white-space:nowrap}
.kv b{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.small{font-size:calc(7.5*var(--u));color:var(--dim);letter-spacing:.1em}
.hr{height:calc(1*var(--u));background:var(--line-in);margin:calc(2*var(--u)) 0;opacity:.7}

/* パーティ状態(戦闘・FF風の横並び) */
#partyWin{left:calc(5*var(--u));right:calc(5*var(--u));bottom:calc(5*var(--u));display:none}
#partyWin.on{display:block}
#partyWin table{width:100%;border-collapse:collapse;font-size:calc(8.5*var(--u));table-layout:fixed}
#partyWin td{padding:calc(.5*var(--u)) 0;white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden}
#partyWin td.nm{width:16%;padding-left:calc(2*var(--u))}
#partyWin td.n{text-align:right;width:34%;padding-right:calc(4*var(--u))}
#partyWin .lbl{color:var(--dim);font-size:calc(7*var(--u));letter-spacing:.1em;padding-right:calc(1*var(--u))}
#partyWin tr.act td.nm{color:var(--gold)}
#partyWin tr.dead td{color:#7a5a5a}
#partyWin tr.dead td.nm::after{content:" しに";font-size:calc(7*var(--u));color:var(--danger)}
.bar{
  height:calc(3*var(--u));background:#101a36;border:calc(1*var(--u)) solid #2b3d6b;
  border-radius:calc(2*var(--u));overflow:hidden;margin-top:calc(1*var(--u));
}
.bar i{display:block;height:100%;background:var(--hp);transition:width .25s linear}
.bar.m i{background:var(--mp)}

/* ダメージ表示 */
.pop{
  position:absolute;z-index:40;pointer-events:none;
  font-size:calc(11*var(--u));font-weight:700;letter-spacing:.02em;
  text-shadow:0 0 calc(2*var(--u)) #000, calc(1*var(--u)) calc(1*var(--u)) 0 #000, calc(-1*var(--u)) calc(1*var(--u)) 0 #000;
  animation:pop .85s ease-out forwards;transform:translate(-50%,0);
}
.pop.dmg{color:#fff}
.pop.crit{color:#ffd75e}
.pop.heal{color:#8effa0}
.pop.miss{color:#c8d4ee;font-size:calc(9*var(--u))}
@keyframes pop{
  0%{transform:translate(-50%,0) scale(.6);opacity:0}
  18%{transform:translate(-50%,calc(-8*var(--u))) scale(1.15);opacity:1}
  35%{transform:translate(-50%,calc(-5*var(--u))) scale(1)}
  100%{transform:translate(-50%,calc(-20*var(--u))) scale(1);opacity:0}
}

/* 全画面オーバーレイ(タイトル・ゲームオーバー・エンディング) */
.ov{
  position:absolute;inset:0;z-index:50;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  text-align:center;background:#000;
}
.ov.on{display:flex}
#title{
  background:
    radial-gradient(90% 70% at 50% 22%,rgba(27,43,107,.42) 0%,rgba(7,11,30,.62) 52%,rgba(0,0,0,.88) 100%);
}
#title .logo{
  font-size:calc(21*var(--u));letter-spacing:.16em;line-height:1.35;
  color:#fff;
  text-shadow:
    0 0 calc(6*var(--u)) rgba(120,170,255,.75),
    0 calc(2*var(--u)) 0 #23409c,
    0 calc(3*var(--u)) calc(6*var(--u)) rgba(0,0,0,.9);
  animation:logoIn 1.4s cubic-bezier(.2,1,.25,1) both;
}
#title .logo b{display:block;font-size:calc(11*var(--u));color:var(--gold);letter-spacing:.42em;text-indent:.4em;margin-bottom:calc(3*var(--u));text-shadow:0 calc(1*var(--u)) 0 #000}
@keyframes logoIn{from{opacity:0;transform:translateY(calc(6*var(--u))) scale(.94);filter:blur(calc(1*var(--u)))}to{opacity:1;transform:none;filter:none}}
#title .sub{margin-top:calc(4*var(--u));font-size:calc(7.5*var(--u));letter-spacing:.34em;color:#93a6cc}
#title .menu{margin-top:calc(16*var(--u));width:calc(120*var(--u))}
#title .foot{
  position:absolute;bottom:calc(5*var(--u));left:calc(6*var(--u));right:calc(6*var(--u));
  font-size:calc(6*var(--u));letter-spacing:.16em;color:#54608a;line-height:1.9;
}
#title .foot i{font-style:normal;display:block}
#gameover .big{font-size:calc(16*var(--u));letter-spacing:.34em;color:#c8412f;text-shadow:0 0 calc(8*var(--u)) rgba(200,60,40,.6)}
#ending{background:#000;overflow:hidden;justify-content:flex-start}
#ending .roll{
  position:absolute;top:100%;width:100%;
  font-size:calc(9*var(--u));line-height:2.3;letter-spacing:.14em;color:#dbe4ff;
  animation:roll 38s linear forwards;
}
#ending .roll h2{font-size:calc(14*var(--u));color:var(--gold);letter-spacing:.28em;margin:calc(10*var(--u)) 0}
#ending .roll .g{color:#93a6cc;font-size:calc(7.5*var(--u));letter-spacing:.24em}
/* 文字の高さぶん + 画面1枚ぶん 流し切る */
@keyframes roll{
  from{transform:translateY(0)}
  to{transform:translateY(calc(-100% - 224 * var(--u)))}
}

/* 画面フラッシュ・暗転 */
#flash{position:absolute;inset:0;z-index:45;background:#fff;opacity:0;pointer-events:none}
#fade{position:absolute;inset:0;z-index:48;background:#000;opacity:0;pointer-events:none;transition:opacity .32s linear}
#fade.on{opacity:1}

/* ---------------- 操作パッド ----------------
   画面(ステージ)ではなくビューポートに固定する。
   スマホ縦持ちでは 画面の下に空く帯に、横持ちでは左右の余白に自然に収まる。 */
#pad{
  position:fixed;inset:0;z-index:80;pointer-events:none;
  --pad:clamp(104px,33vw,168px);
  --btn:clamp(50px,15vw,76px);
}
#pad.hide{display:none}
#dpad{
  position:absolute;left:max(10px,3vw);bottom:max(14px,3.5vh);
  width:var(--pad);height:var(--pad);pointer-events:auto;touch-action:none;
}
#dpad .k{
  position:absolute;background:rgba(18,26,54,.66);border:2px solid rgba(255,255,255,.5);
  border-radius:8px;display:grid;place-items:center;
  color:rgba(255,255,255,.8);font-size:calc(var(--pad)*.14);
}
#dpad .k.on{background:rgba(70,110,220,.9)}
#dpad .up{left:34%;top:0;width:32%;height:34%}
#dpad .dn{left:34%;bottom:0;width:32%;height:34%}
#dpad .lf{left:0;top:33%;width:34%;height:32%}
#dpad .rt{right:0;top:33%;width:34%;height:32%}
#btns{
  position:absolute;right:max(10px,3vw);bottom:max(18px,4vh);
  display:flex;gap:14px;align-items:center;pointer-events:auto;
}
#btns button{
  width:var(--btn);height:var(--btn);border-radius:50%;
  background:rgba(18,26,54,.66);border:2px solid rgba(255,255,255,.5);
  color:rgba(255,255,255,.88);font-size:calc(var(--btn)*.34);font-weight:700;font-family:var(--font);
}
#btns button:active,#btns button.on{background:rgba(70,110,220,.92)}
#btns .b{opacity:.85;width:calc(var(--btn)*.82);height:calc(var(--btn)*.82)}
#sysbtn{
  position:absolute;right:calc(5*var(--u));top:calc(4*var(--u));z-index:70;
  background:rgba(10,16,38,.66);border:calc(1*var(--u)) solid rgba(255,255,255,.35);
  border-radius:calc(2*var(--u));color:rgba(255,255,255,.82);
  font-family:var(--font);font-size:calc(7*var(--u));letter-spacing:.14em;
  padding:calc(1.5*var(--u)) calc(4*var(--u));
}
#sysbtn.hide{display:none}
.hint{
  position:absolute;left:0;right:0;bottom:calc(-13*var(--u));
  text-align:center;font-size:calc(6.5*var(--u));letter-spacing:.2em;color:#54608a;
}
@media (max-height:520px){.hint{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="screen" width="256" height="224"></canvas>
    <div id="ui"></div>
    <div id="flash"></div>
    <div id="fade"></div>

    <div id="title" class="ov on">
      <div class="logo"><b>CHRONICLE OF LIGHT</b>光のクロニクル</div>
      <div class="sub">ひかりの　いしを　もとめて</div>
      <div class="menu" id="titleMenu"></div>
      <div class="foot">
        <i>いどう: ←↑↓→ / WASD　　けってい: Z・Enter　　メニュー: X・Esc</i>
        <i>スマホは 画面下の じゅうじキーと A / B ボタンで あそべます</i>
      </div>
    </div>

    <div id="gameover" class="ov">
      <div class="big">おしまい</div>
    </div>

    <div id="ending" class="ov"></div>

    <button id="sysbtn">メニュー</button>
  </div>

  <div id="pad">
      <div id="dpad">
        <div class="k up" data-d="up">▲</div>
        <div class="k lf" data-d="left">◀</div>
        <div class="k rt" data-d="right">▶</div>
        <div class="k dn" data-d="down">▼</div>
      </div>
      <div id="btns">
        <button class="b" data-k="cancel">B</button>
        <button class="a" data-k="confirm">A</button>
      </div>
  </div>
</div>
<script>
"use strict";
/* ================================================================
   1. データ定義
   ================================================================ */
var SCR_W = 256, SCR_H = 224, TS = 16;
var SAVE_KEY = "chronicle_of_light_save_v1";

/* ---------- 地形 ---------- */
/* s:通行不可 / t:種別(描画用) */
var TILE = {
  ".": {t:"grass"},        ",": {t:"road"},        "f": {t:"flower"},
  "T": {t:"tree",  s:1},   "M": {t:"mtn",   s:1},  "~": {t:"water", s:1},
  "B": {t:"bridge"},       "S": {t:"sand"},        "_": {t:"floor"},
  "w": {t:"wall",  s:1},   "d": {t:"door"},        "D": {t:"door",  s:1},
  "k": {t:"carpet"},       "t": {t:"throne",s:1},  "p": {t:"pillar",s:1},
  "b": {t:"shelf", s:1},   "j": {t:"jar",   s:1},  "c": {t:"counter",s:1},
  "A": {t:"altar", s:1},   "i": {t:"sign",  s:1},  "h": {t:"house", s:1},
  "r": {t:"roof",  s:1},   "o": {t:"cavef"},       "O": {t:"cavew", s:1},
  "*": {t:"dark"},         "x": {t:"darkw", s:1},  "u": {t:"up"},
  "n": {t:"down"},         "1": {t:"castle"},      "2": {t:"village"},
  "3": {t:"town"},         "4": {t:"cave"},        "5": {t:"dcastle"}
};

/* ---------- 道具・武具 ---------- */
var ITEMS = {
  herb:   {n:"やくそう",       k:"use", price:8,   heal:34,  tgt:"ally", d:"HPを34ほど かいふくする"},
  herb2:  {n:"上やくそう",     k:"use", price:45,  heal:95,  tgt:"ally", d:"HPを95ほど かいふくする"},
  elixir: {n:"まほうの聖水",   k:"use", price:70,  mp:22,    tgt:"ally", d:"MPを22ほど かいふくする"},
  anti:   {n:"どくけしそう",   k:"use", price:14,  cure:"poison", tgt:"ally", d:"どくを なおす"},
  bell:   {n:"めざましの鈴",   k:"use", price:20,  cure:"sleep",  tgt:"ally", d:"ねむりを さます"},
  wing:   {n:"キメラのつばさ", k:"use", price:28,  field:"wing",  d:"さいごに たちよった 町へ もどる"},
  full:   {n:"せかいじゅの葉", k:"use", price:0,   revive:1, tgt:"dead", d:"しんだ なかまを いきかえらせる"},

  stick:  {n:"ひのきのぼう",   k:"weapon", atk:5,  price:10,   eq:"hero,gai,mina,lino"},
  copper: {n:"どうのつるぎ",   k:"weapon", atk:14, price:180,  eq:"hero,gai"},
  iron:   {n:"てつのつるぎ",   k:"weapon", atk:26, price:620,  eq:"hero,gai"},
  steel:  {n:"はがねのつるぎ", k:"weapon", atk:40, price:2000, eq:"hero,gai"},
  flame:  {n:"ほのおのつるぎ", k:"weapon", atk:54, price:0,    eq:"hero,gai", d:"ほのおを まとった つるぎ"},
  light:  {n:"ひかりのつるぎ", k:"weapon", atk:72, price:0,    eq:"hero",     d:"やみを はらう せいなる つるぎ"},
  club:   {n:"こんぼう",       k:"weapon", atk:10, price:60,   eq:"gai,mina"},
  axe:    {n:"せんしのオノ",   k:"weapon", atk:34, price:1100, eq:"gai"},
  oak:    {n:"かしのつえ",     k:"weapon", atk:7,  price:70,   eq:"mina,lino", mag:3},
  mstaff: {n:"まどうしのつえ", k:"weapon", atk:13, price:560,  eq:"mina,lino", mag:12},
  sage:   {n:"けんじゃのつえ", k:"weapon", atk:20, price:1800, eq:"mina,lino", mag:26},

  cloth:  {n:"たびびとのふく", k:"armor", def:6,  price:24,   eq:"hero,gai,mina,lino"},
  leather:{n:"かわのよろい",   k:"armor", def:14, price:190,  eq:"hero,gai,mina"},
  chain:  {n:"くさりかたびら", k:"armor", def:24, price:640,  eq:"hero,gai"},
  ironA:  {n:"てつのよろい",   k:"armor", def:38, price:2200, eq:"hero,gai"},
  robe:   {n:"まほうのローブ", k:"armor", def:20, price:520,  eq:"mina,lino", mag:8},
  holy:   {n:"せいなるよろい", k:"armor", def:52, price:0,    eq:"hero", d:"ひかりに まもられた よろい"},

  ring:   {n:"ちからのゆびわ", k:"acc", atk:8,  price:800,  eq:"hero,gai,mina,lino"},
  pray:   {n:"いのりのゆびわ", k:"acc", mag:10, price:900,  eq:"hero,mina,lino"},
  pend:   {n:"まもりのペンダント", k:"acc", def:12, price:1000, eq:"hero,gai,mina,lino"},
  boots:  {n:"はやてのくつ",   k:"acc", spd:12, price:1200, eq:"hero,gai,mina,lino"},
  orb:    {n:"かぜのオーブ",   k:"key", price:0, d:"かぜの ちからを ひめた たま"}
};

/* ---------- 呪文・特技 ----------
   k: atk 攻撃 / heal 回復 / rev 蘇生 / cure 状態回復 / buff 味方強化 /
      pguard 全体軽減 / weak 敵弱体 / sleep 眠り / death 即死 /
      drain HP吸収 / mdrain MP吸収 / multi 連続攻撃 / break 守備崩し /
      phys 全体物理 / charge ためる / stun ひるませる / cover かばう / warp 移動系
   ------------------------------------------------------------------ */
var SPELL = {
  /* --- 攻撃じゅもん --- */
  mera:    {n:"メラ",         mp:4,  k:"atk", el:"fire",   tgt:"one",  pow:16, r:0.55},
  merami:  {n:"メラミ",       mp:10, k:"atk", el:"fire",   tgt:"one",  pow:40, r:0.95},
  merazoma:{n:"メラゾーマ",   mp:20, k:"atk", el:"fire",   tgt:"one",  pow:92, r:1.35},
  gira:    {n:"ギラ",         mp:7,  k:"atk", el:"fire",   tgt:"allE", pow:12, r:0.40},
  begirama:{n:"ベギラマ",     mp:14, k:"atk", el:"fire",   tgt:"allE", pow:30, r:0.65},

/* 必要経験値(レベルn → 次のレベルまでの累計) */
function expFor(lv){
  if(lv <= 1) return 0;
  return Math.floor(9 * Math.pow(lv - 1, 2.4) + 8 * (lv - 1));
}

function mulberry(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);

  };
}

var Snd = {
  ac:null, master:null, on:true, cur:null, timer:null, step:0, nextT:0, track:null,

  },
  resume:function(){

  },
  freq:function(name){
    if(!name || name === "r") return 0;
    var m = /^([A-G])(#?)(-?\d)$/.exec(name);
    if(!m) return 0;
    var base = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]] + (m[2] ? 1 : 0);

      g.gain.setValueAtTime(0, st);
      g.gain.linearRampToValueAtTime(vol == null ? 0.5 : vol, st + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0008, st + d);

      case "spell":  tone(220, 1400, 0.3, "sawtooth", 0.22); break;
      case "fire":   noise(0.4, 0.4, 0, 250); tone(120, 700, 0.35, "sawtooth", 0.22); break;

      case "door":   tone(300, 160, 0.14, "square", 0.24); break;

  play:function(name){

    this.track = BGM[name];
    if(!this.track) return;
    this.step = 0;
    this.nextT = this.ac.currentTime + 0.08;
    var self = this;
    this.timer = setInterval(function(){ self.tick(); }, 25);
  },
  stop:function(keepName){
    if(this.timer){ clearInterval(this.timer); this.timer = null; }

    if(!keepName) this.cur = null;
  },
  tick:function(){
    if(!this.track || !this.ac) return;
    var spb = 60 / this.track.bpm / 4;                 /* 1ステップ=16分 */
    while(this.nextT < this.ac.currentTime + 0.2){
      this.voice(this.track.lead, this.step, spb, "square", 0.16, 0);
      if(this.track.bass) this.voice(this.track.bass, this.step, spb, "triangle", 0.24, -0);
      if(this.track.drum) this.drum(this.track.drum, this.step, spb);
      this.step++;
      this.nextT += spb;
    }
  },
  voice:function(seq, step, spb, type, vol, det){
    var i = step % seq.length, tok = seq[i];
    if(!tok || tok === "-" || tok === "r") return;
    var len = 1;
    while(seq[(i + len) % seq.length] === "-" && len < 16) len++;
    var f = this.freq(tok); if(!f) return;
    var ac = this.ac, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    var t = this.nextT, d = spb * len * 0.92;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.setValueAtTime(vol, t + d * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0008, t + d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + 0.02);
  },
  drum:function(seq, step, spb){
    var c = seq[step % seq.length];
    if(!c || c === ".") return;
    var ac = this.ac, t = this.nextT;
    var len = Math.floor(ac.sampleRate * 0.09), buf = ac.createBuffer(1, len, ac.sampleRate), ch = buf.getChannelData(0);
    for(var i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var s = ac.createBufferSource(); s.buffer = buf;
    var f = ac.createBiquadFilter(); f.type = c === "k" ? "lowpass" : "highpass";
    f.frequency.value = c === "k" ? 220 : 3000;
    var g = ac.createGain(); g.gain.value = c === "k" ? 0.5 : 0.14;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  /* 勝利ファンファーレなど、一度きりの曲 */
  jingle:function(list){
    if(!this.on) return; this.init(); if(!this.ac) return;
    var t = this.ac.currentTime + 0.02, self = this;
    list.forEach(function(nd){
      var f = self.freq(nd[0]); if(!f){ t += nd[1]; return; }
      var o = self.ac.createOscillator(), g = self.ac.createGain();
      o.type = "square"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.26, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + nd[1] * 0.95);
      o.connect(g); g.connect(self.master); o.start(t); o.stop(t + nd[1]);
      t += nd[1];
    });
  }
};

var Input = {
  held:{}, queue:[], waiters:[],
  dirOf:function(){
    if(this.held.up) return "up";

    if(this.held.right) return "right";

  },

    this.queue.push(k);

  },

  clear:function(){ this.queue.length = 0; },
  wait:function(keys){
    var self = this;
    return new Promise(function(res){
      function on(k){
        if(!keys || keys.indexOf(k) >= 0) res(k);
        else self.waiters.push(on);
      }
      self.waiters.push(on);
    });
  }
};
(function(){
  var MAP = {
    ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right",
    KeyW:"up", KeyS:"down", KeyA:"left", KeyD:"right",
    Enter:"confirm", Space:"confirm", KeyZ:"confirm", NumpadEnter:"confirm",
    Escape:"cancel", KeyX:"cancel", Backspace:"cancel", ShiftLeft:"cancel"
  };
  addEventListener("keydown", function(e){
    var k = MAP[e.code];
    if(!k) return;
    e.preventDefault();
    Snd.resume();
    if(!e.repeat) Input.press(k);
    Input.held[k] = 1;
    padVisible(false);
  }, {passive:false});
  addEventListener("keyup", function(e){
    var k = MAP[e.code]; if(!k) return;
    Input.held[k] = 0;
  });
  /* タッチ / クリック操作 */
  function bindHold(node, key){
    function on(e){ e.preventDefault(); Snd.resume(); Input.held[key] = 1; Input.press(key); node.classList.add("on"); }
    function off(e){ e.preventDefault(); Input.held[key] = 0; node.classList.remove("on"); }
    node.addEventListener("pointerdown", on);
    node.addEventListener("pointerup", off);
    node.addEventListener("pointercancel", off);
    node.addEventListener("pointerleave", off);
  }
  var dpad = $("dpad");
  [].forEach.call(dpad.querySelectorAll(".k"), function(n){ bindHold(n, n.dataset.d); });
  /* Dパッドの上を指で滑らせても方向が切り替わるように */
  dpad.addEventListener("pointermove", function(e){
    if(e.buttons === 0 && e.pointerType === "mouse") return;
    var r = dpad.getBoundingClientRect();
    var cx = (e.clientX - r.left) / r.width - 0.5, cy = (e.clientY - r.top) / r.height - 0.5;
    var d = Math.abs(cx) > Math.abs(cy) ? (cx > 0 ? "right" : "left") : (cy > 0 ? "down" : "up");
    ["up","down","left","right"].forEach(function(k){ Input.held[k] = 0; });
    Input.held[d] = 1;
    [].forEach.call(dpad.querySelectorAll(".k"), function(n){ n.classList.toggle("on", n.dataset.d === d); });
  });
  [].forEach.call($("btns").querySelectorAll("button"), function(b){
    b.addEventListener("pointerdown", function(e){ e.preventDefault(); Snd.resume(); Input.press(b.dataset.k); b.classList.add("on"); });
    b.addEventListener("pointerup", function(){ b.classList.remove("on"); });
    b.addEventListener("pointerleave", function(){ b.classList.remove("on"); });
  });
  $("sysbtn").addEventListener("pointerdown", function(e){ e.preventDefault(); Snd.resume(); Input.press("cancel"); });
  addEventListener("pointerdown", function(){ Snd.resume(); }, {once:false});
})();

    var head = opt.who ? '<span class="who">' + esc(opt.who) + '</span>' : "";
    t.innerHTML = head;
    var body = document.createTextNode("");
    t.appendChild(body);
    var s = String(text), i = 0;
    Input.clear();
    var skipped = false;
    while(i < s.length){
      if(!skipped && Input.queue.length){ Input.clear(); skipped = true; }
      if(skipped){ body.nodeValue = s; break; }
      body.nodeValue = s.slice(0, ++i);
      if(s[i - 1] !== "\n") await sleep(opt.speed || 18);
    }
    if(opt.nowait) return;
    more.classList.add("on");
    await Input.wait(["confirm","cancel"]);
    Snd.se("cursor");
    more.classList.remove("on");
  },
  /* 複数ページ */
  sayAll:async function(lines, opt){
    lines = [].concat(lines);
    for(var i = 0; i < lines.length; i++) await this.say(lines[i], opt);
  },
  flash:function(ms, color){
    var f = $("flash");
    f.style.background = color || "#fff";
    f.style.transition = "none"; f.style.opacity = "0.85";
    setTimeout(function(){ f.style.transition = "opacity " + (ms || 220) + "ms linear"; f.style.opacity = "0"; }, 16);
  },
  fade:function(on){
    $("fade").classList.toggle("on", !!on);
    return sleep(340);
  },
  pop:function(x, y, text, cls){
    var p = el("div", "pop " + (cls || "dmg"), esc(text));
    p.style.left = (x / SCR_W * 100) + "%";
    p.style.top = (y / SCR_H * 100) + "%";
    this.layer.appendChild(p);
    setTimeout(function(){ p.remove(); }, 900);
  },
  /* --- 選択リスト --- 戻り値: 選択index / -1(キャンセル) --- */
  list:function(opt){
    var self = this;
    var items = opt.items;
    var w = el("div", "win " + (opt.cls || ""));
    if(opt.cap) w.appendChild(el("div", "cap", esc(opt.cap)));
    if(opt.head) w.appendChild(el("div", "small", opt.head));
    var ul = el("ul", "list" + (opt.cols === 2 ? " c2" : opt.cols === 3 ? " c3" : ""));
    items.forEach(function(it, i){
      var li = el("li");
      li.innerHTML = '<span>' + esc(it.l) + '</span>' + (it.s != null ? '<span class="sub">' + esc(it.s) + '</span>' : "");
      if(it.off) li.classList.add("off");
      li.dataset.i = i;
      ul.appendChild(li);
    });
    w.appendChild(ul);
    if(opt.foot) w.appendChild(el("div", "small", opt.foot));
    var css = opt.css || {};
    for(var k in css) w.style[k] = css[k];
    /* 長い一覧は ウィンドウごとではなく 中身だけをスクロールさせる。
       ウィンドウを overflow:auto にすると 見出し(.cap)が切れてしまうため。 */
    if(css.maxHeight){
      w.style.maxHeight = "";
      w.style.overflow = "";
      ul.style.maxHeight = css.maxHeight;
      ul.style.overflowY = "auto";
    }
    (opt.into || this.layer).appendChild(w);

    var idx = opt.index || 0;
    /* 初期カーソルが選べない項目なら、選べる最初の項目へ寄せる */
    if(items[idx] && (items[idx].off || items[idx].skip)){
      for(var q = 0; q < items.length; q++){
        var n2 = (idx + q) % items.length;
        if(!items[n2].off && !items[n2].skip){ idx = n2; break; }
      }
    }
    var lis = [].slice.call(ul.children);
    function draw(){
      lis.forEach(function(li, i){ li.classList.toggle("sel", i === idx); });
      if(lis[idx] && lis[idx].scrollIntoView){
        try{ lis[idx].scrollIntoView({block:"nearest"}); }catch(e){}
      }
      if(opt.onMove) opt.onMove(idx);
    }
    draw();
    return new Promise(function(res){
      function done(v){
        cleanup();
        w.remove();
        res(v);
      }
      function move(d){
        var n = items.length, cols = opt.cols || 1, step = (d === "up" || d === "down") ? cols : 1;
        var dir = (d === "up" || d === "left") ? -1 : 1;
        var next = idx;
        for(var g = 0; g < n; g++){
          next = (next + dir * step + n * 2) % n;
          if(!items[next].skip) break;
        }
        if(next !== idx){ idx = next; Snd.se("cursor"); draw(); }
      }
      function onKey(k){
        if(k === "up" || k === "down" || k === "left" || k === "right"){ move(k); return; }
        if(k === "confirm"){
          if(items[idx].off){ Snd.se("err"); return; }
          Snd.se("ok"); done(idx);
        } else if(k === "cancel"){
          if(opt.noCancel){ Snd.se("err"); return; }
          Snd.se("cancel"); done(-1);
        }
      }
      var pumping = true;
      function pump(){
        if(!pumping) return;
        var k;
        while((k = Input.take())) onKey(k);
        requestAnimationFrame(pump);
      }
      pump();
      function onClick(e){
        var li = e.target.closest ? e.target.closest("li") : null;
        if(!li || !ul.contains(li)) return;
        var i = +li.dataset.i;
        if(items[i].skip) return;
        if(i !== idx){ idx = i; draw(); Snd.se("cursor"); return; }
        if(items[i].off){ Snd.se("err"); return; }
        Snd.se("ok"); done(i);
      }
      ul.addEventListener("click", onClick);
      function cleanup(){ pumping = false; ul.removeEventListener("click", onClick); }
      w.__close = function(){ done(-1); };
    });
  },
  yesno:async function(text, opt){
    opt = opt || {};
    if(text) await this.say(text, {nowait:true});
    var i = await this.list({
      items:[{l:"はい"},{l:"いいえ"}],
      css:opt.css || {right:"calc(6*var(--u))", bottom:"calc(66*var(--u))", minWidth:"calc(48*var(--u))"},
      index:opt.def || 0
    });
    return i === 0;
  }
};

var cv = $("screen"), cx = cv.getContext("2d");
cx.imageSmoothingEnabled = false;

function P(g, x, y, w, h, c){ g.fillStyle = c; g.fillRect(x | 0, y | 0, w | 0, h | 0); }
function E(g, x, y, rx, ry, c){ g.fillStyle = c; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 6.2832); g.fill(); }
function TRI(g, pts, c){
  g.fillStyle = c; g.beginPath(); g.moveTo(pts[0], pts[1]);
  for(var i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
  g.closePath(); g.fill();
}

/* ---------- 地形タイル ---------- */
function tileChar(x, y){
  if(typeof Game === "undefined" || !Game.tiles) return "";
  if(x < 0 || y < 0 || y >= Game.tiles.length || x >= Game.tiles[y].length) return "";
  return Game.tiles[y][x];
}
function drawTile(g, ch, X, Y, tx, ty){
  var t = TILE[ch] ? TILE[ch].t : "grass";
  var r = hash2(tx, ty), r2 = hash2(tx + 99, ty - 7);
  switch(t){
    case "grass":
      P(g, X, Y, 16, 16, "#3c8a3f");
      P(g, X + (r * 12 | 0), Y + (r2 * 12 | 0), 3, 2, "#317233");
      P(g, X + (r2 * 13 | 0), Y + (r * 13 | 0), 2, 2, "#4da04a");
      break;
    case "flower":
      P(g, X, Y, 16, 16, "#3c8a3f");

      break;
    case "road":
      P(g, X, Y, 16, 16, "#c0a06c");
      P(g, X + (r * 12 | 0), Y + (r2 * 12 | 0), 2, 2, "#a5854f");

      break;
    case "tree":
      P(g, X, Y, 16, 16, "#3c8a3f");
      P(g, X + 7, Y + 10, 3, 5, "#6b4a2a");
      E(g, X + 8, Y + 7, 7, 6.5, "#245a28");
      E(g, X + 8, Y + 6, 5.5, 5, "#2f7a33");
      E(g, X + 6, Y + 4, 2.5, 2, "#45984a");
      break;
    case "mtn":
      P(g, X, Y, 16, 16, "#3c8a3f");
      TRI(g, [X, Y + 16, X + 8, Y + 1, X + 16, Y + 16], "#6d6250");
      TRI(g, [X + 8, Y + 1, X + 16, Y + 16, X + 11, Y + 16], "#514936");
      TRI(g, [X + 8, Y + 1, X + 4.5, Y + 8, X + 11.5, Y + 8], "#cfd4dd");

      P(g, X + 2 + (ph > 0 ? 2 : 0), Y + 6, 5, 1, "#5b8dee");

      break;
    case "bridge":
      P(g, X, Y, 16, 16, "#2450c4");
      P(g, X, Y + 2, 16, 12, "#9a6a3c");
      for(var i = 0; i < 4; i++) P(g, X + i * 4, Y + 2, 1, 12, "#6f4826");
      P(g, X, Y + 2, 16, 1, "#c08c52"); P(g, X, Y + 13, 16, 1, "#6f4826");
      break;
    case "floor":
      P(g, X, Y, 16, 16, "#5b6178");
      P(g, X, Y, 16, 1, "#6d748d"); P(g, X, Y + 15, 16, 1, "#474d61");
      P(g, X + 15, Y, 1, 16, "#474d61");
      if(r > 0.8) P(g, X + 4, Y + 6, 4, 2, "#535a70");
      break;
    case "wall":
      P(g, X, Y, 16, 16, "#39405a");
      P(g, X, Y, 16, 2, "#4c5478");
      for(var by = 0; by < 16; by += 8){
        var off = (by / 8 + ty) % 2 ? 4 : 0;

      break;
    case "door":
      P(g, X, Y, 16, 16, "#39405a");

      if(tileChar(tx + 1, ty) !== "k"){ P(g, X + 14, Y, 2, 16, "#8a2230"); P(g, X + 13, Y, 1, 16, "#e8c65a"); }

    case "throne":

    case "shelf":
      P(g, X, Y, 16, 16, "#5b6178");

    case "jar":
      P(g, X, Y, 16, 16, "#5b6178");

    case "counter":

      P(g, X, Y, 16, 1, "#c99a68");
      P(g, X, Y + 8, 16, 1, "#5d3c22");

    case "house":
      P(g, X, Y, 16, 16, "#cbb89a");
      P(g, X, Y, 16, 1, "#e0d0b4"); P(g, X, Y + 15, 16, 1, "#a8977c");
      if((tx + ty) % 3 === 0){
        P(g, X + 4, Y + 4, 8, 7, "#3f5f8f");

      for(var ry2 = 0; ry2 < 16; ry2 += 5){
        P(g, X, Y + ry2, 16, 1, "#7e2c1f");
        for(var rx2 = ((ry2 / 5) % 2 ? 2 : 6); rx2 < 16; rx2 += 8) P(g, X + rx2, Y + ry2 + 1, 1, 4, "#8f3526");
      }
      P(g, X, Y, 16, 1, "#c95a44");

    case "cavef":

      P(g, X + (r * 12 | 0), Y + (r2 * 12 | 0), 2, 2, "#3c352c");
      P(g, X + (r2 * 12 | 0), Y + (r * 12 | 0), 2, 1, "#5a5245");

      P(g, X, Y, 16, 16, "#231d17");

function drawActor(g, X, Y, key, dir, frame, pal){

var FX = {
  list:[],
  add:function(o){ o.t = 0; this.list.push(o); return o; },
  burst:function(x, y, color, n, spd, life){
    for(var i = 0; i < (n || 12); i++){
      var a = Math.random() * 6.2832, v = rndf(0.4, 1) * (spd || 60);
      this.add({k:"p", x:x, y:y, vx:Math.cos(a) * v, vy:Math.sin(a) * v - 20, c:color, life:life || 0.55, sz:rndInt(1, 3)});
    }
  },
  rise:function(x, y, color, n){
    for(var i = 0; i < (n || 10); i++){
      this.add({k:"p", x:x + rndf(-14, 14), y:y + rndf(-4, 10), vx:rndf(-6, 6), vy:rndf(-70, -30), c:color, life:rndf(0.5, 0.9), sz:rndInt(1, 3), g:0});
    }
  },
  bolt:function(x, y){ this.add({k:"bolt", x:x, y:y, life:0.42}); },
  slash:function(x, y){ this.add({k:"slash", x:x, y:y, life:0.28}); },
  ring:function(x, y, color){ this.add({k:"ring", x:x, y:y, c:color, life:0.4}); },
  update:function(dt){
    for(var i = this.list.length - 1; i >= 0; i--){
      var p = this.list[i];
      p.t += dt;
      if(p.k === "p"){
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vy += (p.g == null ? 140 : p.g) * dt;
      }
      if(p.t >= p.life) this.list.splice(i, 1);
    }
  },
  draw:function(g){
    this.list.forEach(function(p){
      var k = 1 - p.t / p.life;
      if(p.k === "p"){
        g.globalAlpha = Math.max(0, k);
        P(g, p.x, p.y, p.sz, p.sz, p.c);
        g.globalAlpha = 1;
      } else if(p.k === "bolt"){
        g.globalAlpha = Math.max(0, k);
        var w = 4 + Math.sin(p.t * 60) * 2;
        P(g, p.x - w / 2, 0, w, p.y, "#ffffff");
        P(g, p.x - w / 4, 0, w / 2, p.y, "#a8d8ff");
        g.globalAlpha = 1;
      } else if(p.k === "slash"){
        g.globalAlpha = Math.max(0, k);
        g.strokeStyle = "#ffffff"; g.lineWidth = 2;
        g.beginPath(); g.moveTo(p.x - 18, p.y - 16); g.lineTo(p.x + 16, p.y + 14); g.stroke();
        g.beginPath(); g.moveTo(p.x - 12, p.y - 22); g.lineTo(p.x + 20, p.y + 6); g.stroke();
        g.globalAlpha = 1;
      } else if(p.k === "ring"){
        g.globalAlpha = Math.max(0, k);
        g.strokeStyle = p.c; g.lineWidth = 2;
        g.beginPath(); g.arc(p.x, p.y, 4 + (1 - k) * 30, 0, 6.2832); g.stroke();
        g.globalAlpha = 1;
      }
    });
  },
  clear:function(){ this.list.length = 0; }
};

/* ---------- 仲間 ---------- */
function charDef(id){ for(var i = 0; i < CHARS.length; i++) if(CHARS[i].id === id) return CHARS[i]; return CHARS[0]; }
function baseStat(m, k){
  var d = charDef(m.id);
  return Math.floor(d.base[k] + d.grow[k] * (m.lv - 1));
}
function eqBonus(m, k){
  var s = 0;
  ["weapon","armor","acc"].forEach(function(slot){
    var it = ITEMS[m.eq[slot]];
    if(it && it[k]) s += it[k];
  });
  return s;
}
function ST(m, k){
  var v = baseStat(m, k) + eqBonus(m, k);
  if(k === "atk" && m.buffAtk) v = Math.floor(v * 1.55);
  if(k === "def" && m.buffDef) v = Math.floor(v * 1.5);
  if(k === "def" && m.guard) v = Math.floor(v * 2.2);
  return v;
}
function maxHP(m){ return baseStat(m, "hp"); }
function maxMP(m){ return baseStat(m, "mp"); }
function alive(m){ return m.hp > 0; }
function livingParty(){ return Game.party.filter(alive); }
function makeMember(def){
  var m = {id:def.id, n:def.n, cls:def.cls, lv:1, exp:0, hp:0, mp:0,
           eq:{weapon:def.eqStart.weapon || "", armor:def.eqStart.armor || "", acc:""},
           spells:[], status:null, buffAtk:0, buffDef:0, guard:0};
  m.hp = maxHP(m); m.mp = maxMP(m);
  learnUpTo(m, 1);
  return m;
}
function learnUpTo(m, lv){
  var got = [], d = charDef(m.id);
  d.learn.forEach(function(e){
    if(e[0] <= lv && m.spells.indexOf(e[1]) < 0){ m.spells.push(e[1]); got.push(e[1]); }
  });
  return got;
}

/* ---------- 持ち物 ---------- */
function bagCount(k){
  for(var i = 0; i < Game.bag.length; i++) if(Game.bag[i].k === k) return Game.bag[i].n;
  return 0;
}
function addItem(k, n){
  n = n || 1;
  for(var i = 0; i < Game.bag.length; i++) if(Game.bag[i].k === k){ Game.bag[i].n += n; return true; }
  if(Game.bag.length >= 24) return false;
  Game.bag.push({k:k, n:n});
  return true;
}
function delItem(k, n){
  n = n || 1;
  for(var i = 0; i < Game.bag.length; i++) if(Game.bag[i].k === k){
    Game.bag[i].n -= n;
    if(Game.bag[i].n <= 0) Game.bag.splice(i, 1);
    return true;
  }
  return false;
}
function canEquip(m, key){

}

/* ================================================================
   9. マップ読み込み・洞窟生成
   ================================================================ */
function genCave(def){
  var w = def.w, h = def.h, g = def.gen, rnd = mulberry(g.seed);
  var grid = [];
  for(var y = 0; y < h; y++){ grid[y] = []; for(var x = 0; x < w; x++) grid[y][x] = g.wall; }
  var cxp = w >> 1, cyp = h - 3;
  for(var wk = 0; wk < g.walks; wk++){
    var px = wk === 0 ? cxp : 2 + Math.floor(rnd() * (w - 4));
    var py = wk === 0 ? cyp : 2 + Math.floor(rnd() * (h - 4));
    if(wk > 0){ px = cxp; py = cyp; }
    var dirx = 0, diry = -1;
    for(var s = 0; s < g.len; s++){
      grid[py][px] = g.floor;
      if(rnd() < 0.34){
        var d = Math.floor(rnd() * 4);
        dirx = [1,-1,0,0][d]; diry = [0,0,1,-1][d];
      }
      if(rnd() < (g.room == null ? 0.12 : g.room)){ /* ときどき部屋状に広げる */
        for(var oy = -1; oy <= 1; oy++) for(var ox = -1; ox <= 1; ox++){
          var nx2 = px + ox, ny2 = py + oy;
          if(nx2 > 0 && ny2 > 0 && nx2 < w - 1 && ny2 < h - 1) grid[ny2][nx2] = g.floor;
        }
      }
      var nx = px + dirx, ny = py + diry;
      if(nx < 1 || ny < 1 || nx > w - 2 || ny > h - 2){ dirx = -dirx; diry = -diry; continue; }
      px = nx; py = ny;
    }
  }
  /* 入口からの到達距離 */
  var dist = {}, q = [[cxp, cyp, 0]], seen = {};
  seen[cxp + "," + cyp] = 1;
  var far = [cxp, cyp, 0], order = [];
  while(q.length){
    var c = q.shift();
    dist[c[0] + "," + c[1]] = c[2];
    order.push(c);
    if(c[2] > far[2]) far = c;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
      var nx3 = c[0] + d[0], ny3 = c[1] + d[1], key = nx3 + "," + ny3;
      if(seen[key] || nx3 < 0 || ny3 < 0 || nx3 >= w || ny3 >= h) return;
      if(grid[ny3][nx3] !== g.floor) return;
      seen[key] = 1; q.push([nx3, ny3, c[2] + 1]);
    });
  }
  var tiles = grid.map(function(r){ return r.join(""); });
  return {tiles:tiles, up:{x:cxp, y:cyp}, down:{x:far[0], y:far[1]}, order:order, dist:dist};
}
function setTile(tiles, x, y, ch){
  tiles[y] = tiles[y].slice(0, x) + ch + tiles[y].slice(x + 1);
}
/* 洞窟マップを構築(起動時に一度) */
function buildCaves(){
  var a = genCave(MAPS.cave1), b = genCave(MAPS.cave2);
  /* B1 */
  var t1 = a.tiles;
  setTile(t1, a.up.x, a.up.y, "u");
  setTile(t1, a.down.x, a.down.y, "n");
  MAPS.cave1.tiles = t1;
  MAPS.cave1.warps = [
    {x:a.up.x, y:a.up.y, to:"world", tx:25, ty:4, d:"down"},
    {x:a.down.x, y:a.down.y, to:"cave2", tx:b.up.x, ty:b.up.y, d:"down"}
  ];
  MAPS.cave1.npcs = [];
  MAPS.cave1.chests = pickSpots(a, 3).map(function(p, i){
    var c = MAPS.cave1.genPlan.chests[i]; return {x:p[0], y:p[1], id:c.id, item:c.item, gold:c.gold, num:c.num};
  });
  /* B2 */
  var t2 = b.tiles;
  setTile(t2, b.up.x, b.up.y, "u");
  MAPS.cave2.tiles = t2;
  MAPS.cave2.warps = [{x:b.up.x, y:b.up.y, to:"cave1", tx:a.down.x, ty:a.down.y, d:"up"}];
  MAPS.cave2.npcs = [{x:b.down.x, y:b.down.y, d:"down", sp:"pedestal", n:"かぜのオーブ", ev:"orb"}];
  MAPS.cave2.chests = pickSpots(b, 3, [[b.down.x, b.down.y]]).map(function(p, i){
    var c = MAPS.cave2.genPlan.chests[i]; return {x:p[0], y:p[1], id:c.id, item:c.item, gold:c.gold, num:c.num};
  });
}
function pickSpots(gen, n, avoid){
  avoid = avoid || [];
  var cand = gen.order.filter(function(c){
    if(c[2] < 14) return false;
    return !avoid.some(function(a){ return Math.abs(a[0] - c[0]) + Math.abs(a[1] - c[1]) < 3; });
  });
  var out = [], stepN = Math.max(1, Math.floor(cand.length / (n + 1)));
  for(var i = 0; i < n; i++){
    var c = cand[Math.min(cand.length - 1, (i + 1) * stepN)] || cand[cand.length - 1] || gen.order[gen.order.length - 1];
    out.push([c[0], c[1]]);
    avoid.push([c[0], c[1]]);
  }
  return out;
}

function loadMap(id, x, y, dir){
  var m = MAPS[id];
  Game.mapId = id; Game.map = m;
  Game.tiles = m.tiles; Game.w = m.w; Game.h = m.h;
  Game.player.x = x; Game.player.y = y;
  if(dir) Game.player.dir = dir;
  Game.player.ox = 0; Game.player.oy = 0; Game.player.moving = false; Game.player.mt = 0;
  Game.noWarp = {x:x, y:y};
  /* NPC */
  Game.npcs = (m.npcs || []).map(function(n){
    return {x:n.x, y:n.y, hx:n.x, hy:n.y, dir:n.d || "down", sp:n.sp, n:n.n, l:n.l, ev:n.ev,
            shop:n.shop, cost:n.cost, move:n.move, wt:rndf(1, 3), ox:0, oy:0, mt:0, moving:false, frame:0, def:n};
  });
  Game.chests = (m.chests || []).map(function(c){ return c; });
  Game.signs = m.signs || [];
  bake();
  Snd.play(m.bgm || (m.kind === "cave" ? "cave" : "field"));
  if(m.kind === "town" || m.kind === "in"){ /* 町・城は最後に立ち寄った場所として記録 */ }
  if(m.save){ Game.lastTown = {map:id, x:x, y:y}; }
  centerCam(true);
}
function bake(){
  var c = document.createElement("canvas");
  c.width = Game.w * TS; c.height = Game.h * TS;
  var g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  Game.water = [];
  for(var y = 0; y < Game.h; y++){
    for(var x = 0; x < Game.w; x++){
      var ch = Game.tiles[y][x];
      if(ch === "~"){ Game.water.push([x, y]); }
      drawTile(g, ch, x * TS, y * TS, x, y);
    }
  }
  Game.baked = c;
}
function tileAt(x, y){
  if(x < 0 || y < 0 || x >= Game.w || y >= Game.h) return "M";
  return Game.tiles[y][x];
}
function solidAt(x, y){
  var t = TILE[tileAt(x, y)];
  if(!t || t.s) return true;
  for(var i = 0; i < Game.npcs.length; i++){
    var n = Game.npcs[i];
    if(n.x === x && n.y === y) return true;
  }
  for(var j = 0; j < Game.chests.length; j++){
    var c = Game.chests[j];
    if(c.x === x && c.y === y) return true;
  }
  return false;
}
function centerCam(snap){
  var pw = Game.w * TS, ph = Game.h * TS;
  var tx = Game.player.x * TS + Game.player.ox + 8 - SCR_W / 2;
  var ty = Game.player.y * TS + Game.player.oy + 8 - SCR_H / 2;
  tx = pw <= SCR_W ? (pw - SCR_W) / 2 : clamp(tx, 0, pw - SCR_W);
  ty = ph <= SCR_H ? (ph - SCR_H) / 2 : clamp(ty, 0, ph - SCR_H);
  Game.cam.x = tx; Game.cam.y = ty;
}
var DIRV = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]};

/* ================================================================
   10. フィールド更新
   ================================================================ */
function updateField(dt){
  var p = Game.player;
  if(p.moving){
    p.mt += dt / 0.16;
    var d = DIRV[p.dir];
    if(p.mt >= 1){
      p.x += d[0]; p.y += d[1];
      p.ox = 0; p.oy = 0; p.mt = 0; p.moving = false;
      p.frame ^= 1;
      onStep();
    } else {
      p.ox = d[0] * TS * p.mt; p.oy = d[1] * TS * p.mt;
    }
  }
  if(!Game.lock && !p.moving){
    var k = Input.take();
    if(k === "confirm") interact();
    else if(k === "cancel") openMenu();
    /* 押しっぱなしだけでなく、短いタップでも1歩あるく */
    var d = Input.dirOf() || (DIRV[k] ? k : null);
    if(d && !Game.lock){
      p.dir = d;
      var v = DIRV[d];
      if(!solidAt(p.x + v[0], p.y + v[1])){ p.moving = true; p.mt = 0; }
      else { p.anim += dt; p.frame = (p.anim * 6 | 0) & 1; }
    }
  }
  /* NPC徘徊 */
  Game.npcs.forEach(function(n){
    if(n.moving){
      n.mt += dt / 0.22;
      var v = DIRV[n.dir];
      if(n.mt >= 1){ n.x += v[0]; n.y += v[1]; n.ox = 0; n.oy = 0; n.moving = false; n.frame ^= 1; }
      else { n.ox = v[0] * TS * n.mt; n.oy = v[1] * TS * n.mt; }
      return;
    }
    if(!n.move || Game.lock) return;
    n.wt -= dt;
    if(n.wt > 0) return;
    n.wt = rndf(1.4, 3.4);
    var dirs = ["up","down","left","right"], d2 = pick(dirs), v2 = DIRV[d2];
    var nx = n.x + v2[0], ny = n.y + v2[1];
    n.dir = d2;
    if(Math.abs(nx - n.hx) > 2 || Math.abs(ny - n.hy) > 2) return;
    if(solidAt(nx, ny)) return;
    if(nx === Game.player.x && ny === Game.player.y) return;
    n.moving = true; n.mt = 0;
  });
  centerCam();
}
function onStep(){
  var p = Game.player;
  if(Game.noWarp && (Game.noWarp.x !== p.x || Game.noWarp.y !== p.y)) Game.noWarp = null;
  Game.steps++; Game.sinceBattle++;
  var t = tileAt(p.x, p.y);
  if(t === "d") Snd.se("door");
  /* ワープ */
  var ws = Game.map.warps || [];
  for(var i = 0; i < ws.length; i++){
    var w = ws[i];
    if(w.x === p.x && w.y === p.y && !(Game.noWarp && Game.noWarp.x === p.x && Game.noWarp.y === p.y)){
      doWarp(w);
      return;
    }
  }
  /* トヘロスの効果は歩くほど薄れる */
  if(Game.flags.repel > 0){
    Game.flags.repel--;
    if(Game.flags.repel === 0) msgOnce("トヘロスの ききめが きれた!");
    return;
  }
  /* エンカウント */
  var enc = Game.map.enc;
  if(enc && Game.sinceBattle > 3 && Math.random() < enc.rate){
    var key = enc.troop(p.x, p.y);
    startEncounter(key);
  }
}
async function doWarp(w){
  if(w.gate === "orb" && !Game.flags.orb){
    Game.lock = true;
    UI.flash(200, "#8a5ae0");
    await UI.say("まっ黒な 結界が ゆくてを はばむ!\nちからずくでは 入れない……。");
    UI.closeMsg();
    Game.lock = false;
    return;
  }
  Game.lock = true;
  Snd.se(TILE[tileAt(w.x, w.y)] && (tileAt(w.x, w.y) === "u" || tileAt(w.x, w.y) === "n") ? "stairs" : "door");
  await UI.fade(true);
  loadMap(w.to, w.tx, w.ty, w.d || "down");
  await sleep(60);
  await UI.fade(false);
  Game.sinceBattle = 0;
  Game.lock = false;
}
/* 目の前を調べる */
function interact(){
  var p = Game.player, v = DIRV[p.dir];
  var fx = p.x + v[0], fy = p.y + v[1];
  var hit = findAt(fx, fy);
  if(!hit && tileAt(fx, fy) === "c"){ hit = findAt(fx + v[0], fy + v[1]); }
  if(!hit && tileAt(fx, fy) === "A"){ hit = findAt(fx + v[0], fy + v[1]); }
  if(hit) return runInteract(hit, p.dir);
  var t = tileAt(fx, fy);
  if(t === "b"){ msgOnce("たくさんの 本が ならんでいる。\n……まおうの でんしょうの ようだ。"); return; }
  if(t === "j"){ msgOnce("つぼの なかを しらべた。\n……なにも 入っていない。"); return; }
  if(t === "A"){ msgOnce("女神像が しずかに ほほえんでいる。"); return; }
}
function findAt(x, y){
  for(var i = 0; i < Game.npcs.length; i++) if(Game.npcs[i].x === x && Game.npcs[i].y === y) return {k:"npc", o:Game.npcs[i]};
  for(var j = 0; j < Game.chests.length; j++) if(Game.chests[j].x === x && Game.chests[j].y === y) return {k:"chest", o:Game.chests[j]};
  var sg = Game.signs || [];
  for(var s = 0; s < sg.length; s++) if(sg[s].x === x && sg[s].y === y) return {k:"sign", o:sg[s]};
  return null;
}
async function msgOnce(text){
  Game.lock = true;
  await UI.say(text);
  UI.closeMsg();
  Game.lock = false;
}
var OPP = {up:"down", down:"up", left:"right", right:"left"};
async function runInteract(hit, pdir){
  Game.lock = true;
  Input.clear();
  try{
    if(hit.k === "sign"){ await UI.say(hit.o.t); }
    else if(hit.k === "chest"){ await openChest(hit.o); }
    else {
      var n = hit.o;
      n.dir = OPP[pdir];                    /* 話しかけると こちらを向く */
      if(n.ev) await EVENTS[n.ev](n);
      else if(n.l) await UI.sayAll(n.l.map(fillName), {who:n.n});
    }
  } finally {
    UI.closeMsg();
    Input.clear();
    Game.lock = false;
  }
}
function fillName(s){ return String(s).replace(/\{hero\}/g, Game.party[0] ? Game.party[0].n : "アレン"); }
async function openChest(c){
  if(Game.opened[c.id]){ await UI.say("たからばこは からっぽだ。"); return; }
  Game.opened[c.id] = 1;
  Snd.se("chest");
  if(c.gold){
    Game.gold += c.gold;
    await UI.say("たからばこを あけた!\n" + c.gold + " ゴールドを 手に入れた!");
  } else {
    var it = ITEMS[c.item], num = c.num || 1;
    var ok = true;
    for(var i = 0; i < num; i++) if(!addItem(c.item)) ok = false;
    await UI.say("たからばこを あけた!\n" + it.n + (num > 1 ? " × " + num : "") + " を 手に入れた!" + (ok ? "" : "\n……もちものが いっぱいだ!"));
  }
}

/* ================================================================
   11. フィールド描画
   ================================================================ */
function drawField(){
  var g = cx;
  g.save();
  var sx = 0, sy = 0;
  if(Game.shake > 0){ sx = rndf(-Game.shake, Game.shake); sy = rndf(-Game.shake, Game.shake); }
  g.translate(-Math.round(Game.cam.x) + sx, -Math.round(Game.cam.y) + sy);
  g.fillStyle = "#000"; g.fillRect(Game.cam.x - 8, Game.cam.y - 8, SCR_W + 16, SCR_H + 16);
  g.drawImage(Game.baked, 0, 0);
  /* 水アニメ */
  var x0 = Math.floor(Game.cam.x / TS) - 1, x1 = x0 + 18, y0 = Math.floor(Game.cam.y / TS) - 1, y1 = y0 + 16;
  Game.water.forEach(function(w){
    if(w[0] < x0 || w[0] > x1 || w[1] < y0 || w[1] > y1) return;
    drawTile(g, "~", w[0] * TS, w[1] * TS, w[0], w[1]);
  });
  /* 宝箱 */
  Game.chests.forEach(function(c){
    var X = c.x * TS, Y = c.y * TS;
    var open = Game.opened[c.id];
    P(g, X + 2, Y + 14, 12, 2, "rgba(0,0,0,.3)");
    P(g, X + 2, Y + 7, 12, 8, "#a5744a");
    P(g, X + 2, Y + 7, 12, 1, "#c99a68");
    if(open){ P(g, X + 1, Y + 2, 14, 4, "#7a5230"); P(g, X + 2, Y + 8, 12, 3, "#3a2818"); }
    else { P(g, X + 1, Y + 4, 14, 5, "#8a5a30"); P(g, X + 1, Y + 4, 14, 1, "#b57c46"); P(g, X + 7, Y + 8, 2, 3, "#e8c65a"); }
  });
  /* キャラ(Y順) */
  var acts = Game.npcs.map(function(n){ return {y:n.y, d:n}; });
  acts.push({y:Game.player.y, d:Game.player, p:1});
  acts.sort(function(a, b){ return a.y - b.y; });
  acts.forEach(function(a){
    var o = a.d, X = o.x * TS + o.ox, Y = o.y * TS + o.oy;
    if(a.p){
      drawActor(g, X, Y, "hero", o.dir, o.moving ? ((o.mt * 2 | 0) & 1) : o.frame, SPR.hero);
      /* 後続の仲間(1マス後ろに影のように) */
    } else if(o.sp === "pedestal"){
      if(!Game.flags.orb) drawPedestal(g, X, Y, Game.t);
      else { P(g, X + 3, Y + 9, 10, 7, "#6e6250"); P(g, X + 3, Y + 9, 10, 1, "#8a7c64"); }
    } else if(o.sp === "statue"){
      drawStatue(g, X, Y);
    } else if(o.sp === "demon"){
      drawDemonNpc(g, X, Y, Game.t);
    } else {
      drawActor(g, X, Y, o.sp, o.dir, o.moving ? ((o.mt * 2 | 0) & 1) : o.frame);
    }
  });
  FX.draw(g);
  g.restore();
  /* 暗闇 */
  if(Game.map && Game.map.dark){
    var px = Game.player.x * TS + Game.player.ox + 8 - Game.cam.x;
    var py = Game.player.y * TS + Game.player.oy + 8 - Game.cam.y;
    var r = 88;
    var grd = g.createRadialGradient(px, py, r * 0.3, px, py, r);
    grd.addColorStop(0, "rgba(0,0,0,0)");
    grd.addColorStop(0.6, "rgba(0,0,0,.34)");
    grd.addColorStop(0.85, "rgba(0,0,0,.78)");
    grd.addColorStop(1, "rgba(0,0,0,.96)");
    g.fillStyle = grd;
    g.fillRect(0, 0, SCR_W, SCR_H);
  }
}

async function fieldSpell(){
  while(true){
    var i = await pickMember("じゅもん", function(m){ return "MP " + m.mp + "/" + maxMP(m); });
    if(i < 0) return;
    var m = Game.party[i];
    var list = m.spells.filter(function(s){ return SPELL[s].field; });
    if(!list.length){ await msgIn(m.n + "は じゅもんを つかえない。"); continue; }
    var si = await UI.list({
      cap:m.n + "の じゅもん",
      cols:list.length > 7 ? 2 : 1,
      items:list.map(function(s){ return {l:SPELL[s].n, s:"MP" + SPELL[s].mp, off:m.mp < SPELL[s].mp}; }),
      css:{left:"calc(5*var(--u))", bottom:"calc(5*var(--u))", right:"calc(5*var(--u))",
           maxHeight:"calc(120*var(--u))", overflow:"auto"}
    });
    if(si < 0) continue;
    var sp = SPELL[list[si]];
    if(!alive(m)){ await msgIn(m.n + "は しんでいる!"); continue; }
    if(sp.k === "heal" && sp.tgt === "allA"){
      m.mp -= sp.mp;
      Snd.se("heal");
      var txt = m.n + "は " + sp.n + "を となえた!\n";
      Game.party.forEach(function(t){
        if(!alive(t)) return;
        var v = Math.floor(sp.pow + ST(m, "mag") * (sp.r || 0));
        var b = Math.min(v, maxHP(t) - t.hp); t.hp += b;
        txt += t.n + "の HPが " + b + " かいふく!\n";
      });
      await msgIn(txt.trim());
    } else if(sp.k === "heal"){
      var ti = await pickMember("だれに");
      if(ti < 0) continue;
      var tg = Game.party[ti];
      if(!alive(tg)){ await msgIn(tg.n + "は しんでいる。\n" + sp.n + "は きかない。"); continue; }
      if(tg.hp >= maxHP(tg)){ await msgIn(tg.n + "の HPは まんたんだ。"); continue; }
      m.mp -= sp.mp;
      var val = sp.pow >= 9999 ? maxHP(tg) : Math.floor(sp.pow + ST(m, "mag") * (sp.r || 0));
      var back = Math.min(val, maxHP(tg) - tg.hp); tg.hp += back;
      Snd.se("heal");
      await msgIn(m.n + "は " + sp.n + "を となえた!\n" + tg.n + "の HPが " + back + " かいふくした!");
    } else if(sp.k === "rev"){
      var di = await pickMember("だれに");
      if(di < 0) continue;
      var dt2 = Game.party[di];
      if(alive(dt2)){ await msgIn(dt2.n + "は げんきだ。"); continue; }
      m.mp -= sp.mp;
      if(Math.random() < sp.rate){
        dt2.hp = Math.max(1, Math.floor(maxHP(dt2) / 2));
        Snd.se("levelup");
        await msgIn(m.n + "は " + sp.n + "を となえた!\n" + dt2.n + "は いきかえった!");
      } else {
        Snd.se("err");
        await msgIn(m.n + "は " + sp.n + "を となえた!\nしかし なにも おこらなかった……。");
      }
    } else if(sp.k === "cure"){
      var ci = await pickMember("だれに");
      if(ci < 0) continue;
      var ct = Game.party[ci];
      var hit = sp.cure === "any" ? !!ct.status : ct.status === sp.cure;
      if(!hit){ await msgIn("なにも おこらなかった。"); continue; }
      m.mp -= sp.mp;
      var was = ct.status === "poison" ? "どく" : "ねむり";
      ct.status = null;
      Snd.se("heal");
      await msgIn(m.n + "は " + sp.n + "を となえた!\n" + ct.n + "の " + was + "が きえた!");
    } else if(sp.k === "warp"){
      await castFieldWarp(m, sp);
    }
  }
}

async function castFieldWarp(m, sp){
  var kind = sp.warp;
  if(kind === "repel"){
    m.mp -= sp.mp;
    Game.flags.repel = 130;
    Snd.se("spell");
    UI.flash(300, "#bff0d0");
    await msgIn(m.n + "は " + sp.n + "を となえた!\nまものが よってこなくなった!");
    return;
  }
  if(kind === "town"){
    if(Game.map.kind === "town" || Game.map.kind === "in"){ await msgIn("ここでは つかえない。"); return; }
    m.mp -= sp.mp;
    Snd.se("spell");
    await UI.say(m.n + "は " + sp.n + "を となえた!\nそらへ まいあがった!");
    UI.closeMsg();
    await UI.fade(true);
    loadMap(Game.lastTown.map, Game.lastTown.x, Game.lastTown.y, "up");
    await UI.fade(false);
    return;
  }
  /* リレミト: ダンジョンの外へ */
  var esc = Game.map.escape;
  if(!esc){ await msgIn("ここでは つかえない。"); return; }
  m.mp -= sp.mp;
  Snd.se("stairs");
  await UI.say(m.n + "は " + sp.n + "を となえた!\nまばゆい ひかりに つつまれた!");
  UI.closeMsg();
  await UI.fade(true);
  loadMap(esc.to, esc.x, esc.y, "down");
  await UI.fade(false);
}

async function useItemField(key){
  var it = ITEMS[key];
  if(it.field === "wing"){
    if(Game.map.kind === "town" || Game.map.kind === "in"){ await msgIn("ここでは つかえない。"); return; }
    delItem(key);
    Snd.se("spell");

    UI.closeMsg();
    await UI.fade(true);
    loadMap(Game.lastTown.map, Game.lastTown.x, Game.lastTown.y, "up");
    await UI.fade(false);
    return;
  }
  var ti = await pickMember("だれに");
  if(ti < 0) return;
  var t = Game.party[ti];
  if(it.revive){
    if(alive(t)){ await msgIn(t.n + "は げんきだ。"); return; }
    delItem(key); t.hp = maxHP(t);
    Snd.se("levelup");
    await msgIn(t.n + "は いきかえった!");
    return;
  }
  if(!alive(t)){ await msgIn(t.n + "には きかなかった。"); return; }
  if(it.heal){
    if(t.hp >= maxHP(t)){ await msgIn(t.n + "の HPは まんたんだ。"); return; }
    delItem(key);
    var v = Math.min(it.heal + rndInt(-3, 3), maxHP(t) - t.hp); t.hp += v;
    Snd.se("heal");
    await msgIn(ITEMS[key].n + "を つかった!\n" + t.n + "の HPが " + v + " かいふくした!");
  } else if(it.mp){
    if(t.mp >= maxMP(t)){ await msgIn(t.n + "の MPは まんたんだ。"); return; }
    delItem(key);
    var v2 = Math.min(it.mp, maxMP(t) - t.mp); t.mp += v2;
    Snd.se("heal");
    await msgIn(ITEMS[key].n + "を つかった!\n" + t.n + "の MPが " + v2 + " かいふくした!");
  } else if(it.cure){
    if(t.status !== it.cure){ await msgIn("なにも おこらなかった。"); return; }
    delItem(key); t.status = null;
    Snd.se("heal");
    await msgIn(t.n + "の " + (it.cure === "poison" ? "どく" : "ねむり") + "が なおった!");
  }
}

function saveData(){
  var d = {
    v:1, map:Game.mapId, x:Game.player.x, y:Game.player.y, dir:Game.player.dir,
    gold:Game.gold, bag:Game.bag, flags:Game.flags, opened:Game.opened, lastTown:Game.lastTown,
    steps:Game.steps,
    party:Game.party.map(function(m){
      return {id:m.id, lv:m.lv, exp:m.exp, hp:m.hp, mp:m.mp, eq:m.eq, spells:m.spells, status:m.status};
    })
  };
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(d)); return true; }
  catch(e){ return false; }
}
function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } }
function loadData(){
  var d;
  try{ d = JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){ return false; }
  if(!d) return false;
  Game.gold = d.gold || 0;
  Game.bag = d.bag || [];
  Game.flags = d.flags || {};
  Game.opened = d.opened || {};
  Game.lastTown = d.lastTown || {map:"mira", x:11, y:16};
  Game.steps = d.steps || 0;
  Game.party = (d.party || []).map(function(s){
    var m = makeMember(charDef(s.id));
    m.lv = s.lv; m.exp = s.exp; m.eq = s.eq; m.spells = s.spells; m.status = s.status;
    m.hp = s.hp; m.mp = s.mp;
    return m;
  });
  if(!Game.party.length) return false;
  loadMap(MAPS[d.map] ? d.map : "mira", d.x, d.y, d.dir);
  return true;
}

var SUF = ["A","B","C","D"];
/* 敵の立ち位置。左下のコマンド窓と右のパーティ列を避けて配置する */
var EPOS = {
  1:[[126,116]],
  2:[[100,110],[160,122]],
  3:[[86,102],[134,120],[180,106]],
  4:[[76,100],[112,118],[148,102],[182,120]]
};
var PPOS = [[196,54],[212,80],[196,106],[212,132]];

function makeEnemy(key, i, total, sameCount){
  var d = MONS[key];
  var m = {key:key, d:d, n:d.n, hp:d.hp, max:d.hp, hurt:0, dead:0, status:null, guard:0,
           ai:d.ai || ["atk"], aiI:0, sc:d.boss ? 1.0 : 0.9, ox:0, oy:0, sleep:0};
  if(sameCount > 1) m.n = d.n + SUF[i];
  return m;

/* 弱体を反映した敵の実効ステータス */
function edef(e){ return e.d.def * (e.defDown ? 0.55 : 1); }
function eatk(e){ return e.d.atk * (e.atkDown ? 0.68 : 1); }

function battleBg(){
  var k = Game.map ? Game.map.kind : "field";
  if(Game.mapId === "dark") return "dark";
  if(k === "cave") return "cave";
  if(Game.mapId === "world" && Game.player.y >= 20) return "desert";
  return "field";
}
function drawBattle(){
  var g = cx, B = Game.battle;
  var sx = 0, sy = 0;
  if(Game.shake > 0){ sx = rndf(-Game.shake, Game.shake); sy = rndf(-Game.shake, Game.shake); }
  g.save();
  g.translate(sx, sy);
  /* 背景 */
  var bg = B.bg, grd = g.createLinearGradient(0, 0, 0, 150);
  if(bg === "cave"){ grd.addColorStop(0, "#100c14"); grd.addColorStop(1, "#2b2419"); }
  else if(bg === "dark"){ grd.addColorStop(0, "#150a1e"); grd.addColorStop(1, "#3a1030"); }
  else if(bg === "desert"){ grd.addColorStop(0, "#1a2340"); grd.addColorStop(1, "#7a5a2a"); }
  else { grd.addColorStop(0, "#0d1a3a"); grd.addColorStop(1, "#20406a"); }
  g.fillStyle = grd; g.fillRect(-8, -8, SCR_W + 16, 148);
  /* 地面(画面下端まで塗って、フィールドが透けないようにする) */
  var gc = bg === "cave" ? "#3a3128" : bg === "dark" ? "#2a1030" : bg === "desert" ? "#c2a05e" : "#2f6b33";
  P(g, -8, 132, SCR_W + 16, SCR_H, gc);
  P(g, -8, 132, SCR_W + 16, 2, shade(gc, 26));
  for(var i = 0; i < 22; i++){
    var hx = hash2(i, 3) * SCR_W, hy = 136 + hash2(i, 9) * 26;
    P(g, hx, hy, 3, 1, shade(gc, -22));
  }
  if(bg === "field" || bg === "desert"){
    for(var s = 0; s < 26; s++){
      var stx = hash2(s, 41) * SCR_W, sty = hash2(s, 77) * 60;
      if(hash2(s, 5) > 0.4) P(g, stx, sty, 1, 1, "rgba(255,255,255,.5)");
    }
  }
  /* 敵 */
  B.enemies.forEach(function(e){
    if(e.dead) return;
    var hurt = e.hurt > 0 && ((e.hurt * 30 | 0) & 1);
    drawMon(g, e.d.art, e.x + e.ox, e.y + e.oy, e.sc, hurt);
    if(e.mark && (Game.t * 4 | 0) % 2){
      var my = e.y - 52 - (e.d.boss ? 30 : 0);
      TRI(g, [e.x - 5, my, e.x + 5, my, e.x, my + 7], "#ffd75e");
      P(g, e.x - 5, my - 2, 10, 2, "#ffd75e");
    }
    if(e.sleep){
      var zt = Game.t * 2;
      P(g, e.x + 14, e.y - 44 + Math.sin(zt) * 2, 5, 1, "#fff");
      P(g, e.x + 16, e.y - 42 + Math.sin(zt) * 2, 1, 3, "#fff");
      P(g, e.x + 14, e.y - 39 + Math.sin(zt) * 2, 5, 1, "#fff");
    }
  });
  /* 味方(サイドビュー) */
  Game.party.forEach(function(m, i){
    var p = PPOS[i];
    if(!alive(m)){
      P(g, p[0], p[1] + 10, 16, 5, "rgba(0,0,0,.35)");
      P(g, p[0] + 2, p[1] + 8, 12, 4, "#5a4a4a");
      P(g, p[0] + 4, p[1] + 4, 2, 5, "#8a7a7a");
      return;
    }
    var hurt = m.hurt > 0 && ((m.hurt * 30 | 0) & 1);
    if(hurt) g.globalAlpha = 0.4;
    var pal = SPR[m.id] || SPR.hero;
    drawActor(g, p[0] + (m.ox || 0), p[1] + (m.oy || 0), m.id, "left", m.bframe || 0, pal);
    g.globalAlpha = 1;
  });
  FX.draw(g);
  g.restore();
}
function partyPanel(){
  var html = '<table>';
  for(var r = 0; r < 2; r++){
    html += "<tr>";
    for(var c2 = 0; c2 < 2; c2++){
      var m = Game.party[r * 2 + c2];
      if(!m){ html += "<td></td><td></td>"; continue; }
      var dead = !alive(m);
      html += '<td class="nm" style="color:' + (dead ? "#c86a6a" : m.__act ? "var(--gold)" : "#fff") + '">' + esc(m.n) + '</td>' +
              '<td class="n"><span class="lbl">H</span><span style="color:' + hpColor(m) + '">' + m.hp + '</span>' +
              '<span class="lbl"> M</span><span style="color:var(--mp)">' + m.mp + '</span></td>';
    }
    html += "</tr>";
  }
  html += "</table>";
  return html;
}
function refreshPanel(){
  if(Game.battle && Game.battle.panel) Game.battle.panel.innerHTML = partyPanel();
}
/* 戦闘ログ。wait=true で決定待ち、それ以外は自動送り(キーで早送りできる) */
async function bMsg(text, wait){
  await UI.say(text, {nowait:!wait, speed:9});
  if(wait) return;
  var d = Math.min(680, 170 + text.length * 15);
  await Promise.race([sleep(d), Input.wait(["confirm","cancel"]).then(function(){ Input.clear(); })]);

/* --- 戦闘開始 --- */
async function startEncounter(troopKey){
  var troop = pick(TROOPS[troopKey]);
  await runBattle(troop, {});
}
async function runBattle(keys, opt){
  opt = opt || {};
  Game.lock = true;
  Game.scene = "battleIn";
  Snd.stop();
  Snd.se("enc");
  /* 突入演出 */
  for(var f = 0; f < 4; f++){ UI.flash(90, f % 2 ? "#7fd0ff" : "#fff"); await sleep(95); }
  await UI.fade(true);
  UI.closeMsg();
  UI.clearAll();
  FX.clear();

  var counts = {};
  keys.forEach(function(k){ counts[k] = (counts[k] || 0) + 1; });
  var seen = {};
  var enemies = keys.map(function(k, i){
    seen[k] = (seen[k] || 0);
    var e = makeEnemy(k, seen[k], keys.length, counts[k]);
    seen[k]++;
    return e;
  });
  var pos = EPOS[Math.min(4, enemies.length)];
  enemies.forEach(function(e, i){
    e.x = pos[i][0]; e.y = pos[i][1];
    if(e.d.boss){ e.x = 118; e.y = 128; }
  });
  Game.party.forEach(function(m){
    m.buffAtk = 0; m.buffDef = 0; m.buffSpd = 0; m.guard = 0; m.charge = 0;
    m.cover = null; m.reckless = 0; m.hurt = 0; m.ox = 0; m.oy = 0; m.bframe = 0;
  });

  Game.battle = {enemies:enemies, bg:battleBg(), boss:enemies.some(function(e){ return e.d.boss; }), turn:0};
  Game.scene = "battle";
  Snd.play(Game.battle.boss ? "boss" : "battle");

  /* UI */
  var panel = UI.win({left:"calc(5*var(--u))", right:"calc(5*var(--u))", bottom:"calc(5*var(--u))"}, partyPanel(), "plain");
  panel.id = "partyWin"; panel.classList.add("on");
  Game.battle.panel = panel;
  var msg = UI.openMsg();
  msg.style.top = "calc(5*var(--u))"; msg.style.bottom = "auto"; msg.style.minHeight = "calc(36*var(--u))";
  await UI.fade(false);

  var names = {};
  keys.forEach(function(k){ names[MONS[k].n] = (names[MONS[k].n] || 0) + 1; });
  var nameList = Object.keys(names).map(function(n){ return n + (names[n] > 1 ? " " + names[n] + "たい" : ""); }).join(" と ");
  await bMsg(nameList + "が あらわれた!", false);

  var result = "";
  while(!result){
    Game.battle.turn++;
    var acts = await inputPhase();
    if(acts === null){ /* 逃走成功 */ result = "flee"; break; }
    result = await resolveTurn(acts);
  }
  /* 後始末 */
  await endBattle(result, enemies, opt);
  return result;
}

/* --- コマンド入力 --- */
async function inputPhase(){
  var acts = [], i = 0;
  var living = Game.party.map(function(m, idx){ return idx; }).filter(function(idx){ return alive(Game.party[idx]); });
  while(i < living.length){
    var m = Game.party[living[i]];
    Game.party.forEach(function(p){ p.__act = 0; });
    m.__act = 1; refreshPanel();
    if(m.status === "sleep"){
      acts.push({m:m, k:"sleep"});
      i++;
      continue;
    }
    Input.clear();                        /* 早送りの連打が誤選択にならないように */
    var skillLabel = m.spells.length && SPELL[m.spells[0]].sk ? "とくぎ" : "じゅもん";
    var ci = await UI.list({
      cap:m.n,
      items:[{l:"たたかう"},{l:skillLabel, off:!m.spells.length},{l:"どうぐ", off:!Game.bag.length},{l:"ぼうぎょ"},{l:"にげる"}],
      css:{left:"calc(5*var(--u))", bottom:"calc(54*var(--u))", minWidth:"calc(62*var(--u))"},
      index:m.__last || 0
    });
    if(ci < 0){
      if(i === 0) continue;
      i--; acts.pop();
      continue;
    }
    m.__last = ci;
    if(ci === 0){
      var t = await pickEnemy();
      if(t < 0) continue;
      acts.push({m:m, k:"atk", t:t});
    } else if(ci === 1){
      var sp = await pickSpell(m);
      if(!sp) continue;
      var S = SPELL[sp];
      var tg = null;
      if(S.tgt === "one"){ tg = await pickEnemy(); if(tg < 0) continue; }
      else if(S.tgt === "ally" || S.tgt === "dead"){
        var ai = await pickMember(S.tgt === "dead" ? "だれを" : "だれに");
        if(ai < 0) continue;
        tg = ai;
      }
      acts.push({m:m, k:"spell", sp:sp, t:tg});
    } else if(ci === 2){
      var ii = await pickBattleItem();
      if(ii < 0) continue;
      var key = Game.bag[ii].k, it = ITEMS[key];
      var it2 = null;
      if(it.heal || it.mp || it.cure || it.revive){
        var mi = await pickMember("だれに");
        if(mi < 0) continue;
        it2 = mi;
      }
      acts.push({m:m, k:"item", item:key, t:it2});
    } else if(ci === 3){
      acts.push({m:m, k:"guard"});
    } else if(ci === 4){
      acts.push({m:m, k:"run"});
    }
    i++;
  }
  Game.party.forEach(function(p){ p.__act = 0; });
  refreshPanel();
  return acts;
}
function pickEnemy(){
  var B = Game.battle;
  var live = [];
  B.enemies.forEach(function(e, i){ if(!e.dead) live.push({e:e, i:i}); });
  if(live.length === 1) return Promise.resolve(live[0].i);
  return UI.list({
    cap:"だれを",
    items:live.map(function(o){ return {l:o.e.n}; }),
    css:{right:"calc(5*var(--u))", bottom:"calc(54*var(--u))", minWidth:"calc(62*var(--u))"},
    onMove:function(k){
      B.enemies.forEach(function(e){ e.mark = 0; });
      if(live[k]) live[k].e.mark = 1;
    }
  }).then(function(k){
    B.enemies.forEach(function(e){ e.mark = 0; });
    return k < 0 ? -1 : live[k].i;
  });
}
function pickSpell(m){
  /* 移動じゅもん(ルーラなど)は 戦闘中は出さない */
  var list = m.spells.filter(function(s){ return !SPELL[s].only; });
  return UI.list({
    cap:m.n,
    cols:list.length > 7 ? 2 : 1,
    items:list.map(function(s){
      var S = SPELL[s];
      return {l:S.n, s:S.mp ? "MP" + S.mp : "―", off:m.mp < S.mp};
    }),
    css:{left:"calc(5*var(--u))", bottom:"calc(54*var(--u))",
         minWidth:list.length > 7 ? "calc(140*var(--u))" : "calc(80*var(--u))",
         maxHeight:"calc(104*var(--u))", overflow:"auto"}
  }).then(function(i){ return i < 0 ? null : list[i]; });
}
function pickBattleItem(){
  return UI.list({
    cap:"どうぐ",
    items:Game.bag.map(function(b){ return {l:ITEMS[b.k].n, s:"×" + b.n, off:!(ITEMS[b.k].heal || ITEMS[b.k].mp || ITEMS[b.k].cure || ITEMS[b.k].revive)}; }),
    css:{left:"calc(5*var(--u))", bottom:"calc(54*var(--u))", minWidth:"calc(86*var(--u))", maxHeight:"calc(110*var(--u))", overflow:"auto"}
  });

/* --- ターン解決 --- */
function spdOf(a){
  if(a.e) return a.e.d.spd * rndf(0.8, 1.2);
  return ST(a.m, "spd") * (a.m.buffSpd ? 1.6 : 1) * rndf(0.8, 1.2);
}
async function resolveTurn(acts){
  var B = Game.battle;
  /* にげる は最優先で判定 */
  var runAct = acts.filter(function(a){ return a.k === "run"; });
  if(runAct.length){
    var ps = Game.party.filter(alive).reduce(function(s, m){ return s + ST(m, "spd"); }, 0) / Math.max(1, livingParty().length);
    var es = B.enemies.filter(function(e){ return !e.dead; }).reduce(function(s, e){ return s + e.d.spd; }, 0) / Math.max(1, B.enemies.filter(function(e){ return !e.dead; }).length);
    var chance = B.boss ? 0 : clamp(0.42 + (ps - es) * 0.02, 0.12, 0.92);
    await bMsg(runAct[0].m.n + "は にげだした!");
    if(Math.random() < chance){
      Snd.se("run");
      return "flee";
    }
    await bMsg("しかし まわりこまれて しまった!");
    acts = acts.filter(function(a){ return a.k !== "run"; });
  }
  var all = acts.slice();
  B.enemies.forEach(function(e){ if(!e.dead) all.push({e:e, k:"enemy"}); });
  all.forEach(function(a){ a.__s = spdOf(a); });
  all.sort(function(a, b){ return b.__s - a.__s; });

  for(var i = 0; i < all.length; i++){
    var a = all[i];
    if(a.m && !alive(a.m)) continue;
    if(a.e && a.e.dead) continue;
    if(livingParty().length === 0) return "lose";
    if(B.enemies.every(function(e){ return e.dead; })) return "win";
    if(a.e) await enemyAct(a.e);
    else await partyAct(a);
    await sleep(90);
  }
  /* ターン終わりの処理 */
  for(var j = 0; j < Game.party.length; j++){
    var m = Game.party[j];
    m.cover = null; m.reckless = 0;
    if(!alive(m)) continue;
    m.guard = 0;
    if(m.status === "poison"){
      var d = Math.max(1, Math.floor(maxHP(m) / 16));
      m.hp = Math.max(0, m.hp - d);
      refreshPanel();
      UI.pop(PPOS[Game.party.indexOf(m)][0] + 8, PPOS[Game.party.indexOf(m)][1], String(d), "dmg");
      await bMsg(m.n + "は どくに おかされている!");
      if(m.hp <= 0) await downMember(m);
    }
  }
  B.enemies.forEach(function(e){
    e.guard = 0;
    if(e.silence > 0 && --e.silence === 0 && !e.dead) e.silenceEnd = 1;
    if(e.blind > 0 && --e.blind === 0 && !e.dead) e.blindEnd = 1;
  });
  for(var q = 0; q < B.enemies.length; q++){
    var eq = B.enemies[q];
    if(eq.silenceEnd){ eq.silenceEnd = 0; await bMsg(eq.n + "の じゅもんふうじが とけた!"); }
    if(eq.blindEnd){ eq.blindEnd = 0; await bMsg(eq.n + "の まぼろしが きえた!"); }
  }
  if(livingParty().length === 0) return "lose";
  if(B.enemies.every(function(e){ return e.dead; })) return "win";
  return "";
}
function memberIndex(m){ return Game.party.indexOf(m); }
async function stepFwd(m, back){
  m.ox = back ? 0 : -12;
  await sleep(90);
}
async function partyAct(a){
  var m = a.m, B = Game.battle;
  if(a.k === "sleep"){
    if(Math.random() < 0.36){ m.status = null; await bMsg(m.n + "は 目を さました!"); }
    else await bMsg(m.n + "は ねむっている……。");
    return;
  }
  if(a.k === "guard"){
    m.guard = 1;
    Snd.se("guard");
    await bMsg(m.n + "は みを まもっている。");
    return;
  }
  if(a.k === "item"){
    var it = ITEMS[a.item];
    if(!bagCount(a.item)){ await bMsg(m.n + "は どうぐを もっていない!"); return; }
    var t = a.t != null ? Game.party[a.t] : null;
    await bMsg(m.n + "は " + it.n + "を つかった!");
    delItem(a.item);
    if(it.revive && t){
      if(alive(t)) await bMsg("しかし なにも おこらなかった。");
      else { t.hp = maxHP(t); Snd.se("levelup"); FX.rise(PPOS[a.t][0] + 8, PPOS[a.t][1] + 8, "#ffe38a", 14); await bMsg(t.n + "は いきかえった!"); }
    } else if(it.heal && t){
      var v = Math.min(it.heal + rndInt(-3, 3), maxHP(t) - t.hp);
      t.hp += v; Snd.se("heal");
      FX.rise(PPOS[a.t][0] + 8, PPOS[a.t][1] + 8, "#8effa0", 10);
      UI.pop(PPOS[a.t][0] + 8, PPOS[a.t][1], "+" + v, "heal");
      await bMsg(t.n + "の HPが " + v + " かいふくした!");
    } else if(it.mp && t){
      var v2 = Math.min(it.mp, maxMP(t) - t.mp); t.mp += v2; Snd.se("heal");
      await bMsg(t.n + "の MPが " + v2 + " かいふくした!");
    } else if(it.cure && t){
      if(t.status === it.cure){ t.status = null; Snd.se("heal"); await bMsg(t.n + "は げんきに なった!"); }
      else await bMsg("しかし なにも おこらなかった。");
    }
    refreshPanel();
    return;
  }
  if(a.k === "atk"){
    var e = B.enemies[a.t];
    if(!e || e.dead){
      var alt = B.enemies.filter(function(x){ return !x.dead; });
      if(!alt.length) return;
      e = pick(alt);
    }
    await bMsg(m.n + "の こうげき!");
    await stepFwd(m);
    m.bframe = 1;
    var chg = takeCharge(m);
    var crit = Math.random() < 0.055;
    var dmg = crit ? Math.floor(ST(m, "atk") * 1.5 * chg * rndf(0.95, 1.1))
                   : Math.max(1, Math.floor((ST(m, "atk") * 0.95 * chg - edef(e) * (e.guard ? 0.9 : 0.45)) * rndf(0.85, 1.15)));
    if(Math.random() < 0.03){
      Snd.se("miss");
      UI.pop(e.x, e.y - 30, "MISS", "miss");
      await bMsg("しかし ミス! こうげきは はずれた。");
    } else {
      Snd.se(crit ? "crit" : "hit");
      FX.slash(e.x, e.y - 22);
      Game.shake = crit ? 3 : 1.6;
      await hurtEnemy(e, dmg, crit);
      await bMsg(crit ? "かいしんの いちげき!\n" + e.n + "に " + dmg + " のダメージ!" : e.n + "に " + dmg + " のダメージ!");
    }
    m.bframe = 0;
    await stepFwd(m, 1);
    if(e.hp <= 0) await killEnemy(e);
    return;
  }
  if(a.k === "spell"){
    var S = SPELL[a.sp];
    if(m.mp < S.mp){ await bMsg(m.n + "は MPが たりない!"); return; }
    m.mp -= S.mp;
    refreshPanel();
    await bMsg(m.n + "は " + S.n + (S.sk ? "を くりだした!" : "を となえた!"));
    if(S.k === "atk") await castAttack(m, S, a.t);
    else if(S.k === "heal") await castHeal(m, S, a.t);
    else if(S.k === "rev") await castRevive(m, S, a.t);
    else if(S.k === "cure") await castCure(m, S, a.t);
    else if(S.k === "buff") await castBuff(m, S, a.t);
    else if(S.k === "pguard") await castPGuard(m, S);
    else if(S.k === "weak") await castWeak(m, S, a.t);
    else if(S.k === "sleep") await castSleep(m, S, a.t);
    else if(S.k === "death") await castDeath(m, S, a.t);
    else if(S.k === "drain") await castDrain(m, S, a.t);
    else if(S.k === "mdrain") await castMDrain(m, S, a.t);
    else if(S.k === "multi") await castMulti(m, S, a.t);
    else if(S.k === "break") await castBreak(m, S, a.t);
    else if(S.k === "phys") await castPhysAll(m, S);
    else if(S.k === "charge") await castCharge(m, S);
    else if(S.k === "stun") await castStun(m, S);
    else if(S.k === "cover") await castCover(m, S, a.t);
    else if(S.k === "warp") await bMsg("しかし ここでは つかえない!");
    return;
  }
}
function elFx(el, x, y){
  if(el === "fire"){ Snd.se("fire"); FX.burst(x, y - 20, "#ff9a3a", 22, 90); FX.ring(x, y - 20, "#ff6a2a"); }
  else if(el === "ice"){ Snd.se("ice"); FX.burst(x, y - 20, "#9ae8ff", 18, 70); FX.ring(x, y - 20, "#dff4ff"); }
  else if(el === "wind"){ Snd.se("wind"); FX.burst(x, y - 20, "#dff0d8", 20, 110); }
  else if(el === "thunder"){ Snd.se("thunder"); FX.bolt(x, y - 10); UI.flash(200, "#eaf4ff"); }
  else if(el === "blast"){ Snd.se("fire"); FX.burst(x, y - 20, "#ffe38a", 26, 120); FX.ring(x, y - 20, "#fff"); }
  else if(el === "dark"){ Snd.se("spell"); FX.burst(x, y - 20, "#c86aff", 22, 90); }
  else { Snd.se("spell"); FX.burst(x, y - 20, "#a8d8ff", 16, 80); }
}
async function castAttack(m, S, ti){
  var B = Game.battle;
  var targets = S.tgt === "allE" ? B.enemies.filter(function(e){ return !e.dead; }) : [B.enemies[ti]];
  targets = targets.filter(function(e){ return e && !e.dead; });
  if(!targets.length){ targets = B.enemies.filter(function(e){ return !e.dead; }).slice(0, 1); }
  if(!targets.length) return;
  targets.forEach(function(e){ elFx(S.el, e.x, e.y); });
  Game.shake = 2.4;
  await sleep(240);
  var txt = "";
  for(var i = 0; i < targets.length; i++){
    var e = targets[i];
    var dmg = Math.max(1, Math.floor((S.pow + ST(m, "mag") * S.r) * rndf(0.88, 1.12)));
    if(e.d.boss) dmg = Math.floor(dmg * 0.82);
    await hurtEnemy(e, dmg, false);
    txt += e.n + "に " + dmg + " のダメージ!\n";
  }
  await bMsg(txt.trim());
  for(var j = 0; j < targets.length; j++) if(targets[j].hp <= 0) await killEnemy(targets[j]);
}
async function castHeal(m, S, ti){
  var list = S.tgt === "allA" ? Game.party.filter(alive) : [Game.party[ti]];
  var txt = "";
  Snd.se("heal");
  for(var i = 0; i < list.length; i++){
    var t = list[i];
    if(!t || !alive(t)){ txt += "しかし なにも おこらなかった。\n"; continue; }
    var idx = memberIndex(t);
    FX.rise(PPOS[idx][0] + 8, PPOS[idx][1] + 8, "#8effa0", 12);
    var val = S.pow >= 9999 ? maxHP(t) : Math.floor((S.pow + ST(m, "mag") * (S.r || 0)) * rndf(0.92, 1.08));
    var back = Math.min(val, maxHP(t) - t.hp);
    t.hp += back;
    UI.pop(PPOS[idx][0] + 8, PPOS[idx][1], "+" + back, "heal");
    txt += t.n + "の HPが " + back + " かいふく!\n";
  }
  refreshPanel();
  await sleep(200);
  await bMsg(txt.trim());
}
async function castRevive(m, S, ti){
  var t = Game.party[ti];
  if(!t || alive(t)){ await bMsg("しかし なにも おこらなかった。"); return; }
  if(Math.random() < S.rate){
    t.hp = S.full ? maxHP(t) : Math.max(1, Math.floor(maxHP(t) / 2));
    Snd.se("levelup");
    FX.rise(PPOS[ti][0] + 8, PPOS[ti][1] + 8, "#ffe38a", 16);
    refreshPanel();
    await bMsg(t.n + "は いきかえった!");
  } else {
    Snd.se("err");
    await bMsg("しかし むなしく ひびいた……。");
  }
}
var BUFF_KEY = {def:"buffDef", atk:"buffAtk", spd:"buffSpd"};
var BUFF_NAME = {def:"みのまもり", atk:"こうげきりょく", spd:"すばやさ"};

async function castSleep(m, S, ti){

  FX.rise(e.x, e.y - 20, "#c8b0ff", 12);

async function castMulti(m, S, ti){
  var B = Game.battle, chg = takeCharge(m);
  if(S.reckless) m.reckless = 1;
  for(var h = 0; h < S.hits; h++){
    var live = B.enemies.filter(function(e){ return !e.dead; });
    if(!live.length) break;
    var e = (S.hits > 1 && live.length > 1) ? pick(live) : (B.enemies[ti] && !B.enemies[ti].dead ? B.enemies[ti] : live[0]);
    await stepFwd(m);
    if(S.miss && Math.random() < S.miss){
      Snd.se("miss");
      UI.pop(e.x, e.y - 30, "MISS", "miss");
      await bMsg("しかし ミス! こうげきは はずれた。");
      await stepFwd(m, 1);
      continue;
    }
    var crit = Math.random() < (S.crit || 0.05);
    Snd.se(crit ? "crit" : "hit");
    FX.slash(e.x, e.y - 22);
    Game.shake = crit ? 3 : 1.8;
    var dmg = Math.max(1, Math.floor((ST(m, "atk") * S.r * chg - edef(e) * 0.4) * rndf(0.85, 1.15)));
    if(crit) dmg = Math.floor(dmg * 1.5);
    await hurtEnemy(e, dmg, crit);
    await bMsg((crit ? "かいしんの いちげき!\n" : "") + e.n + "に " + dmg + " のダメージ!");
    await stepFwd(m, 1);
    if(e.hp <= 0) await killEnemy(e);
  }
  if(S.reckless) await bMsg(m.n + "は みを すてて とびこんだ!\nつぎの こうげきを うけやすい!");
}
async function castBreak(m, S, ti){

  Snd.se("crit");
  FX.slash(e.x, e.y - 22);
  Game.shake = 3;

  e.defDown = 1;
  await bMsg(e.n + "に " + dmg + " のダメージ!\n" + e.n + "の みのまもりが さがった!");

  if(e.hp <= 0) await killEnemy(e);
}
async function castPhysAll(m, S){

  Snd.se("wind");
  live.forEach(function(e){ FX.slash(e.x, e.y - 22); });

  for(var i = 0; i < live.length; i++){

/* --- 敵の弱体 ルカニ / ヘナトス / マヌーサ / マホトーン --- */
async function castWeak(m, S, ti){

  Snd.se("spell");
  FX.ring(e.x, e.y - 20, "#c8a0ff");

  else if(S.stat === "acc"){ e.blind = rndInt(3, 5); await bMsg(e.n + "は まぼろしを 見ている!\nこうげきが 当たりにくい!"); }
  else { e.silence = rndInt(3, 5); await bMsg(e.n + "は じゅもんを ふうじられた!"); }
}

async function castDeath(m, S, ti){

                              : [B.enemies[ti]].filter(function(e){ return e && !e.dead; });

/* --- HP吸収 ドレイン --- */
async function castDrain(m, S, ti){

    var alt = Game.battle.enemies.filter(function(x){ return !x.dead; });

  if(e.d.boss) dmg = Math.floor(dmg * 0.82);

  m.hp += back;

  refreshPanel();
  await bMsg(e.n + "に " + dmg + " のダメージ!" + (back > 0 ? "\n" + m.n + "は " + back + " HPを すいとった!" : ""));

}
